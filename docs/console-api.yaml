  /api/v1/mtr/snapshots/{id}/traces:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      operationId: listPathTraces
      tags: [observability]
      summary: The individual traces that walked one route, newest first.
      description: >-
        A route row folds every trace that took that path into one entry with a
        `traceCount`; these are the traces that count was counted over, each
        with its OWN clock and its own per-hop readings. The route's hop table
        is the last reading folded into it -- two traces a day apart down the
        same route are two different sets of RTTs.


        Scoped to the snapshot's own [firstSeen, lastSeen] window, so the scan
        is bounded by the thing being asked about. Inside that window a trace is
        returned only when its RECOMPUTED path identity equals this snapshot's:
        two routes can interleave in time (a flapping hop alternates between
        them), and a trace listed under a route it did not walk would be worse
        than no list. `scanned` reports how many stored traces the window
        yielded before that filter, so "5 of 147" cannot be misread as loss.


        Traces live in `check_results` and are subject to the RUN retention
        sweep, not the path-history one -- a route can outlive the traces behind
        it, and then this returns an empty list for a non-zero `traceCount`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of traces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathTraceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

