        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createAnnotation
      tags: [observability]
      summary: Pin one mark. There is no update -- a mark is not a document.
      description: >-
        createdBy is the SERVER's view of the authenticated subject
        ("user:<id>", "token:<id>"), never a body field. The audit row for this
        route records the scope ONLY: the text is free-form operator prose and
        never enters the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationRequest"
      responses:
        "201":
          description: Annotation created.
          headers:
            Location:
              description: Permalink to the new annotation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
