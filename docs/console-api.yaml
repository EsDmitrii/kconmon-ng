  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [administration]
      summary: Every configured outbound endpoint. ADMIN only.
      description: >-
        UNPAGED and therefore carrying no nextCursor: the row count is endpoints
        an operator typed, not a function of time. The secret is WRITE-ONLY and
        appears in NO response -- `hasSecret` plus the last delivery outcome
        (lastStatus/lastAttempt/failures) is everything a reader learns. All six
        webhook routes need the single `webhooks:manage` permission, held by
        admin alone: an endpoint row is credential-adjacent, the tokens:manage
        and rbac:manage posture.
      responses:
        "200":
          description: Every configured endpoint, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createWebhook
      tags: [administration]
      summary: Declare one endpoint. The secret is REQUIRED and write-only.
      description: >-
        Every delivery is signed, so an endpoint without a secret could never
        deliver and `secret` is required here. The console encrypts it at rest
        with console.webhooks.encryptionKey; that key is OPTIONAL at boot, so a
        console without one answers 503 NAMING the key rather than failing to
        start. The audit row records name and events ONLY -- never the secret,
        and never the url (a hook URL routinely embeds a token in its own path).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
      responses:
        "201":
          description: Webhook created. The response carries no secret.
          headers:
            Location:
              description: Permalink to the new endpoint.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: >-
            No database (database.existingSecret) or no encryption key
            (console.webhooks.encryptionKey). The detail names which.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      operationId: getWebhook
      tags: [administration]
      summary: One endpoint, with hasSecret instead of the secret.
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateWebhook
      tags: [administration]
      summary: Replace one endpoint in full -- except the secret.
      description: >-
        A full replace like every other PUT here, with ONE exception: `secret`
        is three-state. ABSENT keeps the stored secret (which is what makes
        re-pointing a URL or narrowing an event filter possible without
        re-typing a secret the operator may not have); an EMPTY STRING is 422,
        because reading it as "keep" or as "clear" would both be guesses; a
        non-empty value replaces it. Keeping a secret needs no cipher, so an
        update that omits it succeeds even with no encryption key configured --
        only one that replaces it answers 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
      responses:
        "200":
          description: The endpoint as stored. No secret in the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteWebhook
      tags: [administration]
      summary: Remove one endpoint.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/webhooks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      operationId: testWebhook
      tags: [administration]
      summary: Enqueue one signed ping so an operator can verify an endpoint.
      description: >-
        202, not 200: delivery is asynchronous with a retry ladder, so the only
        honest thing this can report is that the work was accepted. The OUTCOME
        arrives on the endpoint row -- read it back from GET
        /api/v1/webhooks/{id} as lastStatus/lastAttempt/failures. Signing the
        ping needs the secret unsealed, so a console with no
        console.webhooks.encryptionKey answers 503 naming the key.


        The ping is a WebhookPayload with `event: "test"` and a synthetic
        incident -- the SAME envelope a real notification uses, so a receiver
        needs one parser rather than two. Unlike a real notification it ignores
        both the enabled flag and the event filter: an operator tests an
        endpoint precisely when they are about to enable it. ONE attempt, no
        retry ladder.
      responses:
        "202":
          description: Test delivery enqueued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: >-
            No database (database.existingSecret) or no encryption key
            (console.webhooks.encryptionKey). The detail names which.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/alert-rules:
    get:
      operationId: listAlertRules
      tags: [configuration]
      summary: Every console-managed alert rule, ordered by name.
      description: >-
        UNPAGED and therefore carrying no nextCursor: the row count is rules an
        operator configured, not a function of how long the system has been
        running -- ListWebhooks' reasoning. `renderedExpr` is what the SERVER
        rendered from the builder fields (the console never accepts an
        expression on a template rule), and syncStatus/syncMessage/lastSyncedAt
        are the reconciler's outcomes, read-only on every route here.
      responses:
        "200":
          description: Every configured rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createAlertRule
      tags: [configuration]
      summary: Declare one rule. The server renders the expression before storing it.
      description: >-
        The order is the contract: RENDER, then store. A row whose renderedExpr
        came from a different version of its own params is what the store's
        write payload refuses to allow, so the one HTTP write path renders on
        the way in -- which also means an unrenderable rule is a 422 naming the
        param, at write time, instead of a stored row that first reports a
        problem a minute later as a per-rule sync error.


        Note that the store's `kind` set and the renderer's template set are not
        identical: `cert-expiry` is accepted by the column's CHECK and has no
        template, so it is rejected here with a 422 naming it.


        A successful write nudges the reconciler (a non-blocking, coalescing
        kick) so the rule reaches the cluster without waiting out the jittered
        60s loop. On a console with alerting off the write still succeeds -- the
        rule lives in PostgreSQL and nothing is applying it. The audit row
        records the rule NAME and nothing else: params can carry a raw PromQL
        expression, and labels/annotations carry operator-typed values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "201":
          description: Rule created, with the server-rendered expression on it.
          headers:
            Location:
              description: Permalink to the new rule.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            A rejected field value, OR a well-formed rule the renderer cannot
            turn into an expression. The detail names the field or the param.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/alert-rules/foreign:
    get:
      operationId: listForeignAlertRules
      tags: [configuration]
      summary: PrometheusRule objects in the namespace that this console does NOT own.
      description: >-
        Read-only in the strongest sense: the console never mutates a foreign
        object under any circumstance, and adoption is an explicit import that
        copies the groups into builder rows and creates a NEW object. Only four
        projected fields are served -- the raw object is somebody else's, its
        annotations can hold anything their tooling put there and its
        expressions name their infrastructure.


        `managedBy` is app.kubernetes.io/managed-by, or "" when the object
        carries no such label: "managed by some other chart" and "managed by
        nobody" are different facts for an operator deciding whether to import.


        Needs no database (the answer comes from the cluster) but does need the
        reconciler -- see the 409 below.
      responses:
        "200":
          description: Every PrometheusRule in the namespace the console does not own, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForeignRuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/AlertingDisabled"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/alert-rules/import:
    post:
      operationId: importForeignAlertRules
      tags: [configuration]
      summary: Adopt a foreign PrometheusRule by COPYING its alerting rules into console rules.
      description: >-
        Adoption COPIES. The foreign object named in the body is never mutated
        and never deleted -- not by this route and not by anything it calls --
        and there is no code path from here to a write against somebody else's
        object. What it does is read that object's spec.groups[].rules[] and
        create console-managed rows from the alerting entries, which the
        console then owns and applies in its OWN PrometheusRule bundle on the
        next reconcile.


        The consequence is worth stating plainly, because the UI says it too:
        after a successful import the same alerts are defined TWICE in the
        cluster -- once by the object its owner still controls, once by the
        console's bundle. Removing the original is that owner's decision, and
        the console will not make it for them.


        Every adopted rule arrives as kind `raw`, carrying the foreign
        expression verbatim in `params.expr`, enabled, with `severity` lifted
        off labels.severity, `for` parsed from the Prometheus duration string
        (composites like "1h30m" included), and labels/annotations copied
        verbatim minus the two names the renderer owns (`severity`, which
        becomes the column, and `kconmon_ng_rule_id`, which the console stamps
        itself).


        PER-ITEM and NON-TRANSACTIONAL, the POST /api/v1/import precedent: one
        entry the store refuses does not roll back the entries before it, and
        the response says which is which. `skipped` is what did NOT become a
        rule (recording rules, names this store's charset rejects, names
        already taken, an unreadable `for`); `notes` is what DID become a rule
        about which the console had to choose something. Zero created with a
        non-empty `skipped` is still a 200 -- the report IS the result, and no
        status code could carry it.


        Names are used AS IS or not at all: adoption never sanitizes or renames,
        because a rule stored under a name its author never wrote is a rule they
        cannot find.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleImportRequest"
      responses:
        "200":
          description: >-
            The adoption report: what was created, what was skipped and why,
            and what was imported with a caveat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No FOREIGN PrometheusRule with that name. An object this console
            already owns answers the same 404: the lookup is the /foreign list,
            which excludes anything carrying the managed-by label, so one of the
            console's own bundles is simply not in the set being searched --
            and re-adopting it would duplicate every rule already stored.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/AlertingDisabled"
        "422":
          description: The body carried no usable `name`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/alert-rules/preview:
    post:
      operationId: previewAlertRule
      tags: [configuration]
      summary: Render a draft rule and report what its expression matches right now.
      description: >-
        This build carries no Prometheus parser dependency, so "is this
        expression valid" is answered by RUNNING it: an instant query that
        errors is an invalid expression, and one that returns N series is the
        preview.


        The two halves fail independently and are reported differently. A RENDER
        failure is a 422 -- there is no expression, so there is nothing partial
        to be honest about. A QUERY failure, or a console with no Prometheus
        configured at all, is a 200 carrying the rendered expression and an
        `error` string: the render succeeded, which is the half the builder form
        is asking about, and refusing the whole request would hide a correct
        expression behind an unrelated outage.


        Gated on alerts:READ, not alerts:manage -- the mirror image of POST
        /api/v1/checks/projection's write row. It persists nothing AND asks
        nothing a reader could not ask directly. It is still a POST and is
        therefore still audited, with an empty {} detail: its body is a draft
        that routinely carries a raw expression.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "200":
          description: >-
            The rendered expression, plus either a series count or an `error`
            saying why the evaluation half did not run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRulePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The rule could not be rendered; the detail names the param.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/alert-rules/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      operationId: getAlertRule
      tags: [configuration]
      summary: One rule, with its rendered expression and sync state.
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateAlertRule
      tags: [configuration]
      summary: Replace one rule's builder fields in full, re-rendering the expression.
      description: >-
        A FULL REPLACE, with no PATCH counterpart: PATCH /api/v1/incidents/{id}
        is the one exception in this API and stays unique to incidents, because
        an incident evolves under collaboration and a rule is a definition one
        person edits in a form. Omitting a field here CLEARS it -- omitting
        `labels` removes every label -- so the form always sends the complete
        rule.


        The store resets the row to syncStatus=unsynced on every update (an
        edited rule is by definition not the rule that was applied), so the
        response's syncStatus flips back the moment anything changes, before the
        kick this route issues has had time to do anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "200":
          description: The rule as stored, with the freshly rendered expression.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            A rejected field value, OR a well-formed rule the renderer cannot
            turn into an expression. The detail names the field or the param.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteAlertRule
      tags: [configuration]
      summary: Remove one rule.
      description: >-
        The ROW is what goes away here. The cluster catches up on the next
        reconcile, which re-renders the bundle from the enabled rules that
        remain and applies it -- the console owns ONE PrometheusRule object
        holding every rule, so a deletion is a smaller bundle, never a delete
        call against the apiserver. The kick this route issues makes that "in a
        moment" rather than "within the jittered interval".
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/alert-rules/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      operationId: syncAlertRules
      tags: [configuration]
      summary: Ask the reconciler for a pass now.
      description: >-
        202, not 200: the kick is a non-blocking, coalescing nudge, so the only
        honest thing this can report is that the work was requested. The OUTCOME
        lands on the rules themselves -- read it back from GET
        /api/v1/alert-rules as syncStatus/syncMessage/lastSyncedAt.


        The route is per-rule but the reconcile is WHOLE-BUNDLE, because the
        console owns one PrometheusRule object holding every enabled rule. The
        id is not a filter; it is the rule the operator was looking at, and it
        is what the audit row records. Existence is still checked, so an id that
        names nothing is a 404 rather than a 202 promising an outcome that never
        arrives.


        A console with prometheus rule sync switched off answers 409, NOT 503 --
        see that response.
      responses:
        "202":
          description: A reconcile was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncKick"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlertingDisabled"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags: [observability]
      summary: The alerts Prometheus is currently firing or pending.
      description: >-
        The console does NOT evaluate anything: Prometheus evaluates, the
        console manages. This is a read of Prometheus's own /api/v1/alerts,
        projected onto this API's vocabulary. `ruleId` is lifted off the
        kconmon_ng_rule_id label the renderer stamps on every managed rule, and
        is absent for an alert this console does not manage -- which is a fact
        worth serving, not a reason to hide the alert.


        Prometheus UNCONFIGURED is a 200 with an empty list and
        promConfigured:false, NOT a 503 -- deliberately unlike GET
        /api/v1/matrix, which answers 503 for the same missing dependency. The
        matrix IS the Prometheus data, so without it there is no answer at all,
        while the firing set is a list that is legitimately empty and whose
        emptiness has two causes promConfigured tells apart. A Prometheus that
        is configured and FAILS is neither, and stays a 502: pretending that is
        an empty firing list would be the most dangerous lie in this API.
      parameters:
        - name: managedOnly
          in: query
          description: >-
            Keep only alerts carrying a kconmon_ng_rule_id label (rules this
            console manages). An unparseable value is 400, never silently
            false -- guessing here would return MORE than was asked for.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >-
            The mapped firing set, or an empty one with promConfigured:false
            when no Prometheus is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/k8s-events:
    get:
      operationId: listK8sEvents
      tags: [observability]
      summary: One page of captured Kubernetes events, newest first.
      description: >-
        READ-ONLY: the rows are written by the console's own cluster event
        reader (console.kubernetesContext.enabled), filtered to nodes in the
        fleet topology and pods in the kconmon namespace -- an unfiltered
        cluster firehose would be a cardinality and privacy bug. This route
        rides `events:read` rather than a permission of its own: these ARE
        events. With a database but no reader enabled the answer is an EMPTY
        PAGE, not a 503 -- "nothing was captured" is a different fact from "this
        endpoint is unavailable".
      parameters:
        - name: name
          in: query
          description: Node or pod name; exact match.
          schema:
            type: string
        - name: kind
          in: query
          description: Exact match. An unknown value is 400, never a silently empty page.
          schema:
            $ref: "#/components/schemas/K8sEventKind"
        - name: type
          in: query
          description: Exact match. An unknown value is 400.
          schema:
            $ref: "#/components/schemas/K8sEventType"
        - name: from
          in: query
          description: RFC3339; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339, exclusive; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of captured Kubernetes events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/audit:
    get:
      operationId: listAuditEntries
      tags: [administration]
      summary: Audit log, newest first.
      description: >-
        `detail` is whatever the per-route allow-list let through -- {} for
        almost everything (SECURITY.md, "The audit log's documented lossiness").
      parameters:
        - name: subjectKind
          in: query
          schema:
            $ref: "#/components/schemas/SubjectKind"
        - name: subjectId
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/export:
    get:
      operationId: exportConfiguration
      tags: [administration]
      summary: The whole declarative configuration as one versioned bundle. ADMIN only.
      description: >-
        Targets, check definitions, check schedules, alert rules, webhooks
        (WITHOUT secrets) and maintenance windows, in dependency order. DATA IS
        NOT INCLUDED: no runs, no results, no events, no incidents, no
        annotations, no MTR snapshots, no k8s events, no audit rows. A bundle is
        what an operator DECLARED, so it can be declared again somewhere else.


        NO SECRET EVER LEAVES THROUGH THIS ROUTE. A webhook exports its name,
        url, events and enabled flag plus a `hasSecret` boolean; the sealed
        signing key appears in no field, and there is no query parameter,
        header or role that changes that.


        ACCESS CONTROL is carried too, but only for a caller who also holds
        `rbac:manage`: the `rbac` section lists custom roles and every binding
        (who holds what, and since when). It is OMITTED rather than emptied for
        a caller with `settings:write` alone, so "absent" and "none defined"
        stay different facts. Bindings export and never import -- see
        POST /api/v1/import.


        Observation fields are stripped per collection: a schedule loses
        lastFiredAt/nextFireAt and lastError/lastErrorAt (scheduler
        bookkeeping and a failure this console saw), an alert rule loses
        syncStatus/syncMessage/lastSyncedAt (the reconciler's view of a cluster
        the destination has never talked to) and a webhook loses
        lastStatus/lastAttempt/failures (delivery outcomes). Maintenance windows
        that have already ENDED are omitted -- a closed window is history.


        Gated on `settings:write`, held by admin alone. One permission for both
        routes and no read/write split, the `webhooks:manage` posture: an export
        is every probe address, every webhook URL and every alert expression
        this console holds, in one file, so there is no audience that should
        read it without being trusted to write it.
      responses:
        "200":
          description: The configuration bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigBundle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/import:
    post:
      operationId: importConfiguration
      tags: [administration]
      summary: Merge a bundle into this console's configuration. ADMIN only.
      description: >-
        Merge by NATURAL KEY, not by id: name for targets, check definitions and
        webhooks, lower(name) for alert rules (migration 00007 makes that
        unique), (definition, kind) for schedules -- which have no name column --
        and (scope, startAt, endAt) for maintenance windows. Present means
        update, absent means create.


        IDS ARE REMAPPED. No store call anywhere accepts a caller-chosen primary
        key, so nothing in a bundle keeps its exported UUID. A definition's
        destinationTargetId and a schedule's definitionId are re-pointed at the
        id this console actually has -- freshly minted for a create, the
        pre-existing row's for an update -- which is also how a bundle
        cross-references a row that already exists here under a different id but
        the same name. A reference in neither the bundle nor this console fails
        THAT ITEM, naming both sides.


        NOT ONE TRANSACTION. Every item is its own statement and an item that
        fails is reported and stepped past, so a bundle of 40 definitions with
        one bad row imports 39 and names the fortieth. The cost is stated
        plainly: a failed import leaves a partially-merged console, which is
        what `dryRun` exists for.


        WEBHOOKS ARE THE ONE ASYMMETRY. A bundle never carries a secret and the
        store refuses a secret-less endpoint (every delivery is signed), so an
        endpoint this console does not already have is SKIPPED with a warning
        naming the remedy -- never created, and never given a fabricated key. An
        endpoint that DOES exist is updated with its stored ciphertext carried
        through untouched.


        MAINTENANCE WINDOWS ARE NEVER UPDATED. The store has no update for them
        by design (a window is two timestamps and a reason; delete-and-recreate
        is the correction path), so an identical window is skipped.


        Audited as ONE row carrying the dryRun flag and the per-collection
        COUNTS. No item names reach the audit log, and the bundle never does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigImportRequest"
      responses:
        "200":
          description: >-
            The per-collection ledger. Identical in shape for a dry run and an
            apply -- that is the point of the dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            No bundle, or a bundle whose `version` this build does not read. The
            detail names the version it was given.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/rbac/permissions:
    get:
      operationId: listPermissions
      tags: [administration]
      summary: The static, compiled-in permission list.
      description: Needs no database and is therefore always available, unlike the rest of /api/v1/rbac.
      responses:
        "200":
          description: Every permission string the policy engine knows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/rbac/roles:
    get:
      operationId: listRoles
      tags: [administration]
      summary: Custom roles (built-ins are compiled in and not listed here).
      responses:
        "200":
          description: Custom roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: upsertRole
      tags: [administration]
      summary: Create or replace one custom role.
      description: >-
        422 for a name colliding with a built-in (viewer, operator,
        alert-editor, admin) or for a permission outside the compiled-in list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: The stored role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/rbac/roles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Custom role name.
        schema:
          type: string
    delete:
      operationId: deleteRole
      tags: [administration]
      summary: Delete one custom role; 409 while any binding still references it.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/rbac/bindings:
    get:
      operationId: listBindings
      tags: [administration]
      summary: Every role binding.
      responses:
        "200":
          description: Role bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createBinding
      tags: [administration]
      summary: Bind a subject to a role.
      description: >-
        422 for a subjectKind outside user/group (token bindings are declared
        in the schema but resolved by nothing, so storing one would silently
        grant nothing) or for an unknown role name; 409 on a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingRequest"
      responses:
        "200":
          description: The stored binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/rbac/bindings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Binding id. A non-integer is 400.
        schema:
          type: integer
          format: int64
    delete:
      operationId: deleteBinding
      tags: [administration]
      summary: Delete one role binding.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/tokens:
    get:
      operationId: listTokens
      tags: [administration]
      summary: Token metadata -- never the hash, never the secret.
      responses:
        "200":
          description: Every token's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createToken
      tags: [administration]
      summary: Mint a token.
      description: >-
        The response is the only place the raw wire-form token (kcm_...) is
        ever returned; it is never stored or logged. Served with
        Cache-Control: no-store. An expiresAt that is not in the future is
        refused with 422 before any secret is generated: such a token could
        never authenticate, so minting one would only leak a secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreateRequest"
      responses:
        "200":
          description: The minted token, secret included exactly once.
          headers:
            Cache-Control:
              description: Always "no-store" on this response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    delete:
      operationId: revokeToken
      tags: [administration]
      summary: Revoke an active token, or purge an already-spent one.
      description: >-
        The action follows the token's current state. On an ACTIVE token this
        revokes, which is what it has always meant: the row survives, carrying
        its revokedAt. On a token that is already revoked, or past its
        expiresAt, it hard-deletes the row instead -- an already-spent
        credential can authenticate nothing, so keeping it would only grow the
        list forever. Either way the answer is 204; 404 means no token with
        that id exists at all.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The caller's resolved identity and effective permissions.
      description: >-
        The ROUTE is public -- the UI must be able to call it before it knows
        whether it is logged in -- but the HANDLER still needs a resolved
        identity: 401 when nothing resolved, which never happens under
        auth.mode=anonymous.
      security: []
      responses:
        "200":
          description: Who the caller is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Password login; auth.mode=local only.
      description: >-
        404 in every other mode, so the UI feature-detects the login affordance
        instead of hardcoding auth.mode's cases. Unknown user, disabled account
        and wrong password are indistinguishable by status, body AND timing. On
        success sets the session and CSRF cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "204":
          description: Logged in; session and CSRF cookies set.
          headers:
            Set-Cookie:
              description: Session cookie, then the CSRF cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Delete the session server-side and clear both cookies.
      description: Mode-agnostic and idempotent -- safe with no session cookie at all.
      security: []
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Both cookies cleared.
              schema:
                type: string

  /api/v1/auth/oidc/start:
    get:
      operationId: oidcStart
      tags: [auth]
      summary: Redirect to the IdP authorization endpoint; auth.mode=oidc only.
      description: Full-page navigation, not fetch. 404 in every other mode.
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Must be a same-origin relative path; anything else is 400.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the IdP.
          headers:
            Location:
              description: The IdP authorization URL.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Consume the IdP redirect, mint a session, redirect to returnTo.
      description: >-
        Browser-facing, not a JSON endpoint. auth.mode=oidc only; 404 otherwise.
        returnTo is re-validated after its round trip through the state store,
        so a corrupted stash can never become an open redirect.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Session minted; redirect to the stashed returnTo.
          headers:
            Location:
              description: Same-origin relative path.
              schema:
                type: string
            Set-Cookie:
              description: Session cookie, then the CSRF cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A personal access token (kcm_...) minted by POST /api/v1/tokens. Exempt
        from CSRF: a browser never sends it ambiently.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kconmon_session
      description: >-
        Session cookie from the local or OIDC login flow. Mutations
        additionally require the double-submit CSRF pair: echo the non-HttpOnly
        `csrf` cookie's value in the X-CSRF-Token header.

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size, clamped into [1,500]. An unparseable value is treated as unset.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque keyset cursor from the previous page's nextCursor. Malformed, or
        minted by another server, is 400.
      schema:
        type: string
    PathID:
      name: id
      in: path
      required: true
      description: Resource id (UUID). A malformed id is 404, indistinguishable from an unknown one.
      schema:
        type: string
        format: uuid

  responses:
    NoContent:
      description: Done; no body.
    BadRequest:
      description: Malformed request -- unparseable body, bad filter value, or a broken cursor.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No credentials resolved for a route that needs a permission.
      headers:
        WWW-Authenticate:
          description: Always "Bearer".
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        Authenticated but missing the permission this route requires, or a
        cookie-authenticated mutation without a valid CSRF double-submit pair.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource, or the endpoint is not offered in this auth mode.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Refused because of the state of OTHER rows (something still references this one).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AlertingDisabled:
      description: >-
        Prometheus rule sync is not running on this console, so the routes that
        need the CLUSTER refuse. This is a 409 and not a 503 on purpose, and it
        is the one place in this API where the two come apart: 503 always means
        "the dependency this route reads from is not configured", and here the
        database is fine, every rule is right where it was, and the whole CRUD
        surface keeps working. What is off is the sync loop -- an opt-in feature
        (console.alerting.enabled, default false). Answering 503 would send an
        operator looking at their database for a reconciler that was never asked
        to start.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Well-formed body whose VALUES were rejected -- never a parse failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        Refused by the fixed-window rate limiter (console.rateLimit). The window and its ceiling are
        operator-configured, so a client should back off rather than assume a fixed delay.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Server-side failure; the detail is deliberately empty.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: An upstream (controller, Prometheus, database) could not be reached or refused.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: >-
        The dependency this route needs is not configured. The detail names the
        config value that enables it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 7807 error body. `type` is always "about:blank" so far.
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
      additionalProperties: false

    Protocol:
      type: string
      enum: [tcp, udp, icmp]
      default: tcp

    CheckType:
      type: string
      description: A definition names exactly one of these.
      enum: [tcp, udp, icmp, dns, http, mtr]

    RunStatus:
      type: string
      # cancelled joined in M4: written by POST /runs/{id}/cancel and by the
      # stuck-run reaper (migration 00003 declared it in M3; M4 writes it).
      enum: [pending, running, succeeded, failed, partial, cancelled]

    SubjectKind:
      type: string
      enum: [anonymous, user, token]

    LiveEventType:
      type: string
      enum:
        - topology_changed
        - check_observed
        - mtr_triggered
        - mtr_completed
        - diagnostic_progress

    LiveEventSeverity:
      type: string
      enum: [info, warn, error]

    Version:
      type: object
      required: [version, commit, capabilities]
      properties:
        version:
          type: string
          description: The console BINARY's version, not the Helm chart's.
        commit:
          type: string
        capabilities:
          type: array
          description: Always an array, never null. Holds "events" while this replica's pipeline is healthy.
          items:
            type: string
      additionalProperties: false

    Config:
      type: object
      required: [auth, anonymousBanner, controller, prometheus, database]
      properties:
        auth:
          type: object
          required: [mode, role, loginPath]
          properties:
            mode:
              type: string
              enum: [anonymous, local, header, oidc]
            role:
              type: string
              description: auth.anonymous.role -- what an unauthenticated caller gets.
            loginPath:
              type: string
              description: Endpoint that starts this mode's login flow; empty when the mode has none.
          additionalProperties: false
        anonymousBanner:
          type: boolean
        controller:
          $ref: "#/components/schemas/ConfiguredFlag"
        prometheus:
          $ref: "#/components/schemas/ConfiguredFlag"
        database:
          $ref: "#/components/schemas/ConfiguredFlag"
      additionalProperties: false

    ConfiguredFlag:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
      additionalProperties: false

    TopologyNode:
      type: object
      required: [name, zone, ready]
      properties:
        name:
          type: string
        zone:
          type: string
        ready:
          type: boolean
      additionalProperties: false

    TopologyAgent:
      type: object
      required: [id, nodeName, podIP, zone]
      properties:
        id:
          type: string
        nodeName:
          type: string
        podIP:
          type: string
        zone:
          type: string
      additionalProperties: false

    Topology:
      type: object
      required: [nodes, agents, timestamp]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TopologyNode"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/TopologyAgent"
        timestamp:
          description: >-
            Live: the controller's snapshot time. Historical: when this
            topology came into being, i.e. the time of the last folded change
            at or before `asOf` (falling back to `asOf` when nothing folded).
          type: string
          format: date-time
        historical:
          description: >-
            Present and true ONLY on a `?at=` response. Absent on the live
            passthrough, which is how a client tells the two apart.
          type: boolean
        asOf:
          description: The instant `?at=` asked about, echoed back. Historical only.
          type: string
          format: date-time
        eventsFolded:
          description: How many topology_changed events the fold consumed. Historical only.
          type: integer
        unfoldableEvents:
          description: >-
            How many of those could not move the node set: they named neither a
            node nor an agent, carried unparseable details, or used a reason
            this build does not know. A high value beside an empty `nodes`
            array means the events do not name their subject -- NOT that the
            cluster was empty. Historical only.
          type: integer
        truncated:
          description: >-
            True when the fold hit its 100k-row guard, so the reconstruction is
            missing its newest events and must not be trusted. Historical only.
          type: boolean
      additionalProperties: false

    MatrixCell:
      type: object
      required: [source, destination, failRatio]
      properties:
        source:
          type: string
        destination:
          type: string
        failRatio:
          type: [number, "null"]
          description: null when no series matched the pair -- not a zero.
        rttP95:
          type: integer
          format: int64
          description: Nanoseconds. Omitted when no series matched.
        lossRatio:
          type: number
          description: udp/icmp only. Omitted when no series matched.
      additionalProperties: false

    Matrix:
      type: object
      required: [protocol, plane, nodes, cells, timestamp]
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        plane:
          type: string
        nodes:
          type: array
          items:
            type: string
        cells:
          type: array
          items:
            $ref: "#/components/schemas/MatrixCell"
        timestamp:
          type: string
          format: date-time
      additionalProperties: false

    PromQLQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        time:
          type: string
          format: date-time
          description: RFC3339; omitted means "now".
      additionalProperties: false

    PromQLRangeRequest:
      type: object
      required: [query, start, end, step]
      properties:
        query:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        step:
          type: integer
          format: int64
          description: >-
            Nanoseconds (repo-wide convention) -- note this differs from
            Prometheus's own API, which takes seconds; the client converts.
      additionalProperties: false

    PromResult:
      type: object
      description: >-
        Prometheus's own envelope, forwarded byte-for-byte. Modelled loosely on
        purpose: the console never re-shapes it, so pinning it here would
        promise a stability the upstream does not.
      required: [status]
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: object
          additionalProperties: true
        errorType:
          type: string
        error:
          type: string
      additionalProperties: true

    LiveEvent:
      type: object
      description: >-
        Browser-facing projection of the controller's event. `id` is
        "<seq>-<unixNano>" and identical on every replica, which is what makes
        it both the hub's dedupe key and a stable React list key.
      required: [id, seq, type, severity, scope, timestamp, summary, details]
      properties:
        id:
          type: string
        seq:
          type: integer
          format: int64
          description: Controller-assigned and gapless per controller; a gap here is the loss signal.
        type:
          $ref: "#/components/schemas/LiveEventType"
        severity:
          $ref: "#/components/schemas/LiveEventSeverity"
        scope:
          type: string
        timestamp:
          type: string
          format: date-time
        summary:
          type: string
        details:
          type: object
          description: >-
            Type-specific payload. Its shape follows the event `type`: a matrix or
            topology frame carries the same object the matching REST route
            returns, a run frame carries a RunResult, and a live event carries an
            Event.
          additionalProperties: true
      additionalProperties: false

    EventPage:
      type: object
      required: [events, nextCursor]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/LiveEvent"
        nextCursor:
          type: string
          description: Empty string when the page proves nothing older is left.
      additionalProperties: false

    MTRDestination:
      type: object
      description: One (source, destination) pair path history knows about.
      required: [sourceNode, destination, snapshotCount, traceCount, firstSeen, lastSeen]
      properties:
        sourceNode:
          type: string
        destination:
          type: string
          description: A node NAME or a target NAME, never an address.
        snapshotCount:
          type: integer
          format: int64
          description: How many DISTINCT routes the pair has taken.
        traceCount:
          type: integer
          format: int64
          description: How many traces produced them.
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
      additionalProperties: false

    MTRDestinationList:
      type: object
      required: [destinations]
      properties:
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/MTRDestination"
        nextCursor:
          type: string
          description: >-
            Opaque keyset cursor for the following page; absent on the last one.
            Pass it back as `?cursor=` to continue the walk. The cursor is the
            PAIR, not `lastSeen`: every repeat trace bumps `lastSeen`, so a
            cursor over it would let a pair jump above the cursor and be skipped
            from a page it was never on. Pages therefore arrive ordered by
            (sourceNode, destination) and the client sorts the assembled set for
            display.
        truncated:
          type: boolean
          description: >-
            More pairs exist than this body carries — the same fact `nextCursor`
            carries, kept for a client that does not page. Pairs are sources x
            destinations, so a large fleet exceeds any single page.
      additionalProperties: false

    MTRHop:
      type: object
      description: >-
        One hop of a stored trace. Only `ip` takes part in the dedupe hash; the
        rest is the payload of the FIRST trace that took this path.
      required: [number, ip, rttNs, lossRatio]
      properties:
        number:
          type: integer
        ip:
          type: string
        hostname:
          type: string
          description: Absent unless the stored trace carried one; enrichment is separate.
        rttNs:
          type: integer
          format: int64
          description: Round-trip time in NANOSECONDS, the repo-wide duration convention.
        lossRatio:
          type: number
          description: 0..1.
      additionalProperties: false

    Enrichment:
      type: object
      description: >-
        One cached lookup about a hop address (mtr_hop_enrichment). Every field
        is re-derivable, which is what makes the retention sweep over this
        cache free of consequence.
      required: [ip, resolvedAt]
      properties:
        ip:
          type: string
        rdns:
          type: string
        asn:
          type: integer
          format: int64
        provider:
          type: string
        geo:
          type: object
          description: Resolver-shaped JSON object; absent when nothing geo-located.
          additionalProperties: true
        resolvedAt:
          type: string
          format: date-time
      additionalProperties: false

    PathTrace:
      type: object
      description: >-
        ONE recorded trace of a route: its own clock, its own outcome and its
        own per-hop readings.
      required: [id, recordedAt, success, durationNs, hops]
      properties:
        id:
          type: integer
          format: int64
        recordedAt:
          type: string
          format: date-time
        success:
          type: boolean
        durationNs:
          type: integer
          format: int64
        error:
          type: string
          description: The agent's own sentence, present only on a failed trace.
        hops:
          type: array
          items:
            $ref: "#/components/schemas/MTRHop"
        runId:
          type: string
          description: >-
            The run this trace was recorded in, so it can be followed back to
            its diagnostics permalink. Absent once that run has aged out.
      additionalProperties: false

    PathTraceList:
      type: object
      required: [traces, nextCursor, scanned]
      properties:
        traces:
          type: array
          items:
            $ref: "#/components/schemas/PathTrace"
        nextCursor:
          type: string
        scanned:
          type: integer
          description: >-
            Stored traces the window yielded BEFORE the path filter. Larger than
            `traces` when another route was interleaved with this one.
      additionalProperties: false

    PathSnapshot:
      type: object
      description: >-
        One distinct route a pair has been observed taking, with the hop
        payload of the first trace that took it.
      required: [id, sourceNode, destination, pathHash, hopCount, hops, firstSeen, lastSeen, traceCount]
      properties:
        id:
          type: string
          format: uuid
        sourceNode:
          type: string
        destination:
          type: string
        pathHash:
          type: string
          description: SHA-256 over the ordered hop IP list ONLY -- not RTTs, not hostnames.
        hopCount:
          type: integer
        hops:
          type: array
          items:
            $ref: "#/components/schemas/MTRHop"
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        traceCount:
          type: integer
          format: int64
        runId:
          type: string
          format: uuid
          description: Absent once the run that first produced this path has aged out.
        enrichment:
          type: object
          description: >-
            Hop address -> cached enrichment row. Present ONLY on GET
            /api/v1/mtr/snapshots/{id}?enrich=true, and then possibly empty; a
            cache miss is simply an absent key.
          additionalProperties:
            $ref: "#/components/schemas/Enrichment"
      additionalProperties: false

    PathSnapshotPage:
      type: object
      required: [snapshots, nextCursor]
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/PathSnapshot"
        nextCursor:
          type: string
      additionalProperties: false

    Annotation:
      type: object
      description: One operator note pinned to a moment or a span.
      required: [id, startAt, scope, text, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
          description: Absent for an INSTANT mark -- a point in time, not "still open".
        scope:
          type: string
          description: >-
            "" is a real value: the GLOBAL scope. Any other value names a node,
            a pair or a target. A filter key, NEVER a Prometheus label value.
        text:
          type: string
          maxLength: 1024
        createdBy:
          type: string
          description: The server's view of the subject ("user:<id>", "token:<id>").
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    AnnotationRequest:
      type: object
      description: >-
        Create body. There is deliberately no createdBy: attribution comes from
        the authenticated subject, not from the client.
      required: [startAt, text]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
          description: Omit for an instant mark; must be at or after startAt.
        scope:
          type: string
          maxLength: 255
          description: Omitted or "" pins the mark globally.
        text:
          type: string
          maxLength: 1024
      additionalProperties: false

    AnnotationPage:
      type: object
      required: [annotations, nextCursor]
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/Annotation"
        nextCursor:
          type: string
      additionalProperties: false

    IncidentStatus:
      type: string
      description: >-
        Closed set. Widening it is code, not a migration -- the vocabulary is
        enforced in Go, not by a CHECK constraint.
      enum: [open, resolved]

    PinnedRef:
      type: object
      description: >-
        One finding pinned to an incident: a typed reference into whichever
        table the timeline row came from. `id` is a STRING for every kind,
        including the bigint-keyed ones (event, k8s) -- pinned is one
        heterogeneous list, and one id spelling across it beats a per-kind type
        every reader would have to switch on. An unknown kind is REJECTED
        rather than stored: a pin nothing can resolve renders as nothing and
        can never be repaired.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [event, audit, annotation, snapshot, run, k8s]
        id:
          type: string
          maxLength: 128
        note:
          type: string
          maxLength: 512
      additionalProperties: false

    Incident:
      type: object
      description: >-
        One saved investigation -- annotations-class, not a ticket. Its
        permalink is /investigate?incident={id}; the page hydrates scope and
        range from the incident, so there is no second page.
      required: [id, title, scope, fromAt, status, notes, pinned, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
        scope:
          type: string
          description: >-
            "" is a real value: the GLOBAL scope. Any other value names a node,
            a pair or a target. A filter key, NEVER a Prometheus label value.
        fromAt:
          type: string
          format: date-time
        toAt:
          type: string
          format: date-time
          description: >-
            Absent means an OPEN-ENDED range -- "still going". Note this is the
            OPPOSITE of an annotation's absent endAt, which means an instant.
        status:
          $ref: "#/components/schemas/IncidentStatus"
        notes:
          type: string
          maxLength: 16384
          description: Markdown. Free-form operator prose; never enters the audit log.
        pinned:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PinnedRef"
        createdBy:
          type: string
          description: The server's view of the subject ("user:<id>", "token:<id>").
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          description: >-
            Present exactly when status is "resolved". Reopening CLEARS it -- a
            reopened incident is not resolved.
      additionalProperties: false

    IncidentRequest:
      type: object
      description: >-
        Create body. No createdBy (attribution comes from the authenticated
        subject) and no status/resolvedAt: an incident is always created OPEN,
        and the resolve path is PATCH.
      required: [title, fromAt]
      properties:
        title:
          type: string
          maxLength: 255
        scope:
          type: string
          maxLength: 255
          description: Omitted or "" opens the incident globally.
        fromAt:
          type: string
          format: date-time
        toAt:
          type: string
          format: date-time
          description: Omit for an open-ended range; must be at or after fromAt.
        notes:
          type: string
          maxLength: 16384
        pinned:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PinnedRef"
      additionalProperties: false

    IncidentPatchRequest:
      type: object
      description: >-
        Any SUBSET of the three fields an incident evolves through. An EMPTY
        object is 422: a patch that asks for nothing is far more likely a typo'd
        field name than a deliberate no-op. Each field present replaces that
        field wholesale -- `pinned` in particular is "the list is now this",
        which is what the UI actually knows; an add/remove pair would need a
        server-side merge that two operators pinning at once would race.
      minProperties: 1
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatus"
        notes:
          type: string
          maxLength: 16384
        pinned:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PinnedRef"
      additionalProperties: false

    IncidentPage:
      type: object
      required: [incidents, nextCursor]
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        nextCursor:
          type: string
      additionalProperties: false

    MaintenanceWindow:
      type: object
      description: >-
        One declared change window. DATA and RENDERING, never suppression: alert
        rules are evaluated and paged on, and nothing consults these windows.
        Declaring one marks the charts and the timeline; it does not silence an
        alert.
      required: [id, scope, startAt, endAt, reason, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          description: '"" is the GLOBAL scope -- the annotations scope vocabulary.'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 512
          description: Free text; never enters the audit log.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    MaintenanceWindowRequest:
      type: object
      description: Create body. No createdBy -- attribution comes from the subject.
      required: [startAt, endAt, reason]
      properties:
        scope:
          type: string
          maxLength: 255
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
          description: Must be strictly AFTER startAt; equal is 422.
        reason:
          type: string
          maxLength: 512
      additionalProperties: false

    MaintenanceWindowPage:
      type: object
      required: [windows, nextCursor]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceWindow"
        nextCursor:
          type: string
      additionalProperties: false

    WebhookEvent:
      type: string
      description: >-
        Closed set, in TWO families. `incident.*` is a lifecycle change the
        console was told about, by the request that caused it. `alert.*` is a
        Prometheus alert transition the console DETECTED, by polling alert
        state on its own schedule -- so `alert.resolved` carries the poll
        interval's granularity (`console.webhooks.alertPollInterval`, 30s by
        default), and the console never resolves anything while Prometheus is
        unreachable.


        The PAYLOAD shape is per family: `incident.*` delivers a
        WebhookPayload, `alert.*` delivers a WebhookAlertPayload. A receiver
        reads `event` first and then picks its parser. One endpoint may
        subscribe to both families.
      enum: [incident.created, incident.resolved, incident.reopened, alert.fired, alert.resolved]

    Webhook:
      type: object
      description: >-
        One configured outbound endpoint plus its last delivery outcome. There
        is NO secret field, at any layer: `hasSecret` is all a reader learns.
      required: [id, name, url, events, enabled, hasSecret, lastStatus, failures, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        url:
          type: string
          maxLength: 2048
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        enabled:
          type: boolean
        hasSecret:
          type: boolean
          description: >-
            Always true for a stored endpoint (an empty secret is refused), so
            this is a contract statement -- "this endpoint signs its
            deliveries" -- rather than a question.
        lastStatus:
          type: string
          maxLength: 255
          description: '"" until something has been delivered.'
        lastAttempt:
          type: string
          format: date-time
          description: Absent until something has been delivered.
        failures:
          type: integer
          format: int32
          description: Consecutive failures. SET by the dispatcher after each terminal outcome, never incremented here.
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    WebhookRequest:
      type: object
      description: >-
        Create/update body. Both are FULL replaces except `secret`, which is
        WRITE-ONLY and three-state -- see the PUT description.
      required: [name, url, events]
      properties:
        name:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
          description: Lowercase alphanumerics and '-'. Unique; a duplicate is 422, not 409.
        url:
          type: string
          maxLength: 2048
          description: Must start with http:// or https://.
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEvent"
        enabled:
          type: boolean
          default: true
          description: Omitted means TRUE -- an endpoint you just declared is one you want firing.
        secret:
          type: string
          minLength: 1
          description: >-
            The HMAC-SHA256 signing key, WRITE-ONLY. Required on create.
            On update: omit to KEEP the stored one; an empty string is 422
            (neither "keep" nor "clear" would be more than a guess).
      additionalProperties: false

    WebhookList:
      type: object
      description: Unpaged -- the row count is endpoints an operator typed, not a function of time.
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
      additionalProperties: false

    AlertRuleKind:
      type: string
      description: >-
        The template a rule's `params` is interpreted against, or `raw` for a
        hand-written PromQL expression carried in params.expr.


        NOTE the asymmetry with the database: the alert_rules.kind CHECK
        constraint additionally accepts `cert-expiry`, for which no template
        exists in this build. It is absent here because this enum describes
        what the API accepts, and a cert-expiry rule is rejected with a 422 at
        write time.
      enum:
        - pair-loss
        - zone-latency
        - dns-failures
        - http-ttfb
        - agent-missing
        - external-target-down
        - raw

    AlertSeverity:
      type: string
      description: The label Alertmanager routes on. A fourth value would route nowhere.
      enum: [info, warning, critical]

    AlertSyncStatus:
      type: string
      description: >-
        The reconciler's view of whether the cluster agrees. `unsynced` is the
        state of every freshly created or freshly edited rule and is NOT an
        error. `drift` is past tense and always carries a fresh lastSyncedAt: a
        reconcile ALWAYS re-asserts the console's bytes, so drift means "the
        cluster had diverged as of lastSyncedAt, and we corrected it", never
        "the cluster is diverged right now and we left it". `error` carries a
        syncMessage whose first token is a cause class (crd-missing, forbidden,
        other).
      enum: [unsynced, synced, drift, error]

    AlertRule:
      type: object
      description: >-
        One console-managed Prometheus alert rule: the builder fields an
        operator typed, the expression the SERVER rendered from them, and the
        reconciler's view of whether the cluster agrees.
      required:
        - id
        - name
        - kind
        - params
        - severity
        - forNs
        - labels
        - annotations
        - enabled
        - renderedExpr
        - syncStatus
        - syncMessage
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: >-
            Unique CASE-INSENSITIVELY. It seeds the rendered alert's
            `alertname`, so it is bounded by what may become a Prometheus label
            value (1-63 bytes), and mixed case is expected -- Prometheus alert
            names are conventionally CamelCase.
        kind:
          $ref: "#/components/schemas/AlertRuleKind"
        params:
          type: object
          description: >-
            The template's parameters, CLOSED per kind -- an unknown key is a
            422, never a default. Always an object on the wire, never null.
          additionalProperties: true
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        forNs:
          type: integer
          format: int64
          description: How long the expression must hold before the alert fires, in NANOSECONDS.
        labels:
          type: object
          description: >-
            Extra labels on the rendered alert. `severity` and
            kconmon_ng_rule_id are RESERVED -- supplying either is an error,
            never a silent override. Always an object, never null.
          additionalProperties:
            type: string
        annotations:
          type: object
          description: Annotations on the rendered alert. Always an object, never null.
          additionalProperties:
            type: string
        enabled:
          type: boolean
          description: Only enabled rules are rendered into the bundle the reconciler applies.
        renderedExpr:
          type: string
          description: >-
            The PromQL the server rendered from the builder fields. READ-ONLY:
            there is no request field for it, and for a template kind the
            console never accepts one -- it is on the row so the drift view can
            diff rendered-against-live without re-running the renderer.
        syncStatus:
          $ref: "#/components/schemas/AlertSyncStatus"
        syncMessage:
          type: string
          description: The reconciler's operator-facing one-liner; empty unless there is something to say.
        lastSyncedAt:
          type: string
          format: date-time
          description: Absent until an apply has actually happened.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    AlertRuleRequest:
      type: object
      description: >-
        The BUILDER fields, and only those, for POST /api/v1/alert-rules, PUT
        /api/v1/alert-rules/{id} and POST /api/v1/alert-rules/preview.


        Both writes are FULL REPLACES: there is deliberately no PATCH on this
        resource. renderedExpr and the three sync fields are absent by
        construction -- the first is the server's, the others are the
        reconciler's, and a caller editing a rule has no honest value to put in
        any of them.
      required: [name, kind, severity]
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AlertRuleKind"
        params:
          type: object
          description: Closed per kind. Omitted, null and {} are the same thing.
          additionalProperties: true
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        forNs:
          type: integer
          format: int64
          description: Nanoseconds. Omitted means 0 -- fire as soon as the expression holds.
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
          description: >-
            OMITTED means true -- a rule you just declared is one you want
            evaluated -- not false. On a PUT, omitting it therefore ENABLES the
            rule; send it explicitly to keep a rule disabled.
      additionalProperties: false

    AlertRuleList:
      type: object
      description: Unpaged -- the row count is rules an operator configured, not a function of time.
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AlertRule"
      additionalProperties: false

    AlertRulePreview:
      type: object
      description: >-
        The two halves of a preview, which fail independently. `series` is
        meaningful only when `error` is absent: a preview that could not run the
        query reports 0 series AND says why, and 0 series with no error is the
        real answer "this expression currently matches nothing".
      required: [expr, series]
      properties:
        expr:
          type: string
          description: The rendered PromQL. Always present -- a render failure is a 422, not this shape.
        series:
          type: integer
          description: How many series the instant query returned.
        error:
          type: string
          description: >-
            Set exactly when the evaluation half did not run or did not answer.
            Prometheus's own message is forwarded for a rejected expression (it
            is about the expression the caller just sent); every other failure
            is reported in the console's words, because those errors carry the
            configured Prometheus URL.
        rejected:
          type: boolean
          description: >-
            True only when Prometheus itself refused the expression (a 4xx --
            a parse error, bad_data). An unreachable or erroring Prometheus,
            an unconfigured one, and a response that was simply too large all
            leave this false: in those cases the expression was never judged,
            so a client must stay permissive rather than treat "not checked"
            as "bad".
      additionalProperties: false

    SyncKick:
      type: object
      description: A reconcile was requested. The outcome lands on the rules, not here.
      required: [status]
      properties:
        status:
          type: string
          enum: [kicked]
      additionalProperties: false

    ForeignRule:
      type: object
      description: >-
        One PrometheusRule in the console's namespace that the console does not
        own, projected down to four facts. The raw object is never served.
      required: [name, groups, rules, managedBy]
      properties:
        name:
          type: string
        groups:
          type: integer
          description: How many entries spec.groups holds.
        rules:
          type: integer
          description: >-
            Total rule entries across all groups -- alerting and recording
            alike, because a recording rule is still something an import would
            have to carry.
        managedBy:
          type: string
          description: >-
            app.kubernetes.io/managed-by, or "" when the object carries no such
            label.
      additionalProperties: false

    ForeignRuleList:
      type: object
      required: [foreign]
      properties:
        foreign:
          type: array
          items:
            $ref: "#/components/schemas/ForeignRule"
      additionalProperties: false

    AlertRuleImportRequest:
      type: object
      description: >-
        The NAME of a foreign PrometheusRule object, and nothing else. One
        field because there is one decision to make: there is no "which
        groups", no "rename to" and no dryRun -- the response reports item by
        item what happened, which is the preview and the apply in one round
        trip for an operation whose whole output is a few dozen rows.
      required: [name]
      properties:
        name:
          type: string
          description: >-
            As listed by GET /api/v1/alert-rules/foreign. An object this
            console owns is not foreign and answers 404.
      additionalProperties: false

    AlertRuleImportItem:
      type: object
      description: >-
        One rule entry the import had something to say about, named as the
        FOREIGN object spells it -- including spellings this API's own name
        charset rejects, because that is the line the operator has to find in
        their object.
      required: [name, reason]
      properties:
        name:
          type: string
        reason:
          type: string
      additionalProperties: false

    AlertRuleImportNote:
      type: object
      required: [name, note]
      properties:
        name:
          type: string
        note:
          type: string
      additionalProperties: false

    AlertRuleImportReport:
      type: object
      description: >-
        What the adoption did. `skipped` and `notes` are two different
        statements and are deliberately not one list: a SKIP means "this is not
        in your console" (a recording rule, a name already taken, a name this
        store's charset rejects, an unreadable `for`), while a NOTE means "this
        IS in your console, and one field is the console's choice rather than
        your object's" (a severity outside the closed set, a dropped reserved
        label). Collapsing them would make an operator re-check rules that
        imported perfectly.


        All three arrays are always present and never null.
      required: [created, skipped, notes]
      properties:
        created:
          type: array
          description: The names of the rules now stored, in the order they were adopted.
          items:
            type: string
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/AlertRuleImportItem"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/AlertRuleImportNote"
      additionalProperties: false

    Alert:
      type: object
      description: >-
        One alert Prometheus is currently firing or pending, mapped from its own
        /api/v1/alerts shape. `name` and `severity` are LIFTED off the label set
        because every consumer needs them; `labels` keeps them too, since it is
        the upstream set verbatim and deleting keys from it would make this a
        different alert than the one Prometheus is firing.
      required: [name, state, severity, labels, annotations, value]
      properties:
        name:
          type: string
          description: The `alertname` label.
        state:
          type: string
          description: Prometheus's own state string -- `firing` or `pending`.
        severity:
          type: string
          description: The `severity` label; empty for an alert that carries none.
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        activeAt:
          type: string
          format: date-time
        value:
          type: string
          description: >-
            The sample value as a STRING, verbatim ("7e+00"). Not parsed to a
            number: the upstream field is a string precisely because it carries
            NaN and infinities, which JSON cannot express.
        ruleId:
          type: string
          format: uuid
          description: >-
            The alert_rules row this came from, lifted off the
            kconmon_ng_rule_id label. Absent for an alert this console does not
            manage.
      additionalProperties: false

    AlertList:
      type: object
      description: >-
        promConfigured is IN THE BODY rather than implied by a status code:
        "nothing is firing" and "nobody is watching" are two different sentences
        the Overview card must be able to render, and neither is an error.
      required: [alerts, promConfigured]
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        promConfigured:
          type: boolean
      additionalProperties: false

    WebhookPayload:
      type: object
      description: >-
        The body the console POSTs to a configured endpoint for an
        INCIDENT-family event. It is NOT a request or response of this API --
        it is the contract the console offers a RECEIVER, documented here
        because there is nowhere better for a receiver's author to look.


        Transport: `POST` with `Content-Type: application/json` and
        `X-Kconmon-Signature: sha256=<hex hmac-sha256(secret, raw body)>`,
        computed over the exact request bytes. Verify the signature BEFORE
        parsing. 10s timeout per attempt, and up to three attempts at
        approximately 0s / 30s / 5m with +/-20% jitter until the endpoint
        answers 2xx -- so a receiver MUST be idempotent. The body (and
        therefore the signature) is identical across retries, so
        (event, incident.id, at) is a usable deduplication key. The transport
        is IDENTICAL for WebhookAlertPayload -- only the body differs.


        Delivery lives in the console process: a restart during the retry
        window loses the remaining attempts. The ledger for a miss is the
        endpoint row's lastStatus/failures, not a replay queue.


        There is ONE SHAPE PER FAMILY and the families are closed: dispatch on
        `event`, then parse. Within a family the field set is CLOSED and
        STABLE, with no omitempty anywhere -- every key below is present on
        every delivery, including a null `toAt`. Splitting rather than widening
        was deliberate: a union shape would have meant either a synthetic
        incident object on every alert delivery or omitempty on half the keys,
        and a shape that changes per delivery is exactly what "stable" forbids.
      required: [event, incident, at]
      properties:
        event:
          type: string
          description: >-
            An incident-family WebhookEvent value, or "test" for the /test
            ping. "test" is deliberately NOT in WebhookEvent's enum -- that set
            is what an endpoint may SUBSCRIBE to, and a ping is addressed by
            id. A /test ping always carries THIS shape, whatever the endpoint
            subscribes to: it answers "can I reach you and does my signature
            verify", which is not a question about alerts.
          enum: [incident.created, incident.resolved, incident.reopened, test]
        incident:
          $ref: "#/components/schemas/WebhookPayloadIncident"
        at:
          type: string
          format: date-time
          description: >-
            When the console decided to notify, NOT when this attempt was made.
            Stable across retries.
      additionalProperties: false

    WebhookAlertPayload:
      type: object
      description: >-
        The body the console POSTs for an ALERT-family event. Same transport,
        same signature, same retry ladder as WebhookPayload -- the delivery
        path does not fork, only the body does.


        The console does not evaluate alerts. It polls Prometheus alert state
        every `console.webhooks.alertPollInterval` (30s default) and delivers
        the EDGES: a managed alert that appears in a poll is `alert.fired`, one
        that disappears is `alert.resolved`. Three consequences a receiver
        should plan around, all deliberate:


        1. The first successful poll after a console restart is a BASELINE --
        it records what is firing and delivers nothing. A restart never pages
        about alerts that were already firing, and a transition during the
        restart window is missed rather than replayed.


        2. A poll that fails FREEZES the firing set. Nothing is resolved while
        Prometheus is unreachable or answering something unreadable.


        3. Every console replica polls independently, so N replicas deliver N
        copies of each edge. Deduplicate on
        (event, alert.ruleId, alert.labels, alert.firedAt) -- all four are
        stable across replicas and across the retry ladder. `sentAt` is NOT:
        it is per delivery.


        Only alerts this console MANAGES are delivered (those carrying the
        `kconmon_ng_rule_id` label). A foreign firing alert is listed by
        GET /api/v1/alerts but never delivered: it belongs to whoever wrote
        that rule. Alerts in the `pending` state are not delivered either --
        pending is not fired.
      required: [event, sentAt, alert]
      properties:
        event:
          type: string
          enum: [alert.fired, alert.resolved]
        sentAt:
          type: string
          format: date-time
          description: >-
            When this delivery was built. Stable across the retry ladder, NOT
            across replicas -- do not deduplicate on it.
        alert:
          $ref: "#/components/schemas/WebhookPayloadAlert"
      additionalProperties: false

    WebhookPayloadAlert:
      type: object
      description: >-
        One alert instance. The identity is (ruleId, labels): one rule fires
        once per series, so a per-zone rule produces one of these per zone and
        each resolves independently.
      required: [ruleId, ruleName, severity, expr, labels, annotations, firedAt, resolvedAt]
      properties:
        ruleId:
          type: string
          format: uuid
          description: The alert_rules row, off the `kconmon_ng_rule_id` label. Never empty.
        ruleName:
          type: string
          description: >-
            The console row's name when the rule was resolvable, otherwise the
            `alertname` label (Prometheus' sanitized spelling).
        severity:
          type: string
        expr:
          type: string
          description: >-
            The rendered PromQL the rule evaluates. "" when the row could not
            be read -- Prometheus' alert API does not carry the expression, so
            this is looked up, and an unavailable lookup gives an empty string
            rather than a guess. Never a missing key.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Prometheus' label set for this instance, verbatim. Always an object, never null.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: The alert's annotations, verbatim. Always an object, never null.
        firedAt:
          type: string
          format: date-time
          description: >-
            Prometheus' `activeAt` -- when the expression started matching, not
            when the console noticed. Identical on every replica, which is what
            makes it usable in a deduplication key. Falls back to the observing
            poll's clock only when Prometheus reported no activeAt at all.
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            null on `alert.fired`. Always present as a key. On
            `alert.resolved` it is WHEN THE CONSOLE NOTICED the alert was gone,
            not when Prometheus stopped firing: an absence has no timestamp of
            its own, so the honest reading is "resolved at some point in the
            poll interval ending here".
      additionalProperties: false

    WebhookPayloadIncident:
      type: object
      description: >-
        The incident subset a notification carries. `notes` and `pinned` are
        deliberately ABSENT: notes are free-form operator text up to 16 KiB
        that can name anything an investigation touched, and pushing them to a
        third-party endpoint on every status change would export the
        investigation itself rather than the fact of it. Fetch them from GET
        /api/v1/incidents/{id} if the receiver is entitled to them.


        For a `test` ping the object is synthetic: `id` is "", `title` is
        "kconmon-ng webhook test", `createdBy` is "kconmon-ng".
      required: [id, title, scope, status, fromAt, toAt, createdBy]
      properties:
        id:
          type: string
          description: UUID, or "" for a test ping.
        title:
          type: string
        scope:
          type: string
          description: '"" for a global incident; otherwise a node, a pair or a target name.'
        status:
          $ref: "#/components/schemas/IncidentStatus"
        fromAt:
          type: string
          format: date-time
        toAt:
          type: string
          format: date-time
          nullable: true
          description: null for an OPEN-ENDED range. Always present as a key.
        createdBy:
          type: string
      additionalProperties: false

    K8sEventKind:
      type: string
      enum: [Node, Pod]

    K8sEventType:
      type: string
      enum: [Normal, Warning]

    K8sEvent:
      type: object
      description: One captured cluster event, one of the Investigate timeline's sources.
      required: [id, uid, resourceVersion, eventTime, kind, name, namespace, reason, type, message, count]
      properties:
        id:
          type: string
          description: >-
            The row's bigint key rendered as a STRING, because a pinned ref
            spells every id that way -- pinned is one heterogeneous list across
            six tables and one spelling beats a per-source type.
        uid:
          type: string
          description: The Kubernetes event UID. (uid, resourceVersion) is the dedupe key.
        resourceVersion:
          type: string
        eventTime:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/K8sEventKind"
        name:
          type: string
          description: Node name or pod name.
        namespace:
          type: string
          description: '"" for the cluster-scoped Node events.'
        reason:
          type: string
        type:
          $ref: "#/components/schemas/K8sEventType"
        message:
          type: string
        count:
          type: integer
          format: int32
      additionalProperties: false

    K8sEventPage:
      type: object
      required: [events, nextCursor]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/K8sEvent"
        nextCursor:
          type: string
      additionalProperties: false

    RunCreateRequest:
      type: object
      required: [type]
      properties:
        sources:
          type: array
          description: >-
            Empty or absent means every node in the current topology, which is
            every node carrying a registered agent - the measurement fleet, not
            the Kubernetes Node inventory. The two differ on any cluster whose
            controller has no node informer, where the Node list is empty while
            agents are registered and probing.
          items:
            type: string
        destinations:
          type: array
          items:
            type: string
        type:
          $ref: "#/components/schemas/CheckType"
        plane:
          type: string
        timeoutNs:
          type: integer
          format: int64
          description: Per-pair timeout in nanoseconds; unset lets the server apply its own default and clamp.
        destinationKind:
          type: string
          enum: [node, target, adhoc]
          description: >-
            node (default) keeps destinations as node names, the pre-M4 contract.
            target resolves a saved target row (destinationTargetId); adhoc probes
            destinationAddress. Both external kinds require destinations to be empty.
        destinationTargetId:
          type: string
          format: uuid
          description: Required when destinationKind is target.
        destinationAddress:
          type: string
          description: Required when destinationKind is adhoc.
        durationNs:
          type: integer
          format: int64
          minimum: 10000000000
          maximum: 86400000000000
          description: >-
            Optional. Absent or 0 runs the check ONCE per pair (an instant run,
            the default and the only behaviour before this field existed). Any
            other value turns it into an interval run: every pair is re-probed
            on a cadence for this long, each probe kept as its own result
            sample, and the run stays `running` - cancellable, streaming
            progress on its `run:{id}` topic - until the duration elapses.

            Bounded to 10s..24h; outside that the request is refused with 422
            naming both bounds, never silently clamped.

            Absent sampleIntervalNs, the cadence is DERIVED from this duration:
            duration / 500, floored at 5s. That caps ONE PAIR at 500 samples
            however long the run is, so a 24h run samples roughly every 173s
            across the whole day rather than filling its quota in the first
            hour. A run's total sample count is therefore at most pairs x 500.
        sampleIntervalNs:
          type: integer
          format: int64
          minimum: 1000000000
          description: >-
            Optional. The cadence between one pair's probes, in nanoseconds.
            Absent or 0 keeps the derived behaviour above, byte-identical to
            every run made before this field existed.

            Bounded to 1s..durationNs and refused with 422 naming the bound
            outside it, the same way an out-of-range durationNs is; naming a
            cadence without a durationNs is refused for the same reason, since
            an instant run has no cadence to dial.

            A cadence the fan-out cannot KEEP is a different matter and is never
            refused. Asking an mtr run for 1s is not a mistake in the request,
            it is a fact about traceroute - a trace walks up to thirty hops in
            sequence - so the run is planned around it and the response reports
            requested and effective separately (see sampleIntervalAdjusted).
            The 500-samples-per-pair cap is the hard ceiling either way and
            binds the same way, also reported rather than silently applied.
      additionalProperties: false

    RunCreateResponse:
      type: object
      required: [id, status, pairTotal, wsTopic]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        pairTotal:
          type: integer
        wsTopic:
          type: string
          description: Server-chosen topic name; subscribe to what you were told, never a string you built.
        plannedSampleIntervalNs:
          type: integer
          format: int64
          description: >-
            The cadence the run will actually keep. Absent on an instant run.
            A slow check type stretches it past the duration's base cadence, so
            a caller cannot derive it from durationNs alone. A worst case, not
            an observation - rounds run back to back, so a healthy run beats it.
        plannedSamplesPerPair:
          type: integer
          description: >-
            How many probes ONE pair contributes if every round takes its worst
            case: a floor, capped at 500. Read it as "at least N per pair".
        requestedSampleIntervalNs:
          type: integer
          format: int64
          description: >-
            sampleIntervalNs echoed back verbatim; absent when none was sent.
            Reported apart from plannedSampleIntervalNs on purpose - the two
            agree only when nothing bound the request.
        sampleIntervalAdjusted:
          type: string
          enum: [cap, round]
          description: >-
            Why the plan is not the cadence that was asked for. `cap` - the
            500-samples-per-pair ceiling widened it. `round` - one round over
            this fan-out cannot finish that fast, so the plan is one round's
            floor. Absent when nothing moved, which includes every run that
            sent no sampleIntervalNs and was not stretched.
      additionalProperties: false

    RunSummary:
      type: object
      required: [id, createdAt, status, type, plane, initiatorKind, initiatorId, pairTotal, pairOk, pairFailed]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/RunStatus"
        type:
          type: string
        plane:
          type: string
        initiatorKind:
          type: string
        initiatorId:
          type: string
        pairTotal:
          type: integer
        pairOk:
          type: integer
        pairFailed:
          type: integer
      additionalProperties: false

    RunResult:
      type: object
      description: >-
        One PROBE of one pair. An instant run contributes exactly one of these
        per pair (sampleSeq 0); an interval run contributes one per pair per
        round, and (sourceNode, destinationNode, sampleSeq) is what identifies
        a sample. Rows come back in completion order, which is the timeline.
      required: [sourceNode, destinationNode, success, durationNs, recordedAt, sampleSeq]
      properties:
        sourceNode:
          type: string
        destinationNode:
          type: string
        success:
          type: boolean
        durationNs:
          type: integer
          format: int64
        error:
          type: string
        result:
          type: object
          description: Check-type-specific payload, stored verbatim.
          additionalProperties: true
        recordedAt:
          type: string
          format: date-time
        sampleSeq:
          type: integer
          description: >-
            0-based probe number within this pair. Always 0 for an instant run;
            0..n-1 for an interval run, capped at 499 (500 samples per pair).
      additionalProperties: false

    RunDetail:
      description: >-
        One run's summary plus its spec snapshot and per-pair results. FLAT, not an allOf over
        RunSummary: that composition was unsatisfiable, because RunSummary is
        additionalProperties:false and a strict validator applies it to the WHOLE document, so
        `spec` and `results` made every real response invalid.
      type: object
      required:
        [id, createdAt, status, type, plane, initiatorKind, initiatorId, pairTotal, pairOk, pairFailed, spec, results]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/RunStatus"
        type:
          type: string
        plane:
          type: string
        initiatorKind:
          type: string
        initiatorId:
          type: string
        pairTotal:
          type: integer
        pairOk:
          type: integer
        pairFailed:
          type: integer
        spec:
          type: object
          description: The run's spec as submitted, snapshotted at creation.
          additionalProperties: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/RunResult"
        resultsTruncated:
          type: boolean
          description: >-
            Present and true when the run holds MORE results than this response
            carries -- the newest 2000 of them. An interval run is bounded at
            400 pairs x 500 samples, and this body is re-read every five seconds
            while the run is alive, so an unbounded read could hand a replica a
            multi-hundred-megabyte marshal on repeat. When it is true, any
            aggregate computed from `results` describes the tail, not the run.
      additionalProperties: false

    RunPage:
      type: object
      required: [runs, nextCursor]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        nextCursor:
          type: string
      additionalProperties: false

    TargetKind:
      type: string
      enum: [host, url]

    Target:
      type: object
      required: [id, name, kind, address, labels, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Becomes a Prometheus label value, hence the restricted charset store enforces.
        kind:
          $ref: "#/components/schemas/TargetKind"
        address:
          type: string
          description: >-
            Stored TRIMMED, and validated against the kind it was filed under.
            See TargetRequest.address for the rule.
        labels:
          type: object
          description: Always an object ({} when unset), never null.
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    TargetRequest:
      type: object
      description: Create and update body; a FULL replace -- an omitted field means empty.
      required: [name, kind, address]
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/TargetKind"
        address:
          type: string
          description: >-
            Validated against `kind`, and rejected with 422 when it does not
            match. kind=host takes a hostname, an IP literal (bracketed for
            IPv6) or either with a numeric ":port" in 1-65535 -- the shapes the
            agent's allowlist resolves. kind=url takes an http:// or https://
            URL with a host; a port, a path and a query are all allowed, since
            the agent's HTTP checker reads all three. A URL is NOT a valid host
            address and a bare hostname is NOT a valid url address: the kind is
            what tells the agent which parser to use. Leading and trailing
            whitespace is trimmed before the check, and the trimmed value is
            what gets stored; an address that is empty after trimming is
            refused.
        labels:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false

    TargetPage:
      type: object
      required: [targets, nextCursor]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"
        nextCursor:
          type: string
      additionalProperties: false

    SourceSelection:
      type: string
      description: >-
        How the definition picks the agents that run it. "all" and "per-zone"
        both resolve to every agent -- per-zone groups them rather than
        shrinking the set; only "one-per-zone" reduces the count, which is why
        it is the default.
      enum: [all, per-zone, one-per-zone]

    DestinationKind:
      type: string
      enum: [node, target, adhoc]

    CheckDefinition:
      type: object
      required:
        - id
        - name
        - sourceSelection
        - destinationKind
        - destinationTargetId
        - destinationAddress
        - checkType
        - plane
        - params
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceSelection:
          $ref: "#/components/schemas/SourceSelection"
        destinationKind:
          $ref: "#/components/schemas/DestinationKind"
        destinationTargetId:
          type: string
          description: Empty unless destinationKind is "target".
        destinationAddress:
          type: string
          description: Empty unless destinationKind is "adhoc".
        checkType:
          $ref: "#/components/schemas/CheckType"
        plane:
          type: string
        params:
          type: object
          description: Always an object ({} when unset), never null.
          additionalProperties: true
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    CheckDefinitionRequest:
      type: object
      description: >-
        Create, update AND projection body -- the projection endpoint reads the
        same shape so the UI can send the form it is about to submit,
        unchanged. Create/update are FULL replaces.
      required: [name, sourceSelection, destinationKind, checkType, plane]
      properties:
        name:
          type: string
        sourceSelection:
          $ref: "#/components/schemas/SourceSelection"
        destinationKind:
          $ref: "#/components/schemas/DestinationKind"
        destinationTargetId:
          type: string
          format: uuid
        destinationAddress:
          type: string
          description: >-
            Required when destinationKind is adhoc, and validated against what an
            agent can actually dial: a DNS name, an IP literal (bracketed for
            IPv6), either of those with a `:port` suffix in 1-65535, or an
            http(s) URL with a host. Anything else is 422 -- the agent resolves
            and dials this string verbatim, so a value it cannot parse would be
            stored, pushed to every assigned agent and refused there once per
            interval, forever. Whether the resolved address is PERMITTED is a
            separate question, answered per probe by the agent's own allowlist.
        checkType:
          $ref: "#/components/schemas/CheckType"
        plane:
          type: string
        params:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
      additionalProperties: false

    CheckDefinitionPage:
      type: object
      required: [definitions, nextCursor]
      properties:
        definitions:
          type: array
          items:
            $ref: "#/components/schemas/CheckDefinition"
        nextCursor:
          type: string
      additionalProperties: false

    Projection:
      type: object
      description: >-
        What ONE definition would project against the CURRENT topology, so the
        same definition can project differently as the cluster scales. The
        bound is per definition, never fleet-wide.
      required: [agents, protocols, series, limit, overLimit]
      properties:
        agents:
          type: integer
        protocols:
          type: integer
          description: 1 today -- a definition names exactly one check type.
        series:
          type: integer
          description: agents x protocols.
        limit:
          type: integer
          description: 400, the same bound the diagnostics runner applies to one run's fan-out.
        overLimit:
          type: boolean
          description: True means enabling this definition is refused with 422.
      additionalProperties: false

    ScheduleKind:
      type: string
      description: >-
        "cron" is deliberately absent: it is refused with a 422 naming the
        milestone it lands in, not silently treated as an enum typo.
      enum: [once, interval, continuous]

    Schedule:
      type: object
      required:
        [id, definitionId, kind, intervalNs, runAt, enabled, lastFiredAt, nextFireAt,
         lastError, lastErrorAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        definitionId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        intervalNs:
          type: integer
          format: int64
          description: Nanoseconds; clamped up to 10s for kind "interval".
        runAt:
          type: [string, "null"]
          format: date-time
        enabled:
          type: boolean
        lastFiredAt:
          type: [string, "null"]
          format: date-time
          description: null means this schedule has never fired -- a zero timestamp would read as year 1.
        nextFireAt:
          type: [string, "null"]
          format: date-time
          description: Scheduler bookkeeping; null for kind "continuous", which the loop never fires.
        lastError:
          type: string
          description: >-
            Why the LAST fire produced no run; "" when it produced one. A
            schedule always advances its cadence, fired or not (leaving a broken
            one due would turn it into a hot loop), so without this a schedule
            whose definition points at a deleted target is indistinguishable
            from a healthy one. Always PRESENT -- "" is how a healthy schedule
            says so, and an absent key would be indistinguishable from a server
            that has no such concept. Cleared by the next fire that goes
            through, and NOT by an edit: an edit is not a fire.
        lastErrorAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When lastError was recorded. Non-null exactly when lastError is
            non-empty -- the store derives one from the other in a single
            UPDATE, so the pair can never disagree.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    ScheduleRequest:
      type: object
      description: >-
        Full replace. nextFireAt is deliberately absent -- it is scheduler
        bookkeeping, and letting a client write it would let it schedule a fire
        in the past and stampede the loop. definitionId is not updatable.
      required: [definitionId, kind]
      properties:
        definitionId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        intervalNs:
          type: integer
          format: int64
          description: Required for kind "interval"; must be absent for the others.
        runAt:
          type: string
          format: date-time
          description: Required for kind "once", and must be in the future.
        enabled:
          type: boolean
      additionalProperties: false

    SchedulePage:
      type: object
      required: [schedules, nextCursor]
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        nextCursor:
          type: string
      additionalProperties: false

    AuditEntry:
      type: object
      required: [id, at, subjectKind, subjectId, action, resource, outcome, remoteAddr, detail]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        subjectKind:
          type: string
        subjectId:
          type: string
        action:
          type: string
          description: Method plus route pattern, e.g. "POST /api/v1/runs".
        resource:
          type: string
        outcome:
          type: string
          enum: [allowed, denied, error]
        remoteAddr:
          type: string
        detail:
          type: object
          description: Whatever the per-route allow-list let through; {} for almost everything.
          additionalProperties: true
      additionalProperties: false

    AuditPage:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string
      additionalProperties: false

    PermissionList:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string
      additionalProperties: false

    Role:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
      additionalProperties: false

    RoleRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          description: May not collide with a built-in (viewer, operator, alert-editor, admin).
        permissions:
          type: array
          items:
            type: string
      additionalProperties: false

    RoleList:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
      additionalProperties: false

    Binding:
      type: object
      required: [id, roleName, subjectKind, subjectId, createdAt]
      properties:
        id:
          type: integer
          format: int64
        roleName:
          type: string
        subjectKind:
          type: string
        subjectId:
          type: string
          description: >-
            Opaque, and NAMESPACED by the auth mode that minted it. OIDC identities are
            "oidc:<sub>" -- sub is the only claim OIDC Core 5.7 permits as an identifier, so
            preferred_username or email here would be a role that follows a reassignable name
            (Grafana CVE-2023-3128). Local users are bound by their users.id UUID; the prefixes
            "local:", "header:" and "token:" are reserved for the same purpose.
        createdAt:
          type: string
          format: date-time
          description: When the grant was made -- half of reviewing whether it still should stand.
      additionalProperties: false

    BindingRequest:
      type: object
      required: [roleName, subjectKind, subjectId]
      properties:
        roleName:
          type: string
        subjectKind:
          type: string
          enum: [user, group]
        subjectId:
          type: string
      additionalProperties: false

    BindingList:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/Binding"
      additionalProperties: false

    Token:
      type: object
      description: Token metadata. Structurally carries no hash and no secret.
      required: [id, name, owner, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/Token"
      additionalProperties: false

    TokenCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: >-
            Must be in the future when present; omit it for a token that never
            expires.
      additionalProperties: false

    TokenCreateResponse:
      type: object
      required: [id, name, token]
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
          description: The raw wire-form token (kcm_...), returned exactly once and never again.
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false

    MeSubject:
      type: object
      required: [kind, id, displayName, groups, roles]
      properties:
        kind:
          $ref: "#/components/schemas/SubjectKind"
        id:
          type: string
        displayName:
          type: string
        groups:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
      additionalProperties: false

    Me:
      type: object
      required: [subject, permissions]
      properties:
        subject:
          $ref: "#/components/schemas/MeSubject"
        permissions:
          type: array
          description: The flattened, already-resolved permission list -- never role names to re-resolve.
          items:
            type: string
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false

    ExportedSchedule:
      type: object
      description: >-
        Schedule as a bundle carries it: Schedule MINUS lastFiredAt,
        nextFireAt and the lastError pair. Those are scheduler bookkeeping --
        an observation of a running console, not the cadence an operator
        declared, and a failure this console saw is not a fact about the
        console the bundle is restored into. nextFireAt is re-seeded on import
        exactly as POST /api/v1/schedules seeds it.
      required: [id, definitionId, kind, intervalNs, enabled]
      properties:
        id:
          type: string
          format: uuid
          description: The SOURCE console's id. Remapped on import; never reused as a primary key.
        definitionId:
          type: string
          format: uuid
          description: >-
            A reference into this bundle's checkDefinitions, or into a definition
            the destination already has. Remapped on import.
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        intervalNs:
          type: integer
          format: int64
        runAt:
          type: string
          format: date-time
        enabled:
          type: boolean
      additionalProperties: false

    ExportedWebhook:
      type: object
      description: >-
        Endpoint as a bundle carries it. NO SECRET FIELD -- `hasSecret` is a
        boolean statement about the SOURCE row and never a licence to create one
        here -- and no delivery outcomes (lastStatus/lastAttempt/failures),
        which are what happened rather than what was configured.
      required: [id, name, url, events, enabled, hasSecret]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        url:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        enabled:
          type: boolean
        hasSecret:
          type: boolean
          description: >-
            Informational. Always true for a stored row (the store refuses an
            empty secret); an endpoint the destination lacks is SKIPPED on
            import, never created secret-less.
      additionalProperties: false

    ExportedAlertRule:
      type: object
      description: >-
        Alert rule as a bundle carries it: the BUILDER half only. syncStatus,
        syncMessage and lastSyncedAt are the reconciler's view of a cluster the
        destination has never talked to, so importing them would let a bundle
        claim a sync that never happened. renderedExpr DOES travel: it is
        derived, but derived at write time, so carrying it keeps a round trip
        lossless.
      required: [id, name, kind, params, severity, forNs, labels, annotations, enabled, renderedExpr]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 63
          description: >-
            Unique CASE-INSENSITIVELY (migration 00007's lower(name) index), which
            is also the natural key the import merges on.
        kind:
          type: string
          enum:
            - pair-loss
            - zone-latency
            - dns-failures
            - http-ttfb
            - cert-expiry
            - agent-missing
            - external-target-down
            - raw
        params:
          type: object
          description: Interpreted against `kind` by the renderer. "raw" requires params.expr.
        severity:
          type: string
          enum: [info, warning, critical]
        forNs:
          type: integer
          format: int64
          description: Nanoseconds, the repo-wide duration convention.
        labels:
          type: object
        annotations:
          type: object
        enabled:
          type: boolean
        renderedExpr:
          type: string
      additionalProperties: false

    ConfigBundle:
      type: object
      description: >-
        The whole declarative configuration, versioned. Collections are in
        DEPENDENCY ORDER and the importer walks them in exactly this order.
      required:
        - version
        - exportedAt
        - targets
        - checkDefinitions
        - checkSchedules
        - alertRules
        - webhooks
        - maintenanceWindows
      properties:
        version:
          type: integer
          description: >-
            Checked for EQUALITY on import. A bundle from a future console may
            describe collections this build has never heard of, and importing
            the recognised subset would be a partial restore presented as a
            complete one.
          const: 1
        exportedAt:
          type: string
          format: date-time
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"
        checkDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/CheckDefinition"
        checkSchedules:
          type: array
          items:
            $ref: "#/components/schemas/ExportedSchedule"
        alertRules:
          type: array
          items:
            $ref: "#/components/schemas/ExportedAlertRule"
        webhooks:
          type: array
          items:
            $ref: "#/components/schemas/ExportedWebhook"
        maintenanceWindows:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceWindow"
        rbac:
          $ref: "#/components/schemas/ConfigBundleRBAC"
      additionalProperties: false

    ConfigBundleRBAC:
      type: object
      description: >-
        The access-control section. PRESENT ONLY when the caller holds
        `rbac:manage`: everything else in the bundle needs `settings:write`, and
        a grant list is strictly more sensitive than a target list -- it names
        people and says what they can do. Absent and empty are therefore
        different facts, which is why the field is omitted rather than nulled.


        Roles are custom roles ONLY. The built-ins (viewer, operator,
        alert-editor, admin) are compiled in, identical on every build, and a
        bundle claiming to define one would be claiming to redefine it.


        Bindings are EXPORTED AND NEVER IMPORTED, on the webhook-secret
        precedent. A binding names a person in the SOURCE console's identity
        namespace ("oidc:<sub>", a local user's UUID); replaying it elsewhere
        either grants that role to whatever the string means there or grants it
        to nobody, silently. The bundle records who held what; re-granting is a
        decision, not a restore.
      required: [roles, bindings]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ExportedRole"
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/ExportedBinding"
      additionalProperties: false

    ExportedRole:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
      additionalProperties: false

    ExportedBinding:
      type: object
      required: [id, roleName, subjectKind, subjectId, createdAt]
      properties:
        id:
          type: integer
          format: int64
        roleName:
          type: string
        subjectKind:
          type: string
        subjectId:
          type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    ConfigImportRequest:
      type: object
      description: >-
        dryRun is a BODY FLAG rather than a query parameter deliberately: the
        flag and the bundle it applies to are one indivisible statement, and a
        query parameter dropped by a proxy would turn a preview into an apply.
      required: [bundle]
      properties:
        dryRun:
          type: boolean
          default: false
          description: >-
            true predicts the outcome and writes NOTHING. The response is
            byte-identical in shape to the apply's.
        bundle:
          $ref: "#/components/schemas/ConfigBundle"
      additionalProperties: false

    ConfigImportItemNote:
      type: object
      description: >-
        One item and what happened to it. `name` is the item's natural key as a
        human reads it -- a name, a "definition/kind" pair for a schedule, a
        "scope@start" pair for a window -- never a bare UUID.
      required: [name, reason]
      properties:
        name:
          type: string
        reason:
          type: string
      additionalProperties: false

    ConfigImportCollectionResult:
      type: object
      description: >-
        One collection's outcome. The three counters are disjoint and every
        bundle item lands in exactly one of them or in `errors`. An ERROR is an
        item that did not import and that the operator can fix in the bundle; a
        WARNING is an item handled correctly whose outcome still needs a human
        (today: the secret-less webhook).
      required: [created, updated, skipped, errors, warnings]
      properties:
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ConfigImportItemNote"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ConfigImportItemNote"
      additionalProperties: false

    ConfigImportResult:
      type: object
      description: Keyed by collection, with the bundle's own key names.
      required:
        - dryRun
        - targets
        - checkDefinitions
        - checkSchedules
        - alertRules
        - webhooks
        - maintenanceWindows
        - rbacRoles
        - rbacBindings
      properties:
        dryRun:
          type: boolean
        targets:
          $ref: "#/components/schemas/ConfigImportCollectionResult"
        checkDefinitions:
          $ref: "#/components/schemas/ConfigImportCollectionResult"
        checkSchedules:
          $ref: "#/components/schemas/ConfigImportCollectionResult"
        alertRules:
          $ref: "#/components/schemas/ConfigImportCollectionResult"
        webhooks:
          $ref: "#/components/schemas/ConfigImportCollectionResult"
        maintenanceWindows:
          $ref: "#/components/schemas/ConfigImportCollectionResult"
        rbacRoles:
          $ref: "#/components/schemas/ConfigImportCollectionResult"
        rbacBindings:
          $ref: "#/components/schemas/ConfigImportCollectionResult"
      additionalProperties: false
