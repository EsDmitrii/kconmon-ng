  /api/v1/incidents:
    get:
      operationId: listIncidents
      tags: [observability]
      summary: One page of saved investigations, newest-created first.
      description: >-
        from/to bound the window an incident's OWN RANGE must OVERLAP, not the
        window it was created in: one that began before the range and is still
        open is exactly the one an operator looking at that range needs. An
        incident with no toAt has an OPEN-ENDED range -- the opposite of what an
        annotation's absent endAt means (an instant mark).
      parameters:
        - name: status
          in: query
          description: Exact match. An unknown value is 400, never a silently empty page.
          schema:
            $ref: "#/components/schemas/IncidentStatus"
        - name: scope
          in: query
          description: >-
            THREE states, as on /api/v1/annotations. Absent means every scope;
            present-but-empty (`?scope=`) means the GLOBAL ones only; any other
            value is an exact match.
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339, exclusive; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of incidents.
