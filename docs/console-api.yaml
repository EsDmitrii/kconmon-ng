      tags: [observability]
      summary: One stored route. An unknown id and a malformed one are both 404.
      description: >-
        Without `enrich=true` the `enrichment` field is ABSENT -- never null,
        never an empty object -- so "did not ask" stays distinguishable from
        "asked and nothing is known". Enrichment is a cache read and NEVER
        fails the trace: an unreadable cache yields an empty map, not an error.
      parameters:
        - name: enrich
          in: query
          description: Only the exact value "true" turns the hop enrichment lookup on.
          schema:
            type: boolean
            default: false
      responses:
