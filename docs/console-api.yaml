      description: >-
        from/to bound the range a window must OVERLAP, not contain: one that
        opened before the range and is still running inside it is exactly the
        one that explains what the operator is looking at. Windows are DATA and
        RENDERING: they mark charts and timeline rows and they SUPPRESS NOTHING.
        Alert rules ARE evaluated (the console syncs them into a PrometheusRule
        and pages webhooks on every firing edge) and no code path consults these
        windows, so declaring one does not silence a page. Correlate them in
        Alertmanager or in your receiver.
      parameters:
        - name: scope
          in: query
          description: >-
            THREE states, as on /api/v1/annotations. Absent means every scope;
            present-but-empty means the GLOBAL ones only; any other value is an
            exact match.
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339, exclusive; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
