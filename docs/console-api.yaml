        opened before the range and is still running inside it is exactly the
        one that explains what the operator is looking at. Windows are DATA and
        RENDERING in M6 -- they mark charts and timeline rows; there is no
        suppression logic, because nothing evaluates alert rules yet.
      parameters:
        - name: scope
          in: query
          description: >-
            THREE states, as on /api/v1/annotations. Absent means every scope;
            present-but-empty means the GLOBAL ones only; any other value is an
            exact match.
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339, exclusive; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of maintenance windows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindowPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
