---
# kconmon-ng Console API -- hand-authored OpenAPI 3.1 description of every
# route internal/console/httpapi/server.go registers under /api/v1.
#
# This file is NOT generated from the Go types, and the Go types are not
# generated from it. What keeps the two honest is a machine-checked join:
# TestEveryAPIRouteIsInTheOpenAPISpec (internal/console/httpapi/openapi_test.go)
# walks the LIVE chi router and fails when a registered /api/v1/* method+path
# is missing here, or when this document names a route the router does not
# serve. Field-level shapes are still reviewed by hand, as they were in M1-M3.
#
# web/src/lib/api-types.ts is generated FROM this file (`make openapi`, or
# `npm run gen:api` in web/) and committed; CI regenerates it and fails on a
# diff, so a spec edit without a regenerate cannot land.
#
# Out of scope by design: /healthz, /readyz, /metrics (probe and scrape
# endpoints, never part of the JSON API) and GET /ws (a WebSocket protocol,
# a WebSocket protocol whose frames are described on GET /ws below).
#
# Conventions repo-wide: durations are integer NANOSECONDS, list endpoints
# page with an opaque keyset cursor plus a `limit` clamped into [1,500]
# (default 100), and every console-originated error is RFC 7807
# application/problem+json.
openapi: 3.1.0

info:
  title: kconmon-ng Console API
  version: "1.0.0"
  summary: REST API of the kconmon-ng console (topology, matrix, events, runs, configuration, RBAC).
  description: >-
    Every route below is served by the console binary under /api/v1. Routes
    whose backing dependency is not configured answer 503 with a problem+json
    body naming the config value that enables them, rather than disappearing
    from the router.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /
    description: The console itself; the SPA and the API share an origin.

tags:
  - name: meta
    description: Version and feature-detection probes. Public.
  - name: observability
    description: >-
      Topology, matrix, event history, MTR path history, chart annotations and
      the guarded PromQL proxy.
  - name: runs
    description: On-demand diagnostics runs.
  - name: configuration
    description: >-
      Targets, check definitions, schedules and console-managed Prometheus
      alert rules -- persisted probe and alerting configuration.
  - name: administration
    description: Audit log, RBAC and API tokens.
  - name: auth
    description: Session lifecycle and identity.

security:
  - bearerAuth: []
  - sessionCookie: []

paths:
  /api/v1/version:
    get:
      operationId: getVersion
      tags: [meta]
      summary: Console build identity and live capability flags.
      description: >-
        `capabilities` is computed per request from this replica's own realtime
        pipeline health, never from config: it holds "events" only while the
        ingester has a proven stream. Always an array, never null.
      security: []
      responses:
        "200":
          description: Build identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /api/v1/config:
    get:
      operationId: getConfig
      tags: [meta]
      summary: What this console instance has wired, for frontend feature detection.
      security: []
      responses:
        "200":
          description: Feature-detection snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /api/v1/topology:
    get:
      operationId: getTopology
      tags: [observability]
      summary: Live cluster topology from the controller, or a reconstruction as of an instant.
      description: >-
        Without `at`, the controller's snapshot verbatim: a non-leader reply is
        retried with backoff, and if every attempt still fails the console
        answers 502. With `at`, the topology is instead REBUILT by folding
        persisted `topology_changed` events up to that instant, and the body
        carries `historical: true` plus the fold's own counters.


        A reconstruction is bounded by what those events record, which since
        M7 is `{reason, nodeName, agentId, zone}` -- the controller attributes
        every emission site, one event per affected agent, and a stated `zone`
        wins while an omitted one never erases a known one. `podIP` is still
        never recorded and comes back empty on every folded entry; `ready`
        means "seen registered and not since removed", not kubelet readiness.
        Events written by pre-M7 controllers carry the reason alone: that
        stretch of history folds to an empty `nodes` array with every such
        event counted in `unfoldableEvents` -- the counter, not the empty
        array, is the honest signal, and it shrinks as those rows age out of
        retention.
      parameters:
        - name: at
          in: query
          description: >-
            RFC 3339 instant to reconstruct the topology at. Absent or empty is
            the live passthrough above, byte-for-byte. A value that does not
            parse, or one in the future, is 400. A value older than the oldest
            retained event -- or any value when nothing is retained -- is 422,
            with a detail naming database.retentionDays. Requires a
            database: with no database configured this parameter alone is
            503, while the live route stays available.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Topology snapshot -- live, or a fold marked `historical`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topology"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/matrix:
    get:
      operationId: getMatrix
      tags: [observability]
      summary: Node-to-node connectivity matrix, recomputed from Prometheus per request.
      description: >-
        Fail ratio and RTT p95 come from 5m-rate-window queries; loss ratio
        (udp/icmp only) is an instant average. A pair with no matching series
        gets a null field rather than a zero. rttP95 is nanoseconds.
      parameters:
        - name: protocol
          in: query
          description: Probe protocol. Anything outside the enum is 400.
          schema:
            $ref: "#/components/schemas/Protocol"
        - name: plane
          in: query
          description: Only "pod" exists so far; anything else is 400.
          schema:
            type: string
            enum: [pod]
            default: pod
      responses:
        "200":
          description: Matrix snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matrix"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/events:
    get:
      operationId: listEvents
      tags: [observability]
      summary: Event history for Live scrollback, newest first.
      description: >-
        Same LiveEvent shape the `live` WebSocket topic delivers, so one type
        serves both. `nextCursor` is set only when the page came back exactly
        as full as requested.
      parameters:
        - name: type
          in: query
          description: Repeatable. An unknown event type is 400.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LiveEventType"
          style: form
          explode: true
        - name: scope
          in: query
          description: Exact match on the event's scope. Mutually exclusive with `scopeNode`.
          schema:
            type: string
        - name: scopeNode
          in: query
          description: >-
            A node or target NAME, matched on either side of the scope: the
            bare scope itself, or a pair scope `<source>→<destination>`
            (U+2192) naming it as source or destination. This is what an object
            card asks for -- an equality filter on `scope` cannot see the pair
            rows a node takes part in. The name is matched literally (LIKE
            metacharacters are escaped server-side). Mutually exclusive with
            `scope`; supplying both is 422.
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339. Must precede `to`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/promql/query:
    post:
      operationId: promqlQuery
      tags: [observability]
      summary: Guarded passthrough to Prometheus /api/v1/query.
      description: >-
        The response envelope -- success or Prometheus's own error body -- is
        forwarded byte-for-byte, never re-shaped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromQLQueryRequest"
      responses:
        "200":
          description: Prometheus's own response envelope, forwarded verbatim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/promql/query_range:
    post:
      operationId: promqlQueryRange
      tags: [observability]
      summary: Guarded passthrough to Prometheus /api/v1/query_range.
      description: >-
        `step` is nanoseconds in this request (the client converts to
        Prometheus's seconds). A range wider than prometheus.maxRange, or a
        result over prometheus.maxResponseBytes, is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromQLRangeRequest"
      responses:
        "200":
          description: Prometheus's own response envelope, forwarded verbatim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Run history, newest first.
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/CheckType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createRun
      tags: [runs]
      summary: Start a diagnostics run (asynchronous).
      description: >-
        Fan-out over sources x destinations -- full mesh, or one-sided when
        either is empty, resolved against live topology -- bounded to 400 pairs
        after self-pair exclusion. A malformed body or unknown type is 400; a
        well-formed spec refused for what it would produce (too many pairs, no
        pairs, no nodes) is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateRequest"
      responses:
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "202":
          description: Run accepted and started.
          headers:
            Location:
              description: Permalink to the run.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      operationId: getRun
      tags: [runs]
      summary: One run's summary plus its per-pair results.
      description: >-
        Also the documented REST-polling fallback when the run's `run:{id}`
        WebSocket topic is unavailable.
      responses:
        "200":
          description: Run detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run in flight.
      description: >-
        Requires runs:create -- starting fleet-wide probe traffic and stopping
        it are the same operational class. Cancellation is asynchronous: pairs
        already dispatched still record their outcome, pairs not yet dispatched
        never dispatch, and the run reaches status `cancelled`. Read the final
        state from GET /api/v1/runs/{id}. Three outcomes, and only two of them
        are 204: the run is cancelled here or forwarded over the cross-replica
        bus (204); the run is already terminal, so there is nothing to cancel
        (204); or the run belongs to another replica and this console has no
        cross-replica bus to forward on, in which case it answers 502 with the
        title `cancel not delivered` and the run keeps going on its owner. A
        client must branch on that 502 -- it is not a no-op, and the stuck-run
        reaper only finishes a run whose owner has gone away entirely.
      responses:
        "204":
          description: Cancellation accepted (or the run was already terminal).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/targets:
    get:
      operationId: listTargets
      tags: [configuration]
      summary: One page of external probe targets, newest first.
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/TargetKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTarget
      tags: [configuration]
      summary: Create one target.
      description: >-
        A duplicate name is 422, not 409: it is a rejected field value in an
        otherwise well-formed body. So is an `address` that provably resolves
        outside `config.checkers.external.allowedCidrs` -- no agent in the fleet
        could ever probe it, so it is refused at the moment it is created rather
        than left to time out on every check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetRequest"
      responses:
        "201":
          description: Target created.
          headers:
            Location:
              description: Permalink to the new target.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/targets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      operationId: getTarget
      tags: [configuration]
      summary: One target. An unknown id and a malformed one are both 404.
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateTarget
      tags: [configuration]
      summary: Replace one target in full (an omitted field means empty, never "leave as-is").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetRequest"
      responses:
        "200":
          description: The stored row after the write, not an echo of the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteTarget
      tags: [configuration]
      summary: Delete one target; 409 while any check definition still references it.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/checks:
    get:
      operationId: listCheckDefinitions
      tags: [configuration]
      summary: One page of check definitions, newest first.
      parameters:
        - name: targetId
          in: query
          description: Must be a UUID; a typo is 400, never 502.
          schema:
            type: string
            format: uuid
        - name: enabled
          in: query
          description: Anything other than "true"/"false" is treated as unset.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of check definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckDefinitionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createCheckDefinition
      tags: [configuration]
      summary: Create one check definition.
      description: >-
        The projection guard runs before the write and only for a definition
        arriving enabled: over the 400-series limit it is 422, while the same
        definition saved with "enabled": false is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckDefinitionRequest"
      responses:
        "201":
          description: Check definition created.
          headers:
            Location:
              description: Permalink to the new definition.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/checks/projection:
    post:
      operationId: projectCheckDefinition
      tags: [configuration]
      summary: What a draft definition WOULD project against the live topology.
      description: >-
        Persists nothing. Same function, same limit the create/update guard
        uses, so the number the UI shows can never disagree with enforcement.
        Gated on checks:write, not checks:read -- the body is a draft
        definition, and a caller who cannot create one has no question to ask.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckDefinitionRequest"
      responses:
        "200":
          description: The projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/checks/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      operationId: getCheckDefinition
      tags: [configuration]
      summary: One check definition. An unknown id and a malformed one are both 404.
      responses:
        "200":
          description: The check definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateCheckDefinition
      tags: [configuration]
      summary: Replace one check definition in full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckDefinitionRequest"
      responses:
        "200":
          description: The stored row after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteCheckDefinition
      tags: [configuration]
      summary: Delete one check definition; its schedules cascade with it.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
