  /api/v1/incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      operationId: getIncident
      tags: [observability]
      summary: One saved investigation.
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateIncident
      tags: [observability]
      summary: Update a SUBSET of an incident. The one PATCH in this API.
      description: >-
        THE exception to this API's full-replace PUT convention, and a
        deliberate one: an incident evolves under collaboration -- one operator
        types notes while another pins a finding and a third resolves it -- so a
        full replace would make every edit a read-modify-write over the whole
        row and let the last writer silently discard the other two's work. The
        body is any SUBSET of status/notes/pinned; an EMPTY subset is 422,
        because a patch that asks for nothing is far more likely a typo'd field
        name than a deliberate no-op. Transitions: open -> resolved stamps
        resolvedAt from the server's clock, resolved -> open CLEARS it, and a
        status equal to the current one is a no-op rather than a re-stamp. The
        whole body is validated before the first write, so a rejected patch
        changes nothing. The audit row records the status alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentPatchRequest"
      responses:
        "200":
          description: The incident as stored after the patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteIncident
      tags: [observability]
      summary: Remove one investigation; deleting one that is not there is 404.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/maintenance:
