  /api/v1/annotations:
    get:
      operationId: listAnnotations
      tags: [observability]
      summary: One page of operator notes pinned to moments or spans.
      description: >-
        from/to bound the window an annotation must OVERLAP, not the window its
        start must fall in: a span that began before from and is still running
        at from is exactly the mark a chart needs to draw. Either side absent
        is unbounded on that side.
      parameters:
        - name: from
          in: query
          description: RFC3339; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339, exclusive; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - name: scope
          in: query
          description: >-
            THREE states. Absent means every scope; present-but-empty
            (`?scope=`) means the GLOBAL ones only, because "" is a real scope
            value here; any other value is an exact match.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of annotations.
