            format: date-time
        - name: to
          in: query
          description: RFC3339, exclusive; absent means unbounded on this side.
          schema:
            type: string
            format: date-time
        - name: scope
          in: query
          description: >-
            THREE states. Absent means every scope; present-but-empty
            (`?scope=`) means the GLOBAL ones only, because "" is a real scope
