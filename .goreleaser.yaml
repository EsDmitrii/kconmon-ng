---
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: agent
    main: ./cmd/agent
    binary: kconmon-ng-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.Version={{.Version}}
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.Commit={{.Commit}}
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.BuildDate={{.Date}}

  - id: controller
    main: ./cmd/controller
    binary: kconmon-ng-controller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.Version={{.Version}}
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.Commit={{.Commit}}
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.BuildDate={{.Date}}

  - id: kubectl-kconmon
    main: ./cmd/kubectl-kconmon
    binary: kubectl-kconmon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.Version={{.Version}}
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.Commit={{.Commit}}
      - -X github.com/EsDmitrii/kconmon-ng/internal/config.BuildDate={{.Date}}

dockers:
  - id: agent-amd64
    ids: [agent]
    use: buildx
    image_templates:
      - "ghcr.io/esdmitrii/kconmon-ng-agent:{{.Version}}-amd64"
    dockerfile: Dockerfile.agent
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=kconmon-ng-agent"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/EsDmitrii/kconmon-ng"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.created={{.Date}}"

  - id: agent-arm64
    ids: [agent]
    use: buildx
    image_templates:
      - "ghcr.io/esdmitrii/kconmon-ng-agent:{{.Version}}-arm64"
    dockerfile: Dockerfile.agent
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=kconmon-ng-agent"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/EsDmitrii/kconmon-ng"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.created={{.Date}}"

  - id: controller-amd64
    ids: [controller]
    use: buildx
    image_templates:
      - "ghcr.io/esdmitrii/kconmon-ng-controller:{{.Version}}-amd64"
    dockerfile: Dockerfile.controller
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=kconmon-ng-controller"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/EsDmitrii/kconmon-ng"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.created={{.Date}}"

  - id: controller-arm64
    ids: [controller]
    use: buildx
    image_templates:
      - "ghcr.io/esdmitrii/kconmon-ng-controller:{{.Version}}-arm64"
    dockerfile: Dockerfile.controller
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=kconmon-ng-controller"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/EsDmitrii/kconmon-ng"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.created={{.Date}}"

docker_manifests:
  - name_template: "ghcr.io/esdmitrii/kconmon-ng-agent:{{.Version}}"
    image_templates:
      - "ghcr.io/esdmitrii/kconmon-ng-agent:{{.Version}}-amd64"
      - "ghcr.io/esdmitrii/kconmon-ng-agent:{{.Version}}-arm64"

  - name_template: "ghcr.io/esdmitrii/kconmon-ng-agent:latest"
    # A prerelease must not move :latest; same gate as the krew and console-image steps.
    skip_push: auto
    image_templates:
      - "ghcr.io/esdmitrii/kconmon-ng-agent:{{.Version}}-amd64"
      - "ghcr.io/esdmitrii/kconmon-ng-agent:{{.Version}}-arm64"

  - name_template: "ghcr.io/esdmitrii/kconmon-ng-controller:{{.Version}}"
    image_templates:
      - "ghcr.io/esdmitrii/kconmon-ng-controller:{{.Version}}-amd64"
      - "ghcr.io/esdmitrii/kconmon-ng-controller:{{.Version}}-arm64"

  - name_template: "ghcr.io/esdmitrii/kconmon-ng-controller:latest"
    # A prerelease must not move :latest; same gate as the krew and console-image steps.
    skip_push: auto
    image_templates:
      - "ghcr.io/esdmitrii/kconmon-ng-controller:{{.Version}}-amd64"
      - "ghcr.io/esdmitrii/kconmon-ng-controller:{{.Version}}-arm64"

# Keyless cosign for the agent/controller images, same trust model as the console image signed in
# release.yaml: sign the digest, because tags are mutable and digests are what verifiers pin.
docker_signs:
  - cmd: cosign
    artifacts: all
    args: ["sign", "--yes", "${artifact}@${digest}"]

archives:
  - id: server
    ids: [agent, controller]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # krew requires the plugin binary and a LICENSE in each platform archive.
  - id: kubectl-kconmon
    ids: [kubectl-kconmon]
    formats: [tar.gz]
    name_template: "kconmon_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

# Bare-host packages for the agent only (external agents dial the controller through the TLS
# gateway); the controller stays container-only and the kubectl plugin ships via krew.
nfpms:
  - id: agent
    ids: [agent]
    package_name: kconmon-ng-agent
    vendor: Dmitrii Esin
    homepage: https://github.com/EsDmitrii/kconmon-ng
    maintainer: Dmitrii Esin <esdmitrii@gmail.com>
    description: |-
      kconmon-ng external agent.
      Registers with a kconmon-ng controller over the TLS external gateway and
      runs TCP/UDP/ICMP/DNS/HTTP/MTR probes against the fleet.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/agent/kconmon-ng-agent.service
        dst: /usr/lib/systemd/system/kconmon-ng-agent.service
      # Vendor sysctl dir, not /etc: the admin overrides in /etc/sysctl.d without a conffile fight.
      - src: packaging/agent/sysctl.d/50-kconmon-ng.conf
        dst: /usr/lib/sysctl.d/50-kconmon-ng.conf
      # Conffile: dpkg keeps the admin's edits on upgrade, rpm writes .rpmnew next to them.
      - src: packaging/agent/config.yaml
        dst: /etc/kconmon-ng/config.yaml
        type: config|noreplace
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh

checksum:
  name_template: checksums.txt

# Keyless cosign over checksums.txt: one blob signature covers every archive listed in it.
# cosign v3 made the sigstore bundle the default output; --output-signature/--output-certificate
# are ignored under it and cosign then writes the bundle to an empty path — the v2.2.0 release
# died exactly there. One .sigstore.json bundle now carries signature and certificate both.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"

# SPDX SBOMs for the archives (agent, controller, kubectl plugin); syft is installed in release.yaml.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: EsDmitrii
    name: kconmon-ng
  prerelease: auto
  # Create the release as a draft: GitHub immutable releases seal assets at publish time.
  draft: true
