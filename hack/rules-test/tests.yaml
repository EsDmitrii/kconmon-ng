      - eval_time: 8m
        alertname: PathMTUBlackHole
        exp_alerts: []
      - eval_time: 9m
        alertname: PathMTUBlackHole
        exp_alerts: []
      - eval_time: 12m
        alertname: PathMTUBlackHole
        exp_alerts: []

  # ── checkers.pmtu.interval 5m: six probes per 30m, the one at minute 60 loses the full size ──
  # ── once; nothing pages, per pair or from the zone family ──
  - interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: '0x59 1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0x4 1x4 2x4 3x4 4x4 5x4 6x4 7x4 8x4 9x4 10x4 11x9 12x4 13x4 14x4 15x4 16x4 17x4 18x4 19'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_bytes{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",pod="p1"}
        values: '1500x59 1400x4 1500x35'
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="c",destination_zone="d",result="fail",pod="p1"}
        values: '0x59 1x40'
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="c",destination_zone="d",result="success",pod="p1"}
        values: '0x4 1x4 2x4 3x4 4x4 5x4 6x4 7x4 8x4 9x4 10x4 11x9 12x4 13x4 14x4 15x4 16x4 17x4 18x4 19'
    alert_rule_test:
      - eval_time: 66m
        alertname: PathMTUBlackHole
        exp_alerts: []
      - eval_time: 68m
        alertname: PathMTUBlackHole
        exp_alerts: []
      - eval_time: 72m
        alertname: PathMTUBlackHole
        exp_alerts: []
      - eval_time: 66m
        alertname: ZonePathMTUBlackHole
        exp_alerts: []
      - eval_time: 68m
        alertname: ZonePathMTUBlackHole
        exp_alerts: []

  # ── zone-only scrape, ECMP split between the zones: one probe in three loses the full size ──
  - interval: 1m
    input_series:
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: >-
          0x2 1x2 2x2 3x2 4x2 5x2 6x2 7x2 8x2 9x2 10x2 11x2 12x2 13x2 14x2 15x2 16x2 17x2 18x2 19x2 20
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: >-
          0 1 2x1 3 4x1 5 6x1 7 8x1 9 10x1 11 12x1 13 14x1 15 16x1 17 18x1 19 20x1 21 22x1 23 24x1 25 26x1
          27 28x1 29 30x1 31 32x1 33 34x1 35 36x1 37 38x1 39 40x1
    alert_rule_test:
      - eval_time: 50m
        alertname: ZonePathMTUBlackHole
        exp_alerts:
          - exp_labels:
              severity: warning
              source_zone: a
              destination_zone: b
              namespace: default
            exp_annotations:
              description: >-
                Large packets between the zones are dropped without ICMP frag-needed. The console
                Matrix shows which node pairs.
              investigateUrl: /investigate?kind=zone-pair&scope=a->b
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#zonepathmtublackhole
              summary: Path MTU black hole zone a -> zone b in 31.03% of probes

  # ── five nodes, n3 registered but unreachable: n1, n2, n4, n5 all fail TCP to it and its own ──
  # ── series are not scraped either; exactly one NodeUnreachable, no NodeIsolated ──
  - interval: 30s
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",destination_zone="z",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n3",destination_zone="z",result="fail"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n4",destination_zone="z",result="success"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n2",destination_node="n1",destination_zone="z",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n2",destination_node="n3",destination_zone="z",result="fail"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n2",destination_node="n4",destination_zone="z",result="success"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n4",destination_node="n1",destination_zone="z",result="success"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n4",destination_node="n2",destination_zone="z",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n4",destination_node="n3",destination_zone="z",result="fail"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n4",destination_node="n5",destination_zone="z",result="success"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n5",destination_zone="z",result="success"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n2",destination_node="n5",destination_zone="z",result="success"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n5",destination_node="n1",destination_zone="z",result="success"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n5",destination_node="n2",destination_zone="z",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n5",destination_node="n3",destination_zone="z",result="fail"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n5",destination_node="n4",destination_zone="z",result="success"}
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              destination_node: n3
              destination_zone: z
              namespace: default
            exp_annotations:
              description: >-
                Its agent still runs, but peers cannot reach it over TCP. Check the node itself first:
                the CNI agent, the host firewall, kubelet.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#nodeunreachable
              summary: Node n3 unreachable from 100% of its peers
      - eval_time: 15m
        alertname: NodeIsolated
        exp_alerts: []

  # ── n1 egress broken: n1 fails to all three peers, inbound to n1 fine; one NodeIsolated ──
  - interval: 30s
    input_series:
      - series: kconmon_ng_tcp_results_total{source_node="n1",source_zone="z",destination_node="n2",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",source_zone="z",destination_node="n3",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",source_zone="z",destination_node="n4",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n2",source_zone="z",destination_node="n1",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n3",source_zone="z",destination_node="n1",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n4",source_zone="z",destination_node="n1",result="success"}
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeIsolated
        exp_alerts:
          - exp_labels:
              severity: critical
              source_node: n1
              source_zone: z
              namespace: default
            exp_annotations:
              description: >-
                The node's own egress is broken: check its CNI agent, routes and network policy, not
                the peers.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#nodeisolated
              summary: Node n1 cannot reach 100% of its peers
      - eval_time: 15m
        alertname: NodeUnreachable
        exp_alerts: []

  # ── one bad pair among four nodes, the strict 0.5 boundary, and a two-node cluster: no node-level alert ──
  - interval: 30s
    input_series:
      # n1 -> n2 fails: n2 is failed by 1 of its 3 probing peers, n1 fails 1 of its 3 targets.
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n3",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n4",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n3",destination_node="n2",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n4",destination_node="n2",result="success"}
        values: '0+10x40'
      # b1 -> b2 fails: b2 is failed by exactly half of its probers and b1 fails exactly half of
      # its targets; both rules need MORE than the 0.5 threshold.
      - series: kconmon_ng_tcp_results_total{source_node="b1",destination_node="b2",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="b1",destination_node="b3",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="b3",destination_node="b2",result="success"}
        values: '0+10x40'
      # A two-node cluster: one prober per node is below minPeers.
      - series: kconmon_ng_tcp_results_total{source_node="m1",destination_node="m2",result="fail"}
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeUnreachable
        exp_alerts: []
      - eval_time: 15m
        alertname: NodeIsolated
        exp_alerts: []

  # ── probing stops at minute 40: an intended pair and a source without probe_intended fire, ──
  # ── a pair the plan dropped at minute 40 stays quiet ──
  - interval: 1m
    input_series:
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",result="success"}
        values: '0+10x40 _x40'
      - series: kconmon_ng_probe_intended{source_node="n1",destination_node="n2"}
        values: '1x80'
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n3",result="success"}
        values: '0+10x40 _x40'
      - series: kconmon_ng_probe_intended{source_node="n1",destination_node="n3"}
        values: '1x40 0x40'
      - series: kconmon_ng_tcp_results_total{source_node="old",destination_node="n2",result="success"}
        values: '0+10x40 _x40'
    alert_rule_test:
      - eval_time: 50m
        alertname: PairWentSilent
        exp_alerts: []
      - eval_time: 60m
        alertname: PairWentSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              destination_node: n2
              namespace: default
            exp_annotations:
              description: >-
                The other rules say nothing about this pair now. Check the agent pod on n1 and its
                scrape target; a removed node clears within an hour.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#pairwentsilent
              summary: No probe results n1 -> n2 for over 10m
          - exp_labels:
              severity: warning
              source_node: old
              destination_node: n2
              namespace: default
            exp_annotations:
              description: >-
                The other rules say nothing about this pair now. Check the agent pod on old and its
                scrape target; a removed node clears within an hour.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#pairwentsilent
              summary: No probe results old -> n2 for over 10m

  # ── n1 -> n2 loses 80% of UDP and fails 10% of TCP, a resolver and an external target fail ──
  - interval: 30s
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_udp_packet_loss_ratio{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b"}
        values: '0.8x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail"}
        values: '0+1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success"}
        values: '0+9x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_dns_results_total{source_node="n1",source_zone="a",host="db.internal",resolver="10.96.0.10",result="fail"}
        values: '0+1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_external_results_total{source_node="n1",source_zone="a",target="203.0.113.10:443",target_kind="ip",check_type="tcp",result="fail"}
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: UDPLossHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              destination_node: n2
              source_zone: a
              destination_zone: b
              namespace: default
            exp_annotations:
              description: Check whether n1 loses packets to its other peers too or only to this one.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#udplosshigh
              summary: UDP loss n1 -> n2 at 80%
      - eval_time: 15m
        alertname: TCPChecksFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              destination_node: n2
              source_zone: a
              destination_zone: b
              namespace: default
            exp_annotations:
              description: >-
                If UDP and ICMP fail on the same pair, suspect the path; if only TCP fails, a listener
                or network policy.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#tcpchecksfailing
              summary: TCP checks failing n1 -> n2 at 10% of probes
      - eval_time: 15m
        alertname: DNSChecksFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              source_zone: a
              host: db.internal
              resolver: 10.96.0.10
              namespace: default
            exp_annotations:
              description: 'A resolver problem, not a peer link: check CoreDNS and the node''s resolv.conf first.'
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#dnschecksfailing
              summary: DNS failing on n1 for db.internal via 10.96.0.10 at 100%
      - eval_time: 15m
        alertname: ExternalChecksFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              source_zone: a
              target: 203.0.113.10:443
              target_kind: ip
              check_type: tcp
              namespace: default
            exp_annotations:
              description: >-
                Probes to the ip target fail. A probe the allowlist refused is counted in
                external_denied_total instead.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#externalchecksfailing
              summary: External target 203.0.113.10:443 failing from n1 at 100%

  # ── both controller replicas report leader=0: nobody distributes peer lists ──
  - interval: 30s
    input_series:
      - series: kconmon_ng_controller_leader{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '0x40'
      - series: kconmon_ng_controller_leader{instance="c2",job="kconmon-ng-controller",pod="ctrl-1"}
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: KconmonControllerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: default
            exp_annotations:
              description: >-
                Agents keep probing a frozen topology. Check the controller Deployment, its lease and
                its scrape target.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#kconmoncontrollerdown
              summary: No kconmon-ng controller has reported itself leader for 5m
