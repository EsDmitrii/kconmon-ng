              destination_zone: b
            exp_annotations:
              summary: Path MTU black hole zone a -> zone b in 100% of probes
              description: >-
                100% of path MTU probes from zone a to zone b lost their full-size datagram
                with no ICMP frag-needed: more than 50% over the last 10m, or more than 10%
                over the last 30m, at least two of them, with one in the last 10m, which is one
                black-holed path among several ECMP next hops. This zone-level rule fires only
                while Prometheus holds no per-pair path MTU series for the zone pair, as under
                agent.metrics.detail=zone-only; otherwise PathMTUBlackHole names the node
