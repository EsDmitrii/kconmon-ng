        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n5",destination_node="n1",destination_zone="z",result="success"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n5",destination_node="n2",destination_zone="z",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n5",destination_node="n3",destination_zone="z",result="fail"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n5",destination_node="n4",destination_zone="z",result="success"}
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              destination_node: n3
              destination_zone: z
            exp_annotations:
              summary: Node n3 unreachable from 100% of its peers
              description: >-
                TCP probes to n3 (zone z) fail for 100% of the peers that probe it,
                above the 50% threshold, for 5m. The node is still registered, so its agent
                runs while its peers cannot reach it: look at the node itself (kubelet, the
                CNI agent, the host firewall) before the pairs. A node that stops altogether
                leaves the mesh within the agent TTL and pages as KconmonAgentsMissing
                instead. The inhibit_rules example in the metrics guide mutes the pair
                alerts this one explains.
      - eval_time: 15m
        alertname: NodeIsolated
        exp_alerts: []

  # ── n1 egress broken: n1 fails to all three peers, inbound to n1 fine; one NodeIsolated ──
  - interval: 30s
    input_series:
      - series: kconmon_ng_tcp_results_total{source_node="n1",source_zone="z",destination_node="n2",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",source_zone="z",destination_node="n3",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",source_zone="z",destination_node="n4",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n2",source_zone="z",destination_node="n1",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n3",source_zone="z",destination_node="n1",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n4",source_zone="z",destination_node="n1",result="success"}
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeIsolated
        exp_alerts:
          - exp_labels:
              severity: critical
              source_node: n1
              source_zone: z
            exp_annotations:
              summary: Node n1 cannot reach 100% of its peers
              description: >-
                TCP probes from n1 (zone z) fail to 100% of the peers it probes, above the
                50% threshold, for 5m. The node's own egress is broken: its network policy,
                routes or CNI agent, not the peers. The inhibit_rules example in the metrics
                guide mutes the pair alerts this one explains.
      - eval_time: 15m
        alertname: NodeUnreachable
        exp_alerts: []

  # ── one bad pair among four nodes, the strict 0.5 boundary, and a two-node cluster: no node-level alert ──
  - interval: 30s
    input_series:
      # n1 -> n2 fails: n2 is failed by 1 of its 3 probing peers, n1 fails 1 of its 3 targets.
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n3",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n4",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n3",destination_node="n2",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="n4",destination_node="n2",result="success"}
        values: '0+10x40'
      # b1 -> b2 fails: b2 is failed by exactly half of its probers and b1 fails exactly half of
      # its targets; both rules need MORE than the 0.5 threshold.
      - series: kconmon_ng_tcp_results_total{source_node="b1",destination_node="b2",result="fail"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="b1",destination_node="b3",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_tcp_results_total{source_node="b3",destination_node="b2",result="success"}
        values: '0+10x40'
      # A two-node cluster: one prober per node is below minPeers.
      - series: kconmon_ng_tcp_results_total{source_node="m1",destination_node="m2",result="fail"}
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeUnreachable
        exp_alerts: []
      - eval_time: 15m
        alertname: NodeIsolated
        exp_alerts: []

  # ── probing stops at minute 40: an intended pair and a source without probe_intended fire, ──
  # ── a pair the plan dropped at minute 40 stays quiet ──
  - interval: 1m
    input_series:
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",result="success"}
        values: '0+10x40 _x40'
      - series: kconmon_ng_probe_intended{source_node="n1",destination_node="n2"}
        values: '1x80'
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n3",result="success"}
        values: '0+10x40 _x40'
      - series: kconmon_ng_probe_intended{source_node="n1",destination_node="n3"}
        values: '1x40 0x40'
      - series: kconmon_ng_tcp_results_total{source_node="old",destination_node="n2",result="success"}
        values: '0+10x40 _x40'
    alert_rule_test:
      - eval_time: 50m
        alertname: PairWentSilent
        exp_alerts: []
      - eval_time: 60m
        alertname: PairWentSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              destination_node: n2
            exp_annotations:
              summary: No probe results at all from n1 -> n2 for over 10m
              description: >-
                n1 was probing n2 within the last hour and has reported nothing for 5m plus the
                10m this rule waits, so no failure ratio can be computed for this link and the
                other rules in this group have gone quiet about it rather than healthy. Either
                the source agent stopped running or stopped being scraped, or the pair left the
                topology. Check the agent pod on n1 and its scrape target first, then the
                controller's peer list -- a node that was drained or removed produces this too,
                and the alert clears on its own an hour after the last result. A pair the
                sparse topology plan dropped does NOT fire: the rule only matches pairs the
                source agent still marks in its probe_intended series, and falls back to the
                plain two-window comparison for agents that do not export that family yet. Zone
                labels are absent by design: this rule compares label sets across two time
                windows and pairs are matched on node names only.
          - exp_labels:
              severity: warning
              source_node: old
              destination_node: n2
            exp_annotations:
              summary: No probe results at all from old -> n2 for over 10m
              description: >-
                old was probing n2 within the last hour and has reported nothing for 5m plus the
                10m this rule waits, so no failure ratio can be computed for this link and the
                other rules in this group have gone quiet about it rather than healthy. Either
                the source agent stopped running or stopped being scraped, or the pair left the
                topology. Check the agent pod on old and its scrape target first, then the
                controller's peer list -- a node that was drained or removed produces this too,
                and the alert clears on its own an hour after the last result. A pair the
                sparse topology plan dropped does NOT fire: the rule only matches pairs the
                source agent still marks in its probe_intended series, and falls back to the
                plain two-window comparison for agents that do not export that family yet. Zone
                labels are absent by design: this rule compares label sets across two time
                windows and pairs are matched on node names only.

  # ── n1 -> n2 loses 80% of UDP and fails 10% of TCP, a resolver and an external target fail ──
  - interval: 30s
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_udp_packet_loss_ratio{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b"}
        values: '0.8x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail"}
        values: '0+1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success"}
        values: '0+9x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_dns_results_total{source_node="n1",source_zone="a",host="db.internal",resolver="10.96.0.10",result="fail"}
        values: '0+1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_external_results_total{source_node="n1",source_zone="a",target="203.0.113.10:443",target_kind="ip",check_type="tcp",result="fail"}
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: UDPLossHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              destination_node: n2
              source_zone: a
              destination_zone: b
            exp_annotations:
              summary: UDP loss n1 -> n2 at 80%
              description: >-
                UDP packet loss from n1 (zone a) to n2 (zone b) has held at 80% for 5m, over
                the 50% threshold. Drill this exact pair on the kconmon-ng console Investigate
                page, or open the "kconmon-ng / Node Detail" Grafana dashboard with node=n1 to
                see whether the same node is losing packets to its other peers or only to this
                one.
      - eval_time: 15m
        alertname: TCPChecksFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              destination_node: n2
              source_zone: a
              destination_zone: b
            exp_annotations:
              summary: TCP checks failing n1 -> n2 at 10% of probes
              description: >-
                10% of TCP probes from n1 (zone a) to n2 (zone b) failed over the last 5m,
                above the 5% failure-ratio threshold. Open the pair on the kconmon-ng console
                Investigate page, or the worst-pairs table on the "kconmon-ng / Overview"
                Grafana dashboard to see whether UDP and ICMP fail on the same link (a path
                problem) or TCP fails alone (a listener or policy problem).
      - eval_time: 15m
        alertname: DNSChecksFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              source_zone: a
              host: db.internal
              resolver: 10.96.0.10
            exp_annotations:
              summary: DNS failing on n1 for db.internal via 10.96.0.10 at 100%
              description: >-
                100% of lookups of db.internal through resolver 10.96.0.10 from n1 (zone a)
                failed over the last 5m, above the 5% threshold. This is resolver-side, not a
                peer link, so check CoreDNS/kube-dns and the node's resolv.conf before the
                network. The kconmon-ng console Investigate page scoped to n1 shows whether
                its peer probes degraded at the same moment.
      - eval_time: 15m
        alertname: ExternalChecksFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              source_zone: a
              target: 203.0.113.10:443
              target_kind: ip
              check_type: tcp
            exp_annotations:
              summary: External target 203.0.113.10:443 failing from n1 at 100%
              description: >-
                100% of probes to external target 203.0.113.10:443 (kind ip) from n1 (zone a)
                failed over the last 5m, above the 10% threshold. A probe the allowlist
                refused never reaches this counter, so if the target looks untested rather
                than failing, read the external_denied_total counter for its reason (cidr,
                resolve or disabled) before suspecting the network.

  # ── both controller replicas report leader=0: nobody distributes peer lists ──
  - interval: 30s
    input_series:
      - series: kconmon_ng_controller_leader{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '0x40'
      - series: kconmon_ng_controller_leader{instance="c2",job="kconmon-ng-controller",pod="ctrl-1"}
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: KconmonControllerDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: No kconmon-ng controller has reported itself leader for 5m
              description: >-
                Every controller replica is reporting leader=0, or Prometheus is scraping none
                of them. Peer lists stop being distributed, so agents keep probing a frozen
                topology and every other rule in this group quietly stops describing reality.
                Check the controller Deployment, its lease in the release namespace, and the
                controller scrape target in Prometheus.
