                pings pass. Compare the MTU of the interfaces on n1 with the CNI overhead.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#pathmtublackhole
              summary: 'Path MTU black hole n1 -> n2: only packets up to 1400 bytes get through'
      - eval_time: 58m
        alertname: PathMTUBlackHole
        exp_alerts:
          - exp_labels: *ecmp_labels
            exp_annotations: *ecmp_annotations

  # ── ECMP split, 2 paths: every other probe is lost, the ratio hovers at exactly 0.5 ──
  - interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: >-
          0x1 1x1 2x1 3x1 4x1 5x1 6x1 7x1 8x1 9x1 10x1 11x1 12x1 13x1 14x1 15x1 16x1 17x1 18x1 19x1 20x1
          21x1 22x1 23x1 24x1 25x1 26x1 27x1 28x1 29x1 30
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0 1x1 2x1 3x1 4x1 5x1 6x1 7x1 8x1 9x1 10x1 11x1 12x1 13x1 14x1 15x1 16x1 17x1 18x1 19x1 20x1 21x1
          22x1 23x1 24x1 25x1 26x1 27x1 28x1 29x1 30x1'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_bytes{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",pod="p1"}
        values: '1500x1 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500
          1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400
          1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500 1400 1500
          1400 1500 1400'
    alert_rule_test:
      - eval_time: 25m
        alertname: PathMTUBlackHole
        exp_alerts:
          - exp_labels: *ecmp_labels
            exp_annotations: *ecmp_annotations
      - eval_time: 45m
        alertname: PathMTUBlackHole
        exp_alerts:
          - exp_labels: *ecmp_labels
            exp_annotations: *ecmp_annotations

  # ── lossy path: a false black hole at minute 12 and two back to back at 40 and 41, each at a ──
  # ── random size, the other probes cross; nothing pages ──
  - interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail",pod="p1"}
