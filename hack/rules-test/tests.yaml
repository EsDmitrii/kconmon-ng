---
# promtool test rules fixture. Purpose #1 is EVALUATION: every alert expression must evaluate
# without an engine error against series carrying all metric families at once (the input that
# makes a __name__ union collide). Purpose #2 is a positive proof per alert: crafted bad data must
# actually fire it — an expression that silently matches nothing passes purpose #1.
rule_files:
  - RULES_FILE

evaluation_interval: 30s

tests:
  # ── all families present and healthy: nothing may error, nothing may fire ──
  - interval: 30s
    input_series:
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="b",pod="p1"}
        values: '0+50x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="b",pod="p1"}
        values: '0+50x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="b",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="b",pod="p1"}
        values: '0+10x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success"}
        values: '0+10x40'
      - series: kconmon_ng_probe_intended{source_node="n1",destination_node="n2"}
        values: '1x40'
      # Three nodes, three in-cluster agents plus one external: registered exceeds expected and
      # the external gauge explains the surplus, so nothing is missing.
      - series: kconmon_ng_controller_expected_agents{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '3x40'
      - series: kconmon_ng_controller_registered_agents{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '4x40'
      - series: kconmon_ng_controller_external_agents{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '1x40'
      - series: kconmon_ng_controller_leader{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '1x40'
      # yamllint disable-line rule:line-length
      - series: up{job="kconmon-ng-agent-external",instance="10.20.30.40:9091",node="edge-host-01",zone="external",external="true",agent_id="edge-host-01-edge-host-01"}
        values: '1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success"}
        values: '0+1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail"}
        values: '0x40'
      - series: kconmon_ng_pmtu_bytes{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b"}
        values: '1500x40'
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ZoneChecksFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: ZonePathMTUBlackHole
        exp_alerts: []
      - eval_time: 15m
        alertname: ZoneLossHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: PairWentSilent
        exp_alerts: []
      - eval_time: 15m
        alertname: KconmonAgentsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: KconmonExternalAgentDown
        exp_alerts: []
      - eval_time: 15m
        alertname: PathMTUBlackHole
        exp_alerts: []
      - eval_time: 15m
        alertname: NodeUnreachable
        exp_alerts: []
      - eval_time: 15m
        alertname: NodeIsolated
        exp_alerts: []

  # ── zone failure: every probe on every protocol fails a->b; both zone alerts must fire ──
  - interval: 30s
    input_series:
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="b",pod="p1"}
        values: '0+50x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="b",pod="p1"}
        values: '0x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="b",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="b",pod="p1"}
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ZoneChecksFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source_zone: a
              destination_zone: b
              namespace: default
            exp_annotations:
              description: >-
                The Zone Heatmap dashboard shows which protocol and direction fail; the console Matrix
                shows the node pairs.
              investigateUrl: /investigate?kind=zone-pair&scope=a->b
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#zonechecksfailing
              summary: Zone checks failing a -> b at 100% of probes
      - eval_time: 15m
        alertname: ZoneLossHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              source_zone: a
              destination_zone: b
              namespace: default
            exp_annotations:
              description: UDP and ICMP loss across all pairs between the zones; UDPLossHigh names a single broken pair.
              investigateUrl: /investigate?kind=zone-pair&scope=a->b
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#zonelosshigh
              summary: Packet loss a -> b at 100%

  # ── one pair of six UDP-blackholed: the zone ratios are not diluted enough to stay quiet ──
  # The demo stand's first break, zone a (3 agents) -> zone c (2 nodes): 50/360 = 13.9% of the
  # packets lost and 10/180 = 5.6% of the probes failed, above both defaults. The docs promise
  # this for small zone pairs, so it is pinned rather than hidden.
  - interval: 30s
    input_series:
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="c",result="success",pod="p1"}
        values: '0+20x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="c",result="success",pod="p1"}
        values: '0+20x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="success",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="fail",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="c",pod="p1"}
        values: '0+100x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="c",pod="p1"}
        values: '0+50x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="c",pod="p1"}
        values: '0+20x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="c",pod="p1"}
        values: '0+20x40'
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="c",result="success",pod="p2"}
        values: '0+20x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="c",result="success",pod="p2"}
        values: '0+20x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="success",pod="p2"}
        values: '0+20x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="c",pod="p2"}
        values: '0+100x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="c",pod="p2"}
        values: '0+100x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="c",pod="p2"}
        values: '0+20x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="c",pod="p2"}
        values: '0+20x40'
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="c",result="success",pod="p3"}
        values: '0+20x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="c",result="success",pod="p3"}
        values: '0+20x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="success",pod="p3"}
        values: '0+20x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="c",pod="p3"}
        values: '0+100x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="c",pod="p3"}
        values: '0+100x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="c",pod="p3"}
        values: '0+20x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="c",pod="p3"}
        values: '0+20x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ZoneChecksFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              source_zone: a
              destination_zone: c
              namespace: default
            exp_annotations:
              description: >-
                The Zone Heatmap dashboard shows which protocol and direction fail; the console Matrix
                shows the node pairs.
              investigateUrl: /investigate?kind=zone-pair&scope=a->c
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#zonechecksfailing
              summary: Zone checks failing a -> c at 5.556% of probes
      - eval_time: 15m
        alertname: ZoneLossHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              source_zone: a
              destination_zone: c
              namespace: default
            exp_annotations:
              description: UDP and ICMP loss across all pairs between the zones; UDPLossHigh names a single broken pair.
              investigateUrl: /investigate?kind=zone-pair&scope=a->c
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#zonelosshigh
              summary: Packet loss a -> c at 13.89%

  # ── one pair of twenty UDP-blackholed: diluted below both defaults ──
  # 5 x 4 nodes: 50/1200 = 4.2% lost and 10/600 = 1.7% failed, so one link stays with UDPLossHigh.
  - interval: 30s
    input_series:
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="c",result="success",pod="p1"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="c",result="success",pod="p1"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="success",pod="p1"}
        values: '0+30x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="fail",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="c",pod="p1"}
        values: '0+200x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="c",pod="p1"}
        values: '0+150x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="c",pod="p1"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="c",pod="p1"}
        values: '0+40x40'
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="c",result="success",pod="p2"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="c",result="success",pod="p2"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="success",pod="p2"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="c",pod="p2"}
        values: '0+200x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="c",pod="p2"}
        values: '0+200x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="c",pod="p2"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="c",pod="p2"}
        values: '0+40x40'
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="c",result="success",pod="p3"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="c",result="success",pod="p3"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="success",pod="p3"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="c",pod="p3"}
        values: '0+200x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="c",pod="p3"}
        values: '0+200x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="c",pod="p3"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="c",pod="p3"}
        values: '0+40x40'
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="c",result="success",pod="p4"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="c",result="success",pod="p4"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="success",pod="p4"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="c",pod="p4"}
        values: '0+200x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="c",pod="p4"}
        values: '0+200x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="c",pod="p4"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="c",pod="p4"}
        values: '0+40x40'
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="c",result="success",pod="p5"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_results_total{source_zone="a",destination_zone="c",result="success",pod="p5"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="c",result="success",pod="p5"}
        values: '0+40x40'
      - series: kconmon_ng_zone_udp_packets_sent_total{source_zone="a",destination_zone="c",pod="p5"}
        values: '0+200x40'
      - series: kconmon_ng_zone_udp_packets_received_total{source_zone="a",destination_zone="c",pod="p5"}
        values: '0+200x40'
      - series: kconmon_ng_zone_icmp_packets_sent_total{source_zone="a",destination_zone="c",pod="p5"}
        values: '0+40x40'
      - series: kconmon_ng_zone_icmp_packets_received_total{source_zone="a",destination_zone="c",pod="p5"}
        values: '0+40x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ZoneChecksFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: ZoneLossHigh
        exp_alerts: []

  # ── one external agent must not mask one missing in-cluster agent ──
  # Three schedulable nodes, three registered agents, one of them external: only two in-cluster
  # agents are present, so exactly one is missing.
  - interval: 30s
    input_series:
      - series: kconmon_ng_controller_expected_agents{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '3x40'
      - series: kconmon_ng_controller_registered_agents{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '3x40'
      - series: kconmon_ng_controller_external_agents{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '1x40'
      - series: kconmon_ng_controller_leader{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: KconmonAgentsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: c1
              job: kconmon-ng-controller
              pod: ctrl-0
              namespace: default
            exp_annotations:
              description: >-
                Nodes without an agent are not probed at all. Check the agent DaemonSet: scheduling,
                crash loops, gRPC to the controller.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#kconmonagentsmissing
              summary: 1 kconmon-ng agent(s) missing

  # ── a controller image without the external-agents gauge must still fire ──
  # Same rule, no kconmon_ng_controller_external_agents series at all (a pre-2.4.0 controller):
  # the fallback must read the missing gauge as zero, not drop the whole expression.
  - interval: 30s
    input_series:
      - series: kconmon_ng_controller_expected_agents{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '3x40'
      - series: kconmon_ng_controller_registered_agents{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '2x40'
      - series: kconmon_ng_controller_leader{instance="c1",job="kconmon-ng-controller",pod="ctrl-0"}
        values: '1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: KconmonAgentsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: c1
              job: kconmon-ng-controller
              pod: ctrl-0
              namespace: default
            exp_annotations:
              description: >-
                Nodes without an agent are not probed at all. Check the agent DaemonSet: scheduling,
                crash loops, gRPC to the controller.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#kconmonagentsmissing
              summary: 1 kconmon-ng agent(s) missing

  # ── an external agent the SD endpoint lists but Prometheus cannot scrape ──
  # The labels are exactly what the controller's SD body attaches plus Prometheus' own job and
  # instance, so the annotations prove the rule reads the SD labels, not a ServiceMonitor's.
  - interval: 30s
    input_series:
      # yamllint disable-line rule:line-length
      - series: up{job="kconmon-ng-agent-external",instance="10.20.30.40:9091",node="edge-host-01",zone="external",external="true",agent_id="edge-host-01-edge-host-01"}
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: KconmonExternalAgentDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: kconmon-ng-agent-external
              instance: 10.20.30.40:9091
              node: edge-host-01
              zone: external
              external: "true"
              agent_id: edge-host-01-edge-host-01
              namespace: default
            exp_annotations:
              description: >-
                It still registers with the gateway, so the host is up: usually its firewall blocks
                the metrics port from the cluster's node CIDR.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#kconmonexternalagentdown
              summary: External kconmon-ng agent edge-host-01 is not answering scrapes

  # ── the same, under scrapeConfig.externalAgents.jobName=bare.hosts (render-and-test.sh) ──
  # The custom job lacks "agent-external"; the dot is matched literally, so bareXhosts stays quiet.
  - interval: 30s
    input_series:
      # yamllint disable-line rule:line-length
      - series: up{job="bare.hosts",instance="10.20.30.41:9091",node="edge-host-02",zone="external",external="true",agent_id="edge-host-02-edge-host-02"}
        values: '0x40'
      # yamllint disable-line rule:line-length
      - series: up{job="bareXhosts",instance="10.20.30.42:9091",node="edge-host-03",zone="external",external="true",agent_id="edge-host-03-edge-host-03"}
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: KconmonExternalAgentDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bare.hosts
              instance: 10.20.30.41:9091
              node: edge-host-02
              zone: external
              external: "true"
              agent_id: edge-host-02-edge-host-02
              namespace: default
            exp_annotations:
              description: >-
                It still registers with the gateway, so the host is up: usually its firewall blocks
                the metrics port from the cluster's node CIDR.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#kconmonexternalagentdown
              summary: External kconmon-ng agent edge-host-02 is not answering scrapes

  # ── MTU black hole n1 -> n2: full-size probes fail, 1400 bytes cross, TCP is fine ──
  - interval: 30s
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: '0+1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_bytes{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",pod="p1"}
        values: '1400x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_tcp_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0+10x40'
      # The zone family fails as well; with per-pair series present the pair rule names the nodes
      # and the zone rule stays quiet.
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ZonePathMTUBlackHole
        exp_alerts: []
      - eval_time: 15m
        alertname: PathMTUBlackHole
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              destination_node: n2
              source_zone: a
              destination_zone: b
              namespace: default
            exp_annotations:
              description: >-
                Larger packets are dropped without ICMP frag-needed, so big transfers stall while
                pings pass. Compare the MTU of the interfaces on n1 with the CNI overhead.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#pathmtublackhole
              summary: 'Path MTU black hole n1 -> n2: only packets up to 1400 bytes get through'
      - eval_time: 15m
        alertname: TCPChecksFailing
        exp_alerts: []

  # ── zone-only scrape: no per-pair series, full-size probes a -> b fail, TCP and UDP stay green ──
  - interval: 30s
    input_series:
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: '0+2x40'
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0x40'
      - series: kconmon_ng_zone_pmtu_results_total{source_zone="b",destination_zone="a",result="success",pod="p2"}
        values: '0+2x40'
      - series: kconmon_ng_zone_tcp_results_total{source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0+10x40'
      - series: kconmon_ng_zone_udp_results_total{source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ZonePathMTUBlackHole
        exp_alerts:
          - exp_labels:
              severity: warning
              source_zone: a
              destination_zone: b
              namespace: default
            exp_annotations:
              description: >-
                Large packets between the zones are dropped without ICMP frag-needed. The console
                Matrix shows which node pairs.
              investigateUrl: /investigate?kind=zone-pair&scope=a->b
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#zonepathmtublackhole
              summary: Path MTU black hole zone a -> zone b in 100% of probes
      - eval_time: 15m
        alertname: PathMTUBlackHole
        exp_alerts: []
      - eval_time: 15m
        alertname: ZoneChecksFailing
        exp_alerts: []

  # ── peer down: pmtu counters flat (unreachable writes nothing), the stale gauge must not fire ──
  - interval: 30s
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: '0x40'
      # yamllint disable-line rule:line-length
