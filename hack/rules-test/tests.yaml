        values: '0+1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_bytes{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",pod="p1"}
        values: '1400x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n3",source_zone="a",destination_zone="c",result="fail",pod="p1"}
        values: '0+1x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n3",source_zone="a",destination_zone="c",result="success",pod="p1"}
        values: '0x40'
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_bytes{source_node="n1",destination_node="n3",source_zone="a",destination_zone="c",pod="p1"}
        values: '1400x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: PathMTUBlackHole
        exp_alerts:
          - exp_labels:
              severity: warning
              source_node: n1
              destination_node: n3
              source_zone: a
              destination_zone: c
              namespace: default
            exp_annotations:
              description: >-
                Larger packets are dropped without ICMP frag-needed, so big transfers stall while
                pings pass. Compare the MTU of the interfaces on n1 with the CNI overhead.
              runbook_url: https://esdmitrii.github.io/kconmon-ng/reference/alerts/#pathmtublackhole
              summary: 'Path MTU black hole n1 -> n3: only packets up to 1400 bytes get through'

  # ── ECMP split, 3 paths: one probe in three hashes onto the black-holed next hop (1 probe/min) ──
  # ── the fail ratio sits at 1/3 and the gauge flips back to 1500 whenever the last probe crossed ──
  - interval: 1m
    input_series:
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="fail",pod="p1"}
        values: >-
          0x2 1x2 2x2 3x2 4x2 5x2 6x2 7x2 8x2 9x2 10x2 11x2 12x2 13x2 14x2 15x2 16x2 17x2 18x2 19x2 20
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_results_total{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",result="success",pod="p1"}
        values: >-
          0 1 2x1 3 4x1 5 6x1 7 8x1 9 10x1 11 12x1 13 14x1 15 16x1 17 18x1 19 20x1 21 22x1 23 24x1 25 26x1
          27 28x1 29 30x1 31 32x1 33 34x1 35 36x1 37 38x1 39 40x1
      # yamllint disable-line rule:line-length
      - series: kconmon_ng_pmtu_bytes{source_node="n1",destination_node="n2",source_zone="a",destination_zone="b",pod="p1"}
        values: >-
          1500x2 1400 1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400
          1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400
          1500x1 1400 1500x1 1400 1500x1 1400 1500x1 1400
    alert_rule_test:
      # The last probe (minute 32) crossed at full size: the alert still names the size that crossed
