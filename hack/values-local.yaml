---
# Two Secrets are created by hack/local-test.sh BEFORE `helm upgrade -i` and referenced BY NAME below.
controller:
  replicaCount: 1
  leaderElection: true
  # The controller's domain-event stream.
  events:
    enabled: true
  image:
    repository: kconmon-ng-controller
    tag: local
    pullPolicy: Never
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

agent:
  image:
    repository: kconmon-ng-agent
    tag: local
    pullPolicy: Never
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  tolerations:
    - operator: Exists
  securityContext:
    capabilities:
      add:
        - NET_RAW

config:
  metricsPrefix: kconmon_ng
  httpPort: 8080
  grpcPort: 9090
  logLevel: debug
  logFormat: json
  failureDomainLabel: topology.kubernetes.io/zone
  controllerAgentTtl: 30s
  checkers:
    tcp:
      enabled: true
      interval: 5s
      timeout: 1s
    udp:
      enabled: true
      interval: 5s
      timeout: 250ms
      packets: 5
    icmp:
      enabled: true
      interval: 5s
      timeout: 1s
    dns:
      enabled: true
      interval: 5s
      hosts:
        - kubernetes.default.svc.cluster.local
      resolvers: []
    http:
      enabled: true
      interval: 15s
      timeout: 5s
      targets:
        - url: https://kubernetes.default.svc.cluster.local/healthz
          method: GET
          expectStatus: 200
    mtr:
      cooldown: 60s
      maxHops: 30

serviceMonitor:
  enabled: true
  interval: 10s

prometheusRule:
  enabled: true

pdb:
  enabled: false

serviceAccount:
  create: true

console:
  enabled: true
  # ONE replica, and the chart enforces it: controller.events.enabled above gives the console a realtime ingester.
  replicas: 1
  image:
    repository: kconmon-ng-console
    tag: local
    pullPolicy: Never
  # That bar is admin — webhooks:manage and settings:write are admin-only.
  auth:
    mode: anonymous
    anonymous:
      role: admin
  # External database against hack/postgres-local.yaml.
  database:
    mode: external
    existingSecret: kconmon-local-postgres
    existingSecretKey: dsn
  # The release is named `monitoring` in the `monitoring` namespace.
  prometheus:
    url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  # Pod/Node event capture.
  kubernetesContext:
    enabled: true
  # PrometheusRule sync — the point of wiring a REAL kube-prometheus-stack into this stand rather than just the CRD.
  alerting:
    enabled: true
  # AES-256-GCM key sealing each webhook endpoint's HMAC secret at rest; created by the script from `openssl rand
  # -base64 32` and named here.
  webhooks:
    encryptionKeySecret:
      name: kconmon-local-webhooks-key
      key: encryptionKey
