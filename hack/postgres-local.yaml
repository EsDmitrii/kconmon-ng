---
# That is weight without a lesson: a plain postgres:// DSN drives the identical Go path (DatabaseConfig.ResolveDSN ->
# store.Open -> goose migrations -> sqlc queries).
apiVersion: v1
kind: Secret
metadata:
  name: kconmon-local-postgres
type: Opaque
stringData:
  # Key "dsn" is not the chart's database.existingSecretKey default (that is "console-database-dsn");
  # hack/values-local.yaml names it explicitly.
  dsn: postgres://kconmon:kconmon@kconmon-local-postgres:5432/kconmon?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kconmon-local-postgres
  labels:
    app: kconmon-local-postgres
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two postgres pods must never hold the same
  # data directory, and with an emptyDir there is nothing to hand over anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kconmon-local-postgres
  template:
    metadata:
      labels:
        app: kconmon-local-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: kconmon
            - name: POSTGRES_PASSWORD
              value: kconmon
            - name: POSTGRES_DB
              value: kconmon
            # A subdirectory, not the mount root: initdb refuses a data
            # directory that is not empty, and a fresh emptyDir mount can
            # still carry a lost+found on some drivers.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kconmon", "-d", "kconmon"]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kconmon", "-d", "kconmon"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kconmon-local-postgres
spec:
  selector:
    app: kconmon-local-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
