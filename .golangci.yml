---
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  build-tags:
    - e2e
    - integration

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - noctx
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    govet:
      enable:
        - shadow

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          disabled: true

    gosec:
      excludes:
        - G104
        - G304

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocritic

      - path: \.pb\.go
        linters:
          - all

      - path: internal/console/store/gen/
        linters:
          - all
