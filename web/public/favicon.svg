<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="kconmon-ng">
  <!--
    The sidebar's own mark, sized for a tab strip: the gradient dot the console
    wears next to its name, drawn large enough to read at 16px. Two nodes and the
    link between them, because that is what the product measures.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d9bfd" />
      <stop offset="1" stop-color="#a072e6" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0d1117" />
  <path d="M10.5 21.5 21.5 10.5" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" opacity="0.55" />
  <circle cx="10.5" cy="21.5" r="4.5" fill="url(#g)" />
  <circle cx="21.5" cy="10.5" r="4.5" fill="url(#g)" />
</svg>
