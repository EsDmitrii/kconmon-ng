---
apiVersion: v2
name: kconmon-ng
description: Kubernetes Node Connectivity Monitor - Next Generation
type: application
version: 2.5.1
appVersion: "2.5.1"
keywords:
  - kubernetes
  - connectivity
  - monitoring
  - network
maintainers:
  - name: Dmitrii Esin
    url: https://github.com/EsDmitrii
home: https://github.com/EsDmitrii/kconmon-ng
sources:
  - https://github.com/EsDmitrii/kconmon-ng

# NO dependencies, deliberately: the chart consumes PostgreSQL, a Redis-compatible bus and
# Prometheus, and installs none of them. Bring your own; the README carries the exact CNPG and
# valkey-helm setups this chart is tested against.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/EsDmitrii/kconmon-ng
    - name: Documentation
      url: https://esdmitrii.github.io/kconmon-ng/
    - name: Helm values reference
      url: https://esdmitrii.github.io/kconmon-ng/reference/helm-values/
    - name: Release notes
      url: https://esdmitrii.github.io/kconmon-ng/reference/release-notes/
  # artifacthub.io/changes is per version: list this release's changes only.
  artifacthub.io/changes: |
    - kind: changed
      description: >-
        Built-in alert descriptions shortened to what to check first; zones are no longer printed on
        node-pair alerts
    - kind: added
      description: >-
        runbook_url on every built-in alert, pointing at its section of the new Alert runbooks page
    - kind: added
      description: >-
        namespace label on every built-in alert, set to the release namespace
    - kind: fixed
      description: >-
        The console's notice for console.alerting.enabled=false no longer reads as if all alerting were
        off: the chart's rules keep alerting through Prometheus
