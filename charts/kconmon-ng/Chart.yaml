---
apiVersion: v2
name: kconmon-ng
description: Kubernetes Node Connectivity Monitor - Next Generation
type: application
version: 1.6.0
appVersion: "1.6.0"
keywords:
  - kubernetes
  - connectivity
  - monitoring
  - network
maintainers:
  - name: Dmitrii Esin
    url: https://github.com/EsDmitrii
home: https://github.com/EsDmitrii/kconmon-ng
sources:
  - https://github.com/EsDmitrii/kconmon-ng

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/EsDmitrii/kconmon-ng
    - name: Documentation
      url: https://github.com/EsDmitrii/kconmon-ng#readme
  artifacthub.io/changes: |
    - kind: added
      description: >-
        External targets, saved checks and schedules (M4) — CRUD /api/v1/targets|checks|schedules
        backed by PostgreSQL; requires console.database.mode=cnpg|external
    - kind: added
      description: >-
        Agent external checkers — config.checkers.external.enabled with a mandatory allowedCidrs
        allowlist (plus deniedCidrs, maxTargets, timeout); OFF by default
    - kind: added
      description: >-
        Continuous external checks — the controller streams per-agent assignments and the console
        reconciles them from continuous schedules on the scheduler's advisory lock
    - kind: added
      description: >-
        Console schedule loop and stuck-run reaper — console.scheduler.enabled (OFF by default),
        console.scheduler.tickInterval, PostgreSQL advisory lock for cross-replica singleton ticks
    - kind: added
      description: >-
        Console request rate limits — console.rateLimit.runsPerMinute and
        console.rateLimit.loginPerMinute; 0 disables a limit, and a Valkey outage fails OPEN
    - kind: added
      description: >-
        POST /api/v1/runs/{id}/cancel — cooperative cancellation of an in-flight diagnostics run
    - kind: added
      description: >-
        Hand-authored OpenAPI spec (docs/console-api.yaml) with generated TypeScript types and a
        test that walks the router so an undocumented route cannot land
    - kind: added
      description: >-
        kconmon_ng_external_* agent metrics, controller external-assignment gauges, the
        ExternalChecksFailing alert rule and an external-checks dashboard row
    - kind: added
      description: >-
        console-targets-values.yaml chart-test profile covering targets, scheduler and rate limits
    - kind: added
      description: >-
        Console persistence (M3) — console.database.mode=cnpg|external|disabled,
        PostgreSQL via CloudNativePG, event history, run history
    - kind: added
      description: >-
        Console authentication and RBAC (M3) — console.auth.mode=anonymous|local|header|oidc,
        built-in and custom roles, audit log, API tokens (PATs)
    - kind: added
      description: >-
        Diagnostics runner — on-demand run fan-out with persisted history, permalinks,
        and a live run:{id} WebSocket topic with REST-polling fallback
    - kind: added
      description: Object cards (Node, Pair) with a "Recent changes" event rail
    - kind: added
      description: NetworkPolicy opens console<->database (CNPG or external) and console->OIDC IdP on both sides
    - kind: added
      description: Console realtime (M2) — controller.events.enabled, console.valkey.mode, WebSocket /ws, Live page
    - kind: added
      description: Bundled ephemeral Valkey for cross-replica console fan-out (no PVC by design, ADR-002)
    - kind: added
      description: NetworkPolicy opens console->controller gRPC and console->Valkey on both sides
    - kind: added
      description: Optional Console web UI (console.enabled, off by default) — M0 foundation
    - kind: fixed
      description: ICMP checker sets net.ipv4.ping_group_range so ping sockets work on all runtimes
    - kind: added
      description: new agent.podSecurityContext value opens net.ipv4.ping_group_range for the ICMP checker
    - kind: fixed
      description: values.schema.json http target field expectedStatus -> expectStatus to match the checker
    - kind: added
      description: kubectl-kconmon plugin for on-demand topology and connectivity checks (install via krew)
    - kind: added
      description: On-demand diagnostics API — POST /api/v1/diagnostics runs a one-shot check (leader only)
    - kind: fixed
      description: Graceful agent deregistration on SIGTERM — peers drop a restarting pod at once, not after TTL
    - kind: security
      description: go1.26.4 toolchain plus grpc/x-net/otel bumps clear the previous CVE findings
    - kind: security
      description: govulncheck CI job and weekly Dependabot updates for gomod, github-actions and docker
