---
apiVersion: v2
name: kconmon-ng
description: Kubernetes Node Connectivity Monitor - Next Generation
type: application
version: 2.5.2
appVersion: "2.5.2"
keywords:
  - kubernetes
  - connectivity
  - monitoring
  - network
maintainers:
  - name: Dmitrii Esin
    url: https://github.com/EsDmitrii
home: https://github.com/EsDmitrii/kconmon-ng
sources:
  - https://github.com/EsDmitrii/kconmon-ng

# NO dependencies, deliberately: the chart consumes PostgreSQL, a Redis-compatible bus and
# Prometheus, and installs none of them. Bring your own; the README carries the exact CNPG and
# valkey-helm setups this chart is tested against.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/EsDmitrii/kconmon-ng
    - name: Documentation
      url: https://esdmitrii.github.io/kconmon-ng/
    - name: Helm values reference
      url: https://esdmitrii.github.io/kconmon-ng/reference/helm-values/
    - name: Release notes
      url: https://esdmitrii.github.io/kconmon-ng/reference/release-notes/
  # artifacthub.io/changes is per version: list this release's changes only.
  artifacthub.io/changes: |
    - kind: security
      description: >-
        Built with Go 1.27.3 and golang.org/x/net 0.60.0: fixes for HTTP/2, net/http, crypto/tls and
        html/template vulnerabilities reachable from the controller, the gateway and the console
    - kind: fixed
      description: >-
        KconmonAgentsMissing counts a cordoned node while its agent is registered, so that agent no
        longer hides one missing agent elsewhere
    - kind: fixed
      description: >-
        TCP total-duration histograms no longer record failed readiness requests, so timeouts stay out
        of the latency quantiles
    - kind: fixed
      description: >-
        The matrix names console.prometheus.maxResponseBytes when Prometheus answers with more than it,
        instead of saying Prometheus did not answer
    - kind: fixed
      description: >-
        Console alert rules can no longer take the name of one of the chart's built-in alerts
    - kind: changed
      description: >-
        helm test checks the controller on its metrics port; the NetworkPolicy no longer opens the HTTP
        API to the test pod's label
    - kind: changed
      description: >-
        PairWentSilent's summary counts the 5m rate window (about 15m with the default for); NOTES warn
        when networkPolicy is off
