---
apiVersion: v2
name: kconmon-ng
description: Kubernetes Node Connectivity Monitor - Next Generation
type: application
version: 2.1.0
appVersion: "2.0.3"
keywords:
  - kubernetes
  - connectivity
  - monitoring
  - network
maintainers:
  - name: Dmitrii Esin
    url: https://github.com/EsDmitrii
home: https://github.com/EsDmitrii/kconmon-ng
sources:
  - https://github.com/EsDmitrii/kconmon-ng

# NO dependencies, deliberately: the chart consumes PostgreSQL, a Redis-compatible bus and
# Prometheus, and installs none of them. Bring your own; the README carries the exact CNPG and
# valkey-helm setups this chart is tested against.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/EsDmitrii/kconmon-ng
    - name: Documentation
      url: https://github.com/EsDmitrii/kconmon-ng#readme
  # artifacthub.io/changes is PER VERSION: Artifact Hub renders it as the changelog OF the release it
  # is attached to, not as the project's history. It had accumulated every entry since 1.x, so an
  # operator evaluating 2.0.0 read that `prometheusRule.rules` was "DEPRECATED but still honoured ...
  # so existing installs are unaffected" and that the chart shipped optional CNPG and Valkey
  # subcharts — statements 2.0.0 contradicts, and the first of them describes a key it now rejects
  # outright. What follows is 2.1.0 and nothing else.
  artifacthub.io/changes: |
    - kind: added
      description: >-
        agent.updateStrategy is a value (default unchanged: RollingUpdate with maxUnavailable 1).
        The old hardcode meant a fleet-wide DaemonSet rollout moved one node at a time; hundreds of
        nodes now get to choose their own pace
    - kind: added
      description: >-
        agent.priorityClassName, controller.priorityClassName and console.priorityClassName (empty
        default renders nothing). An agent at priority 0 is evicted first on exactly the node whose
        degradation it was measuring
    - kind: fixed
      description: >-
        The helm-test pod now carries the restricted-PSS securityContext fields; `helm test` used to
        be rejected at admission on the hardened installs the chart itself targets
