---
apiVersion: v2
name: kconmon-ng
description: Kubernetes Node Connectivity Monitor - Next Generation
type: application
version: 2.5.0
appVersion: "2.5.0"
keywords:
  - kubernetes
  - connectivity
  - monitoring
  - network
maintainers:
  - name: Dmitrii Esin
    url: https://github.com/EsDmitrii
home: https://github.com/EsDmitrii/kconmon-ng
sources:
  - https://github.com/EsDmitrii/kconmon-ng

# NO dependencies, deliberately: the chart consumes PostgreSQL, a Redis-compatible bus and
# Prometheus, and installs none of them. Bring your own; the README carries the exact CNPG and
# valkey-helm setups this chart is tested against.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/EsDmitrii/kconmon-ng
    - name: Documentation
      url: https://esdmitrii.github.io/kconmon-ng/
    - name: Helm values reference
      url: https://esdmitrii.github.io/kconmon-ng/reference/helm-values/
    - name: Release notes
      url: https://esdmitrii.github.io/kconmon-ng/reference/release-notes/
  # artifacthub.io/changes is PER VERSION: Artifact Hub renders it as the changelog OF the release it
  # is attached to, not as the project's history. It had accumulated every entry since 1.x, so an
  # operator evaluating 2.0.0 read that `prometheusRule.rules` was "DEPRECATED but still honoured ...
  # so existing installs are unaffected" and that the chart shipped optional CNPG and Valkey
  # subcharts — statements 2.0.0 contradicts, and the first of them describes a key it now rejects
  # outright. What follows is 2.5.0 and nothing else.
  artifacthub.io/changes: |
    - kind: added
      description: >-
        Path MTU probe, on by default: once a minute every agent sends each peer a small and a
        full-size UDP datagram with DF set to its echo port and bisects on loss. A pair reads ok,
        reduced (the path says so with ICMP frag-needed) or a black hole (full-size datagrams
        vanish). New kconmon_ng_pmtu_bytes, kconmon_ng_pmtu_results_total,
        kconmon_ng_zone_pmtu_results_total and kconmon_ng_agent_pmtu_probe_bytes, and the
        PathMTUBlackHole rule (prometheusRule.pathMtuBlackHole, warning). config.checkers.pmtu.*
        reaches the ConfigMap only when tuned, so 2.4.x agents keep running under this chart
    - kind: added
      description: >-
        NodeUnreachable and NodeIsolated node-level rules (prometheusRule.nodeUnreachable,
        .nodeIsolated; critical, minPeers 2): most peers failing to reach a node, or a node
        failing to reach most peers, pages once for the node instead of once per pair
    - kind: added
      description: >-
        Path MTU panels on the Overview (black-hole pairs, reduced paths, pairs below their probe
        size) and Node Detail (path MTU to each peer, black-hole probes by peer) dashboards
    - kind: added
      description: >-
        Console PMTU protocol: matrix, Overview, node and pair pages, on-demand pmtu checks with
        the verdict, path MTU and datagrams per pair; kubectl kconmon check --type pmtu
    - kind: added
      description: >-
        Console local user management in auth.mode=local (users:manage, admin only): add, change
        role, reset password, disable; and a self-service password change. A change or a reset
        signs the user out of every other session
    - kind: changed
      description: >-
        Console maintenance windows hold the console's own alert webhooks: an alert that starts
        firing inside a matching window is not delivered, and is delivered when the window closes
        on it still firing
    - kind: changed
      description: >-
        Console node page health covers the pairs into the node as well as out of it, and its
        breakdown switches between paths to and from peers; diagnostic runs list failed pairs first
    - kind: changed
      description: >-
        Console pages load on demand: the initial JavaScript drops from 935 kB to 198 kB gzipped,
        and charts load only the ECharts parts they draw with
    - kind: changed
      description: >-
        Images build with Go 1.27 on distroless static-debian13; the console UI with Vite 8
    - kind: fixed
      description: >-
        Config hot reload watched the file instead of its directory, so the first atomic
        replacement (an editor's save, an ansible or puppet file resource, the kubelet's
        ConfigMap swap) silently ended it
    - kind: fixed
      description: >-
        Console Overview tiered pairs by failure ratio alone, so a UDP or ICMP pair the matrix
        painted red for packet loss read healthy there
    - kind: fixed
      description: >-
        Console on PostgreSQL 18: deleting a target a check definition still references failed
        with a store error instead of 409 target in use
