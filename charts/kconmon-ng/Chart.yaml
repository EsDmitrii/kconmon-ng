---
apiVersion: v2
name: kconmon-ng
description: Kubernetes Node Connectivity Monitor - Next Generation
type: application
version: 2.2.0
appVersion: "2.2.0"
keywords:
  - kubernetes
  - connectivity
  - monitoring
  - network
maintainers:
  - name: Dmitrii Esin
    url: https://github.com/EsDmitrii
home: https://github.com/EsDmitrii/kconmon-ng
sources:
  - https://github.com/EsDmitrii/kconmon-ng

# NO dependencies, deliberately: the chart consumes PostgreSQL, a Redis-compatible bus and
# Prometheus, and installs none of them. Bring your own; the README carries the exact CNPG and
# valkey-helm setups this chart is tested against.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/EsDmitrii/kconmon-ng
    - name: Documentation
      url: https://github.com/EsDmitrii/kconmon-ng#readme
  # artifacthub.io/changes is PER VERSION: Artifact Hub renders it as the changelog OF the release it
  # is attached to, not as the project's history. It had accumulated every entry since 1.x, so an
  # operator evaluating 2.0.0 read that `prometheusRule.rules` was "DEPRECATED but still honoured ...
  # so existing installs are unaffected" and that the chart shipped optional CNPG and Valkey
  # subcharts — statements 2.0.0 contradicts, and the first of them describes a key it now rejects
  # outright. What follows is 2.2.0 and nothing else.
  artifacthub.io/changes: |
    - kind: added
      description: >-
        ZoneChecksFailing and ZoneLossHigh alerts on the zone-level metric family
        (kconmon_ng_zone_*), with the same per-rule toggles as the pair alerts. The family is
        exported by agents newer than appVersion 2.0.3; on older agents both rules are silently
        inert
    - kind: added
      description: >-
        agent.metrics.detail scrape-time cardinality valve (full | counters-only | zone-only),
        rendered as metricRelabelings on the agent ServiceMonitor. At 100 nodes the full mesh is
        ~0.7M series; counters-only keeps ~0.1M, zone-only keeps only the zone family plus the
        linear DNS/HTTP/external families
    - kind: added
      description: >-
        controller.externalGateway values block exposing the controller's TLS + bootstrap-token
        gRPC gateway for agents outside the cluster: a NodePort/LoadBalancer Service carrying the
        gateway port alone (never the plaintext in-cluster gRPC port), read-only mounts for the
        referenced TLS and token Secrets, and NetworkPolicy ingress from
        networkPolicy.externalAgentCidrs. Off by default; enabling it needs a controller image
        newer than appVersion 2.0.3, and rotating the Secrets needs a controller restart
    - kind: changed
      description: >-
        The Zone Heatmap dashboard reads the zone family instead of aggregating per-pair series,
        so it keeps working in every agent.metrics.detail mode; it renders empty until the agents
        run an image that exports the family
