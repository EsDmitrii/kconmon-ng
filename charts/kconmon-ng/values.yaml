---
# kconmon-ng default values. Sections in order:
#   1 Naming  2 Shared config  3 Agent  4 Controller  5 Console
#   6 Observability  7 Kubernetes  8 Optional dependencies
# Reasoning, migration notes and examples live in README.md.

# == 1. Naming ==

# Overrides the chart name used in resource names and labels.
nameOverride: ""
# Overrides the full resource-name prefix outright.
fullnameOverride: ""

# == 2. Shared config == runtime config for controller and agents, hot-reloaded from a ConfigMap.

config:
  # Prefix for every exported metric; changing it renames all of them.
  metricsPrefix: kconmon_ng
  # Serves /metrics and health; must differ from grpcPort.
  httpPort: 8080
  # Controller peer-list/topology API; must differ from httpPort.
  grpcPort: 9090
  # debug | info | warn | error.
  logLevel: info
  # json | text.
  logFormat: json
  # Node label the controller reads for each agent's zone.
  failureDomainLabel: topology.kubernetes.io/zone
  # Grace period before an agent without a heartbeat leaves the peer list.
  controllerAgentTtl: 30s
  # Per-protocol checkers; for an enabled one, interval and timeout must be > 0.
  checkers:
    # TCP dial to a peer's port (L4 reachability).
    tcp:
      enabled: true
      interval: 5s
      timeout: 1s
    # UDP probe measuring packet loss to a peer.
    udp:
      enabled: true
      interval: 5s
      timeout: 250ms
      # Packets per probe, used to compute the loss ratio; must be >= 1.
      packets: 5
    # ICMP ping reachability/loss; needs the agent NET_RAW capability.
    icmp:
      enabled: true
      interval: 5s
      timeout: 1s
    # DNS resolution check.
    dns:
      enabled: true
      interval: 5s
      timeout: 5s
      # Names to resolve; must be non-empty when the checker is enabled.
      hosts:
        - kubernetes.default.svc.cluster.local
      # Explicit resolvers as "host" or "host:port"; empty uses the Pod's own.
      resolvers: []
    # HTTP endpoint check; targets are required when enabled.
    http:
      enabled: false
      interval: 30s
      timeout: 5s
      # [{url, method, expectStatus, bodyPattern}]
      targets: []
    # Reactive traceroute fired on probe failures.
    mtr:
      # Minimum gap between MTR runs for the same pair.
      cooldown: 60s
      # Maximum traceroute hops; 1-64.
      maxHops: 30
    # Probes to destinations that are not peer agents.
    external:
      # Off means the block is not parsed and no external probe can run.
      enabled: false
      # CIDR allowlist matched against the resolved address; required when enabled.
      allowedCidrs: []
      # Carve-outs subtracted from allowedCidrs; denied wins.
      deniedCidrs: []
      # Cap on operator-defined external targets per agent.
      maxTargets: 100
      # Bounds resolve-and-authorise only, not the probe itself.
      timeout: 10s

# == 3. Agent == DaemonSet running the enabled checkers against peers on every node.

agent:
  # Explicit zone override; empty lets the controller resolve it from the node.
  zone: ""
  podAnnotations: {}
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-agent
    # Empty means the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # Default runs an agent on every node, including tainted ones.
  tolerations:
    - operator: Exists
  # NET_RAW is required by the ICMP checker and reactive MTR traces; everything else is dropped.
  # This is the one workload the restricted PSS profile cannot admit as-is (documented in README).
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
      add:
        - NET_RAW
  # Opens ping_group_range so ICMP ping sockets work; set {} to opt out.
  podSecurityContext:
    sysctls:
      - name: net.ipv4.ping_group_range
        value: "0 2147483647"
  nodeSelector: {}
  affinity: {}

# == 4. Controller == Deployment serving peer lists over gRPC and watching nodes as leader.

controller:
  # Controller replicas; only the leader is active, extras are HA standby.
  replicaCount: 1
  # Leader election; false also disables zone enrichment and expected_agents.
  leaderElection: true
  events:
    # Domain event stream for the Console's realtime ingester (leader-only).
    enabled: false
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-controller
    # Empty means the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # restricted-PSS compliant; the controller only talks to the apiserver and gRPC.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # The controller is not on the data path, so defaults are small.
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# == 5. Console == optional web UI and API; every block below is inert while enabled is false.

console:
  # -- 5.1 core --
  enabled: false
  # Console replicas; the console is stateless.
  replicas: 2
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-console
    # Empty means the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Controller API access.
  controller:
    # Empty derives from this release's controller Service.
    url: ""
    timeout: 10s
    # EventStream host:port; empty derives it when controller.events.enabled.
    grpcAddress: ""
    # DEPRECATED, renamed to grpcAddress; still honoured when set alone.
    grpcAddr: ""
  # Prometheus query API; required by the data pages, which 503 without it.
  prometheus:
    url: ""
    queryTimeout: 30s
    # Largest query_range window the guarded proxy accepts.
    maxRange: 24h
    # Response size cap in bytes.
    maxResponseBytes: 8388608

  # -- 5.2 database -- PostgreSQL for durable Console state (ADR-001).
  database:
    # cnpg (renders a CNPG Cluster, operator CRDs must exist) | external | disabled.
    mode: disabled
    maxConns: 10
    connectTimeout: 10s
    # Run the embedded goose migrations at startup.
    migrateOnStart: true
    # Daily prune of rows older than this; 0 keeps everything.
    retentionDays: 90
    # mode=external: Secret holding a full postgres:// DSN, read once at boot.
    existingSecret: ""
    # Key inside that Secret; the chart-managed path writes this same key.
    existingSecretKey: console-database-dsn
    # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
    secret:
      create: false
      # Empty derives the name from the release name.
      name: ""
      annotations: {}
      labels: {}
      # Full postgres:// DSN; required when create is true.
      dsn: ""
    # mode=cnpg only: the Cluster CR this chart renders (the OPERATOR is section 8).
    cnpg:
      instances: 2
      imageName: ""            # empty = CNPG operator default
      storage:
        size: 10Gi
        storageClass: ""
      resources: {}
      # ScheduledBackup; needs a configured S3-compatible barmanObjectStore.
      backup:
        enabled: false
        schedule: "0 0 2 * * *"
        destinationPath: ""
        endpointURL: ""
        # Existing Secret with the object-store credentials.
        existingSecret: ""
        # DEPRECATED, renamed to existingSecret; still honoured when set alone.
        credentialsSecret: ""
        # Chart-managed alternative; CNPG fixes the two key names it reads.
        secret:
          create: false
          # Empty derives the name from the release name.
          name: ""
          annotations: {}
          labels: {}
          # Written as ACCESS_KEY_ID; required when create is true.
          accessKeyId: ""
          # Written as ACCESS_SECRET_KEY; required when create is true.
          secretAccessKey: ""

  # -- 5.3 auth -- SECURITY.md 10.1.
  auth:
    # anonymous | local | header | oidc.
    mode: anonymous
    # Role for an authenticated subject no binding matches; empty means none.
    defaultRole: ""
    anonymous:
      # Fixed role for every anonymous request.
      role: viewer
    # mode=local; requires console.database.mode=cnpg|external.
    local:
      # Created on first start only, while the users table is empty.
      bootstrapAdmin: ""
      # Existing Secret holding the bootstrap password.
      existingSecret: ""
      # Key inside that Secret; the chart-managed path writes this same key.
      existingSecretKey: console-local-admin-password
      # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
      secret:
        create: false
        # Empty derives the name from the release name.
        name: ""
        annotations: {}
        labels: {}
        # Bootstrap admin password; required when create is true.
        password: ""
    # mode=header: identity from a trusted in-cluster reverse proxy.
    header:
      userHeader: X-Remote-User
      groupsHeader: X-Remote-Groups
      groupsDelimiter: ","
      # Required and non-empty for mode=header, else headers are an auth bypass.
      trustedProxyCIDRs: []
    # mode=oidc; requires a database, and Valkey for replicas > 1.
    oidc:
      issuer: ""
      clientID: ""
      redirectURL: ""
      scopes: [openid, profile, email, groups]
      usernameClaim: preferred_username
      groupsClaim: groups
      # Existing Secret holding the OIDC client secret.
      existingSecret: ""
      # Key inside that Secret; the chart-managed path writes this same key.
      existingSecretKey: console-oidc-client-secret
      # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
      secret:
        create: false
        # Empty derives the name from the release name.
        name: ""
        annotations: {}
        labels: {}
        # OIDC client secret; required when create is true.
        clientSecret: ""
    # Session cookie for every non-anonymous mode.
    session:
      ttl: 12h
      cookieName: __Host-kconmon_session
      # A __Host- cookie with secure=false is rejected at startup.
      secure: true

  # -- 5.4 valkey -- pub/sub for cross-replica WebSocket fan-out (ADR-002).
  valkey:
    # bundled (ephemeral, no PVC) | dependency (section 8 subchart) | external | disabled (in-process, replicas=1).
    mode: disabled
    # host:port; required for mode=external.
    address: ""
    dialTimeout: 5s
    # Password for a Valkey that requires AUTH (the norm for managed and for the subchart).
    # Empty means no AUTH, which is what the unauthenticated bundled Valkey wants.
    existingSecret: ""
    # Key inside that Secret; the chart-managed path writes this same key.
    existingSecretKey: console-valkey-password
    # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
    secret:
      create: false
      # Empty derives the name from the release name.
      name: ""
      annotations: {}
      labels: {}
      # Valkey password; required when create is true.
      password: ""
    # Port the bundled Valkey listens on.
    port: 6379
    # Bundled-only.
    image:
      repository: valkey/valkey
      tag: 9-alpine
      pullPolicy: IfNotPresent
    # Bundled-only.
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    # Bundled-only; restricted-PSS compliant.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL

  # -- 5.5 webhooks -- endpoints themselves are database rows, not values.
  webhooks:
    # Existing Secret with the AES-256-GCM key (base64 of 32 bytes) that
    # encrypts endpoint signing secrets; empty leaves create and test at 503.
    existingSecret: ""
    # Key inside that Secret; the chart-managed path writes this same key.
    existingSecretKey: console-webhooks-encryption-key
    # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
    secret:
      create: false
      # Empty derives the name from the release name.
      name: ""
      annotations: {}
      labels: {}
      # base64 of 32 random bytes (openssl rand -base64 32); required when create is true.
      encryptionKey: ""
    # Alert-transition poll cadence, and the resolution granularity of every
    # alert.resolved delivery; emitted only with webhooks and alerting both on.
    alertPollInterval: 30s
    # DEPRECATED, renamed to webhooks.existingSecret/existingSecretKey.
    encryptionKeySecret:
      name: ""
      key: null

  # -- 5.6 alerting -- Console-managed Prometheus alert rules, reconciled into one PrometheusRule.
  alerting:
    # Off by default: enabling it lets the console write a cluster object.
    enabled: false
    # Namespace the object is applied into; empty means this release's.
    namespace: ""
    # Reconcile cadence, jittered 20%; must be > 0 when enabled.
    syncInterval: 60s
    # Name of the one owned PrometheusRule; changing it orphans the previous.
    bundleName: kconmon-ng-console-rules

  # -- 5.7 optional console features --
  # Advisory-locked tick firing due schedules and reconciling external checks.
  scheduler:
    # Off by default so an upgrade never starts dispatching fleet traffic.
    enabled: false
    # Poll cadence; must be > 0 when enabled.
    tickInterval: 5s
  # Reverse DNS and MaxMind enrichment of stored MTR hop addresses.
  mtr:
    enrichment:
      # Off by default: rdns is an egress footprint.
      enabled: false
      # rdns and geoip gate independently; all sources off is a startup error.
      rdns:
        enabled: false
        # Bounds one lookup, in milliseconds.
        timeoutMs: 500
      # MaxMind GeoLite2 databases, served from the fixed /geoip mount.
      geoip:
        # auto (geoipupdate sidecar keeps them fresh) | volume (you supply them) | disabled.
        # Empty derives it: a volume or a path you set means volume, otherwise disabled.
        mode: ""
        # Editions the sidecar downloads; also what the default paths are derived from.
        editions:
          - GeoLite2-ASN
          - GeoLite2-City
        # geoipupdate's own unit: hours between downloads.
        updateIntervalHours: 24
        # How often the console re-reads changed files; 0 never reloads (restart required).
        reloadInterval: 1h
        image:
          repository: ghcr.io/maxmind/geoipupdate
          tag: v7.1.1
          pullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        # Sidecar container securityContext; it writes into the shared /geoip emptyDir.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        # mode=auto: MaxMind credentials (a free GeoLite2 account issues them).
        existingSecret: ""
        # Keys inside that Secret; the chart-managed path writes these same keys.
        accountIdKey: console-maxmind-account-id
        licenseKeyKey: console-maxmind-license-key
        # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
        secret:
          create: false
          # Empty derives the name from the release name.
          name: ""
          annotations: {}
          labels: {}
          # MaxMind account ID; required when create is true.
          accountId: ""
          # MaxMind license key; required when create is true.
          licenseKey: ""
        # mode=volume (airgapped): opaque VolumeSource mounted read-only at /geoip.
        volume: {}
        # Override only if your files are not named after their edition IDs.
        asnPath: ""
        cityPath: ""
      # Cache row lifetime in PostgreSQL; must be > 0 when enabled.
      ttl: 24h
  # Kubernetes event capture into the Investigate timeline.
  kubernetesContext:
    # Off by default: enabling it adds apiserver egress and an RBAC grant.
    enabled: false
    # The one namespace whose pod events are captured; empty means this release's.
    namespace: ""
    # Periodic relist backstop against a silently wedged watch.
    resyncInterval: 10m
  # Fixed-window request limits; 0 disables one, a negative value fails startup.
  rateLimit:
    # POST /api/v1/runs per subject per minute.
    runsPerMinute: 10
    # POST /api/v1/auth/login per username and per source IP per minute.
    loginPerMinute: 5

  # -- 5.8 console workload plumbing --
  # fsGroup lets the nonroot console read the root-owned Secret files.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # restricted-PSS compliant.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Console NetworkPolicy rules; a host firewall on the destination is a
  # separate layer this chart cannot open.
  networkPolicy:
    # Empty renders a default allowing TCP 9090 to any namespace.
    prometheusEgress: []
    # Empty renders a default for mode=external; ignored for mode=bundled.
    valkeyEgress: []
    # Empty renders a default allowing TCP 5432; ignored for mode=cnpg.
    databaseEgress: []
    # Empty renders a default allowing TCP 443 to any namespace.
    oidcEgress: []
    # Empty renders a default allowing TCP 443/6443 to 0.0.0.0/0.
    kubeAPIEgress: []
    # Empty renders a default allowing TCP 443 to 0.0.0.0/0 for the geoipupdate sidecar.
    geoipEgress: []
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # [{host: console.example.com, paths: [{path: /, pathType: Prefix}]}]
    hosts: []
    # [{secretName: console-tls, hosts: [console.example.com]}]
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Rendered only when console.enabled and replicas > 1.
  pdb:
    enabled: true
    minAvailable: 1

# == 6. Observability == objects for a Prometheus Operator you already run; this chart installs none.

# Ships dashboards/*.json as ConfigMaps for the Grafana sidecar to pick up.
dashboards:
  enabled: false
  # Empty renders into the release namespace; set it where your Grafana sidecar watches.
  namespace: ""
  # Label the Grafana sidecar selects on, and its value.
  label: grafana_dashboard
  labelValue: "1"
  # Grafana folder the sidecar files them under; empty leaves it at the sidecar default.
  folder: kconmon-ng
  extraLabels: {}
  annotations: {}

# ServiceMonitor for /metrics; needs the operator CRDs.
serviceMonitor:
  enabled: false
  interval: 15s

# PrometheusRule with the built-in alerts; rule text lives in templates/_rules.tpl, tuning here.
prometheusRule:
  enabled: false
  # UDP loss ratio above threshold on a pair.
  udpLossHigh:
    enabled: true
    # Loss ratio, 0.0-1.0.
    threshold: 0.5
    for: 5m
    severity: warning
  # TCP failure ratio (rate(fail)/rate(all)) above threshold on a pair.
  tcpChecksFailing:
    enabled: true
    # Failure ratio, 0.0-1.0.
    threshold: 0.05
    for: 5m
    severity: warning
  # A pair probed within the last hour that now reports nothing.
  pairWentSilent:
    enabled: true
    for: 10m
    severity: warning
  # DNS failure ratio above threshold per host/resolver.
  dnsChecksFailing:
    enabled: true
    # Failure ratio, 0.0-1.0.
    threshold: 0.05
    for: 5m
    severity: warning
  # External-target failure ratio above threshold; looser, it leaves the cluster.
  externalChecksFailing:
    enabled: true
    # Failure ratio, 0.0-1.0.
    threshold: 0.1
    for: 5m
    severity: warning
  # Registered agents below the schedulable-node count; needs leaderElection.
  kconmonAgentsMissing:
    enabled: true
    for: 10m
    severity: warning
  # No controller reports itself leader; needs leaderElection.
  kconmonControllerDown:
    enabled: true
    for: 5m
    severity: critical
  # Extra rules appended verbatim; write metric names with your own prefix.
  additionalRules: []
  # DEPRECATED (pre-1.12 shape): a non-empty list replaces every built-in above.
  rules: []

# == 7. Kubernetes == identity, network and disruption plumbing.

# ServiceAccount for the agent and controller.
serviceAccount:
  # False binds the pods to an existing ServiceAccount instead of creating one.
  create: true
  # Empty generates the name from the release name; required when create is false.
  name: ""

# ClusterRole/Role and their bindings; they bind to the resolved ServiceAccount
# name whether or not this chart created it. False means you manage RBAC.
rbac:
  create: true

# NetworkPolicy for agent/controller traffic; enable only if the cluster enforces policies.
networkPolicy:
  enabled: false
  # Namespace Prometheus scrapes from; empty allows any namespace.
  prometheusNamespace: ""
  # Empty renders a default allowing TCP 443/6443 to 0.0.0.0/0 for the apiserver.
  kubeAPIEgress: []
  # Empty renders TCP 80/443 + ICMP to 0.0.0.0/0 when the external checker is on.
  externalEgress: []
  # Empty renders TCP 80/443 to 0.0.0.0/0 when the HTTP checker is on.
  httpEgress: []
  # Egress to DNS resolvers outside the cluster (config.checkers.dns.resolvers).
  resolverEgress: []

# PodDisruptionBudget for the controller Deployment.
pdb:
  # With replicaCount 1 this blocks voluntary eviction of the sole controller.
  enabled: true
  minAvailable: 1

# == 8. Optional dependencies == subcharts for the product's OWN stack, both off by default.
# Helm keys subchart values by the dependency ALIAS, so these are top-level
# blocks and everything under them passes through verbatim. See README.

# CloudNativePG OPERATOR; false assumes it is already installed (the Cluster CR is 5.2).
cnpg-operator:
  enabled: false

# Valkey subchart, consumed by console.valkey.mode=dependency; read the image caveat in README.
valkey:
  enabled: false
