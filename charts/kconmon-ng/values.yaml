---
# kconmon-ng default values.
#
# The chart installs the MONITOR — agent, controller, console — and nothing else. PostgreSQL, a
# Redis-compatible bus and Prometheus are yours to run however you already run infrastructure; each
# is configured here by one DSN or URL. See the chart README for the stack it is tested against.
#
# Sections:
#   1 Naming          6 Controller
#   2 Shared config   7 Console
#   3 Database        8 Observability
#   4 Redis           9 Kubernetes
#   5 Agent

# == 1. Naming ==

# Overrides the chart name used in resource names and labels.
nameOverride: ""
# Overrides the full resource-name prefix outright.
fullnameOverride: ""

# == 2. Shared config == runtime config for controller and agents, hot-reloaded from a ConfigMap.

config:
  # Prefix for every exported metric; changing it renames all of them.
  metricsPrefix: kconmon_ng
  # Serves /metrics and health; must differ from grpcPort.
  httpPort: 8080
  # Controller peer-list/topology API; must differ from httpPort.
  grpcPort: 9090
  # /metrics and the health endpoints, on a listener of their OWN. The controller's API shares
  # httpPort and authenticates nothing, so this is the port the scrape NetworkPolicy opens — letting
  # a scraper in must not mean letting its whole namespace drive the fleet.
  metricsPort: 9091
  # debug | info | warn | error.
  logLevel: info
  # json | text.
  logFormat: json
  # Node label the controller reads for each agent's zone.
  failureDomainLabel: topology.kubernetes.io/zone
  # Grace period before an agent without a heartbeat leaves the peer list; at least 10s (two
  # heartbeats). Never 0 — the controller refuses a non-positive TTL.
  controllerAgentTtl: 30s
  # Per-protocol checkers; for an enabled one, interval and timeout must be > 0.
  checkers:
    # TCP dial to a peer's port (L4 reachability).
    tcp:
      enabled: true
      interval: 5s
      timeout: 1s
    # UDP probe measuring packet loss to a peer.
    udp:
      enabled: true
      interval: 5s
      timeout: 250ms
      # Packets per probe, used to compute the loss ratio; must be >= 1.
      packets: 5
    # ICMP ping reachability/loss; runs on the unprivileged ICMP socket
    # agent.podSecurityContext opens, no added capability.
    icmp:
      enabled: true
      interval: 5s
      timeout: 1s
    # DNS resolution check.
    dns:
      enabled: true
      interval: 5s
      timeout: 5s
      # Names to resolve; must be non-empty when the checker is enabled.
      hosts:
        - kubernetes.default.svc.cluster.local
      # Explicit resolvers as "host" or "host:port"; empty uses the Pod's own.
      resolvers: []
    # HTTP endpoint check; targets are required when enabled.
    http:
      enabled: false
      interval: 30s
      timeout: 5s
      # [{url, method, expectStatus, bodyPattern}]
      targets: []
    # Reactive traceroute fired on probe failures.
    mtr:
      # Minimum gap between MTR runs for the same pair.
      cooldown: 60s
      # Maximum traceroute hops; 1-64.
      maxHops: 30
    # Probes to destinations that are not peer agents.
    external:
      # Off means the block is not parsed and no external probe can run.
      enabled: false
      # CIDR allowlist matched against the resolved address;
      # keep it in step with networkPolicy.externalEgress,
      # and the console refuses a target outside it.
      allowedCidrs: []
      # Carve-outs subtracted from allowedCidrs; denied wins.
      deniedCidrs: []
      # Cap on operator-defined external targets per agent.
      maxTargets: 100
      # Bounds resolve-and-authorise only, not the probe itself.
      timeout: 10s

# Probe topology plan, part of the same shared config (rendered into the shared ConfigMap, read by
# the controller's leader). full is today's behaviour: every agent probes every peer, N*(N-1)
# directed pairs. sparse trims that to a ring over sorted node names plus cross-zone chords —
# connectivity and zone-pair coverage hold (property-tested), while pairs and their metric series
# scale ~linearly with N instead of quadratically. Under sparse, pairs the plan drops STOP being
# probed: the console matrix marks them unplanned, and PairWentSilent only fires for pairs present
# in <prefix>_probe_intended, which agents export from this release. Version skew: the key is
# emitted only when mode=sparse, because a pre-2.3.0 controller image rejects it and crashloops —
# upgrade the images first, flip the mode second.
topology:
  # full | sparse.
  mode: full
  # Read only when mode=sparse.
  sparse:
    # Ring successors per node over the sorted node-name circle; the ring is what guarantees the
    # plan stays connected.
    ringDegree: 2
    # Cross-zone chords per (source zone, destination zone) pair, chosen by HRW hashing; they keep
    # every directed zone pair measured so the zone metric family stays fully populated.
    zoneChords: 2
    # Fleets SMALLER than this many nodes get the full mesh regardless of mode; 0 means no such
    # floor. Sparse only pays for itself at scale, and a small fleet is better off measured whole.
    autoThreshold: 0

# == 3. Database == PostgreSQL the Console stores history, users and the audit log in.
# BRING YOUR OWN server — CNPG, Percona, RDS, plain postgres, anything that speaks a postgres:// DSN;
# the chart installs nothing and only needs the Secret holding that DSN. Nothing configured means an
# in-memory console: no history, no incidents, no local/oidc auth. Tested stack: CloudNativePG — see
# the chart README for the exact Cluster I test with.

database:
  # Secret holding a full postgres:// DSN; setting it is what enables the database.
  existingSecret: ""
  # Key inside that Secret; the chart-managed path writes this same key.
  existingSecretKey: console-database-dsn
  # Chart-managed alternative to existingSecret; prefer it for an injector's ${vault:...}
  # placeholders rather than for literals.
  secret:
    create: false
    # Empty derives the name from the release name.
    name: ""
    annotations: {}
    labels: {}
    dsn: ""
  maxConns: 10
  connectTimeout: 10s
  # Run the embedded goose migrations at startup.
  migrateOnStart: true
  # Daily prune of rows older than this; 0 keeps everything.
  retentionDays: 90

# == 4. Redis == the Console's session store, rate-limit counters and cross-replica pub/sub.
# BRING YOUR OWN Redis-compatible server — Valkey, Redis, sentinel-fronted, ElastiCache; the chart
# installs nothing and only needs an address. Empty means the in-process bus, and then
# console.replicas must be 1 — the chart ENFORCES that now rather than only saying it: the fan-out,
# the sessions and the fixed-window rate-limit counters all live in this server, so a second replica
# without one silently doubles every rate limit and loses cross-replica realtime.
# Nothing here is durable, so persistence on the server is optional.
# Tested stack: valkey-helm — see the chart README for the exact values I test with.

redis:
  # Secret holding a full redis:// DSN; setting it is enables the shared bus.
  # redis:// | rediss:// (TLS) | valkey:// | valkeys:// | unix://, with the username, password and
  # database number where the server's own documentation puts them.
  existingSecret: ""
  # Key inside that Secret; the chart-managed path writes this same key.
  existingSecretKey: console-redis-dsn
  # Chart-managed alternative to existingSecret; same caveat as the database secret above.
  secret:
    create: false
    name: ""
    annotations: {}
    labels: {}
    dsn: ""
  dialTimeout: 5s

# == 5. Agent == DaemonSet running the enabled checkers against peers on every node.

agent:
  # Explicit zone override; empty lets the controller resolve it from the node.
  zone: ""
  # Scrape-time cardinality valve, rendered as metricRelabelings on the agent ServiceMonitor.
  # It needs serviceMonitor.enabled and the chart refuses the combination otherwise; without the
  # operator, copy the equivalent metric_relabel_configs from docs/metrics.md into your own scrape
  # config. What each mode keeps, per DIRECTED NODE PAIR (N nodes make N*(N-1) of them):
  #   full          ~70 series/pair — everything the agent exports.
  #   counters-only ~10 series/pair — drops the four per-pair histograms (64 of the ~70); the
  #                 loss/jitter gauges and result counters stay, so every pair alert keeps firing.
  #   zone-only     ~0 series/pair — drops every series naming a destination node (histograms,
  #                 gauges, counters, MTR). What remains is the zone family (~74 series per
  #                 DIRECTED ZONE PAIR, so ~74*Z^2 for Z zones) plus the DNS/HTTP/external
  #                 families, which are linear in node count.
  # zone-only requires agents new enough to export the zone family, or Prometheus goes dark on the
  # mesh while the console (which does not scrape) keeps working.
  metrics:
    # full | counters-only | zone-only.
    detail: full
  podAnnotations: {}
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-agent
    # Empty means the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # Default runs an agent on every node, including tainted ones.
  tolerations:
    - operator: Exists
  # No added capabilities: ICMP and MTR use the unprivileged ICMP socket the ping_group_range sysctl
  # below opens. Add NET_RAW here only if you also make it effective (a root container, or ambient
  # caps) — it buys intermediate MTR hops on kernels that withhold them from ping sockets, and costs
  # the restricted PSS profile.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # restricted-PSS compliant; ping_group_range is a kubelet safe sysctl and is what makes the
  # unprivileged ICMP socket work.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  # Render the net.ipv4.ping_group_range sysctl the unprivileged ICMP socket needs.
  # It has its own switch because the only documented opt-out used to be
  # `agent.podSecurityContext: null`, which deletes runAsNonRoot, runAsUser and
  # seccompProfile with it -- precisely the keys a namespace enforcing restricted
  # PSS demands, so opting out of the sysctl got the DaemonSet rejected at admission.
  pingGroupRange: true
  nodeSelector: {}
  affinity: {}
  # Empty renders nothing. The agent is the workload worth raising: under node pressure the kubelet
  # evicts lowest priority first, and the first pod gone should not be the one reporting the node.
  priorityClassName: ""
  # DaemonSet rollout strategy, passed through verbatim. One node at a time is the safe default and
  # a slow one: on hundreds of nodes raise maxUnavailable (count or percentage) or use OnDelete.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

# == 6. Controller == Deployment serving peer lists over gRPC and watching nodes as leader.

controller:
  # Controller replicas; only the leader is active, extras are HA standby.
  replicaCount: 1
  # Leader election; false also disables zone enrichment and expected_agents.
  leaderElection: true
  events:
    # Domain event stream for the Console's realtime ingester (leader-only).
    enabled: false
  # SECOND gRPC listener for agents OUTSIDE the cluster: same services and registry, but TLS with a
  # bearer token — the in-cluster port is guarded by a NetworkPolicy, and whatever reaches a
  # NodePort/LoadBalancer is guarded by nothing but what is configured here. The in-cluster listener
  # and its ClusterIP Service are untouched by this block. The controller reads the certificate and
  # token ONCE at startup — the config hot-reload does not rebuild the listener — so rotating either
  # Secret's content needs a controller restart (kubectl rollout restart); the chart cannot see into
  # referenced Secrets and cannot roll the pods for you.
  externalGateway:
    enabled: false
    # Gateway listener; must differ from config.httpPort/grpcPort/metricsPort.
    port: 9443
    # The externally reachable Service, rendered only when enabled. It exposes the gateway port
    # ALONE — never the plaintext in-cluster gRPC port.
    service:
      # NodePort | LoadBalancer; no ClusterIP, an external agent cannot reach one.
      type: LoadBalancer
      # Cloud-LB knobs (internal LB, static IP) go here.
      annotations: {}
      # Fixed port for type NodePort; 0 lets the apiserver pick one.
      nodePort: 0
      # Cluster | Local; empty leaves the apiserver default (Cluster). Local preserves the agents'
      # source addresses — what networkPolicy.externalAgentCidrs matches on — at the cost of only
      # the nodes running a controller pod answering.
      externalTrafficPolicy: ""
      # Provider-enforced source filter for type LoadBalancer; the in-cluster half of the same
      # decision is networkPolicy.externalAgentCidrs.
      loadBalancerSourceRanges: []
    tls:
      # kubernetes.io/tls Secret holding the gateway's serving pair (tls.crt/tls.key), e.g. one
      # cert-manager maintains; REQUIRED when enabled.
      secretName: ""
      # Key in that SAME Secret holding the CA bundle that signed the agent CLIENT certificates
      # (conventionally ca.crt). Empty is token-only mode: fleet membership is authenticated but
      # agents cannot be told apart, so any token holder can impersonate any agent. Set it and the
      # gateway requires a verified client cert whose CN/URI SAN is pinned to the agent's node name.
      clientCaKey: ""
    # Shared bearer token every external agent must present; the controller refuses one shorter
    # than 16 characters.
    bootstrapToken:
      # Secret holding the token; REQUIRED when enabled.
      secretName: ""
      # Key inside that Secret.
      key: token
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-controller
    # Empty means the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # restricted-PSS compliant; the controller only talks to the apiserver and gRPC.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # The controller is not on the data path, so defaults are small.
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Empty renders nothing.
  priorityClassName: ""
  # PodDisruptionBudget; rendered only at replicaCount > 1, since minAvailable 1 over a single
  # replica blocks every voluntary eviction and hangs node drains.
  pdb:
    enabled: true
    minAvailable: 1

# == 7. Console == optional web UI and API; every block below is inert while enabled is false.

console:
  # -- 7.1 core --
  enabled: false
  # Console replicas; the console is stateless.
  # ONE by default, because the default has no redis. Two replicas without a shared bus is the state
  # the redis block calls invalid, and `--set console.enabled=true` — the quickstart's own command —
  # used to land straight in it. Raise this once redis.existingSecret is set; the chart refuses the
  # combination otherwise.
  replicas: 1
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-console
    # Empty means the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Controller API access.
  controller:
    # Empty derives from this release's controller Service.
    url: ""
    timeout: 10s
    # EventStream host:port; empty derives it when controller.events.enabled.
    grpcAddress: ""
  # Prometheus query API; required by the data pages, which 503 without it.
  prometheus:
    url: ""
    queryTimeout: 30s
    # Largest query_range window the guarded proxy accepts.
    maxRange: 24h
    # Response size cap in bytes.
    maxResponseBytes: 8388608

  # -- 7.2 auth -- authentication mode and the role every request resolves to.
  auth:
    # anonymous | local | header | oidc.
    mode: anonymous
    # Role for an authenticated subject no binding matches; empty means none.
    # One of the built-ins: viewer | operator | alert-editor | admin.
    defaultRole: ""
    # Map a GROUP the identity provider asserts onto a role this console grants -- the declarative
    # half of RBAC, and the one that makes an oidc or header install usable from a cold database.
    # Roles resolve as the union of these and any binding made through the API; what is granted here
    # cannot be revoked through the API, which is the point. A group absent from this map grants
    # nothing, so the map is an allow-list. Values may be a built-in (viewer|operator|alert-editor|
    # admin) or the name of a custom role you created.
    #   groupRoles:
    #     platform-oncall: admin
    #     everyone: viewer
    groupRoles: {}
    anonymous:
      # Fixed role for every anonymous request. Same four built-ins as defaultRole.
      role: viewer
    # mode=local; requires a database.
    local:
      # Created on first start only, while the users table is empty.
      bootstrapAdmin: ""
      # Existing Secret holding the bootstrap password.
      existingSecret: ""
      # Key inside that Secret; the chart-managed path writes this same key.
      existingSecretKey: console-local-admin-password
      # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
      secret:
        create: false
        # Empty derives the name from the release name.
        name: ""
        annotations: {}
        labels: {}
        # Bootstrap admin password; required when create is true.
        password: ""
    # mode=header: identity from a trusted in-cluster reverse proxy.
    header:
      userHeader: X-Remote-User
      groupsHeader: X-Remote-Groups
      groupsDelimiter: ","
      # Required and non-empty for mode=header, else headers are an auth bypass.
      trustedProxyCIDRs: []
    # mode=oidc; requires a database, and redis.existingSecret for replicas > 1.
    oidc:
      issuer: ""
      clientID: ""
      redirectURL: ""
      scopes: [openid, profile, email, groups]
      # DISPLAY name only, and only in the UI: identity is always "oidc:<sub>" — the one claim OIDC
      # Core 5.7 allows as an identifier — and both RBAC bindings and the audit log hang off that.
      # Changing this renames a person in the header menu and moves nothing else.
      usernameClaim: preferred_username
      groupsClaim: groups
      # Existing Secret holding the OIDC client secret.
      existingSecret: ""
      # Key inside that Secret; the chart-managed path writes this same key.
      existingSecretKey: console-oidc-client-secret
      # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
      secret:
        create: false
        # Empty derives the name from the release name.
        name: ""
        annotations: {}
        labels: {}
        # OIDC client secret; required when create is true.
        clientSecret: ""
    # Session cookie for every non-anonymous mode.
    session:
      # Absolute session lifetime, counted from login and never extended.
      ttl: 12h
      # Idle timeout; slides forward on every request, never past ttl. 0 disables it.
      idleTimeout: 1h
      cookieName: __Host-kconmon_session
      # A __Host- cookie with secure=false is rejected at startup.
      secure: true

  # -- 7.3 webhooks -- endpoints themselves are database rows, not values.
  webhooks:
    # Existing Secret with the AES-256-GCM key (base64 of 32 bytes) that
    # encrypts endpoint signing secrets; empty leaves create and test at 503.
    existingSecret: ""
    # Key inside that Secret; the chart-managed path writes this same key.
    existingSecretKey: console-webhooks-encryption-key
    # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
    secret:
      create: false
      # Empty derives the name from the release name.
      name: ""
      annotations: {}
      labels: {}
      # base64 of 32 random bytes (openssl rand -base64 32); required when create is true.
      encryptionKey: ""
    # Alert-transition poll cadence, and the resolution granularity of every
    # alert.resolved delivery; emitted only with webhooks and alerting both on.
    alertPollInterval: 30s

  # -- 7.4 alerting -- Console-managed Prometheus alert rules, reconciled into one PrometheusRule.
  alerting:
    # Off by default: enabling it lets the console write a cluster object.
    enabled: false
    # Namespace the object is applied into; empty means this release's.
    namespace: ""
    # Reconcile cadence, jittered 20%; must be > 0 when enabled.
    syncInterval: 60s
    # Name of the one owned PrometheusRule; changing it orphans the previous.
    bundleName: kconmon-ng-console-rules

  # -- 7.5 optional console features --
  # Advisory-locked tick firing due schedules and reconciling external checks.
  scheduler:
    # Off by default so an upgrade never starts dispatching fleet traffic.
    enabled: false
    # Poll cadence; must be > 0 when enabled.
    tickInterval: 5s
  # Reverse DNS and MaxMind enrichment of stored MTR hop addresses.
  mtr:
    enrichment:
      # Off by default: rdns is an egress footprint.
      enabled: false
      # rdns and geoip gate independently; all sources off is a startup error.
      rdns:
        enabled: false
        # Bounds one lookup, in milliseconds.
        timeoutMs: 500
      # MaxMind GeoLite2 databases, served from the fixed /geoip mount.
      geoip:
        # auto (geoipupdate sidecar) | volume (you supply them) | disabled;
        # empty means volume when a volume or path is set, else disabled.
        mode: ""
        # Editions the sidecar downloads; also what the default paths are derived from.
        editions:
          - GeoLite2-ASN
          - GeoLite2-City
        # geoipupdate's own unit: hours between downloads.
        updateIntervalHours: 24
        # How often the console re-reads changed files; 0 never reloads (restart required).
        reloadInterval: 1h
        image:
          repository: ghcr.io/maxmind/geoipupdate
          tag: v7.1.1
          pullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        # Sidecar container securityContext; it writes into the shared /geoip emptyDir.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        # mode=auto: MaxMind credentials (a free GeoLite2 account issues them).
        existingSecret: ""
        # Keys inside that Secret; the chart-managed path writes these same keys.
        accountIdKey: console-maxmind-account-id
        licenseKeyKey: console-maxmind-license-key
        # Chart-managed alternative to existingSecret; values may be ${vault:...} placeholders.
        secret:
          create: false
          # Empty derives the name from the release name.
          name: ""
          annotations: {}
          labels: {}
          # MaxMind account ID; required when create is true.
          accountId: ""
          # MaxMind license key; required when create is true.
          licenseKey: ""
        # mode=volume (airgapped): opaque VolumeSource mounted read-only at /geoip.
        volume: {}
        # Override only if your files are not named after their edition IDs.
        asnPath: ""
        cityPath: ""
      # Cache row lifetime in PostgreSQL; must be > 0 when enabled.
      ttl: 24h
  # The console's own ServiceAccount when serviceAccount.create is false. Its grants (cluster-wide
  # event read, PrometheusRule write) must not land on the account the agent DaemonSet mounts, so the
  # chart refuses to render until this names one.
  serviceAccount:
    name: ""
  # Kubernetes event capture into the Investigate timeline.
  kubernetesContext:
    # Off by default: enabling it adds apiserver egress and an RBAC grant.
    enabled: false
    # The one namespace whose pod events are captured; empty means this release's.
    namespace: ""
    # Periodic relist backstop against a silently wedged watch.
    resyncInterval: 10m
  # Fixed-window request limits; 0 disables one, a negative value fails startup.
  rateLimit:
    # POST /api/v1/runs per subject per minute.
    runsPerMinute: 10
    # POST /api/v1/auth/login: this value per username, and 20x it per source IP — behind an Ingress
    # every request in the cluster arrives from one address, so a shared budget would let six bogus
    # attempts lock out every user.
    loginPerMinute: 5
    # POST /api/v1/promql/query[_range] per subject per minute; the proxy forwards arbitrary PromQL
    # to your Prometheus, and promql:query belongs to the viewer role.
    promqlPerMinute: 60

  # -- 7.6 console workload plumbing --
  # fsGroup lets the nonroot console read the root-owned Secret files.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # restricted-PSS compliant.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Console NetworkPolicy rules; a host firewall on the destination is a
  # separate layer this chart cannot open.
  networkPolicy:
    # WARNING: empty leaves console ingress open to EVERY pod in the cluster;
    # set peers here (e.g. the ingress-controller namespace) to restrict it.
    # kubectl port-forward is unaffected either way.
    ingressFrom: []
    # Empty renders a default allowing the port from console.prometheus.url to ANY pod AND to
    # 0.0.0.0/0 — a selector cannot match a Prometheus outside the cluster, so the ipBlock is what
    # makes an external one reachable at all. Set this to scope it.
    prometheusEgress: []
    # Egress to the Redis-compatible bus. Empty renders a default allowing
    # TCP 6379; override for a TLS endpoint, a sentinel quorum or a managed
    # service.
    redisEgress: []
    # Empty renders a default allowing TCP 5432.
    databaseEgress: []
    # Empty renders a default allowing TCP 443 to 0.0.0.0/0: an IdP is normally outside the cluster,
    # so there is no namespace the chart could scope this to. Set it to name yours.
    oidcEgress: []
    # Empty renders a default allowing TCP 443/6443 to 0.0.0.0/0.
    kubeAPIEgress: []
    # Empty renders a default allowing TCP 443 to 0.0.0.0/0 for the geoipupdate sidecar.
    geoipEgress: []
    # Webhook delivery, when a webhook encryption key is configured
    # (console.webhooks.existingSecret, or console.webhooks.secret.create).
    # Empty renders TCP 443/80 to 0.0.0.0/0.
    webhookEgress: []
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # [{host: console.example.com, paths: [{path: /, pathType: Prefix}]}]
    hosts: []
    # [{secretName: console-tls, hosts: [console.example.com]}]
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Empty renders nothing.
  priorityClassName: ""
  # Rendered only when console.enabled and replicas > 1.
  pdb:
    enabled: true
    minAvailable: 1

# == 8. Observability == objects for a Prometheus Operator you already run; this chart installs none.

# Ships dashboards/*.json as ConfigMaps for the Grafana sidecar to pick up.
dashboards:
  enabled: false
  # Empty renders into the release namespace; set it where your Grafana sidecar watches.
  namespace: ""
  # Label the Grafana sidecar selects on, and its value.
  label: grafana_dashboard
  labelValue: "1"
  # Grafana folder the sidecar files them under; empty leaves it at the sidecar default.
  folder: kconmon-ng
  extraLabels: {}
  annotations: {}

# ServiceMonitor for /metrics; needs the operator CRDs.
serviceMonitor:
  enabled: false
  interval: 15s

# PrometheusRule with the built-in alerts; rule text lives in templates/_rules.tpl, tuning here.
prometheusRule:
  enabled: false
  # UDP loss ratio above threshold on a pair.
  udpLossHigh:
    enabled: true
    # Loss ratio, 0.0-1.0.
    threshold: 0.5
    for: 5m
    severity: warning
  # TCP failure ratio (rate(fail)/rate(all)) above threshold on a pair.
  tcpChecksFailing:
    enabled: true
    # Failure ratio, 0.0-1.0.
    threshold: 0.05
    for: 5m
    severity: warning
  # A pair probed within the last hour that now reports nothing.
  pairWentSilent:
    enabled: true
    for: 10m
    severity: warning
  # DNS failure ratio above threshold per host/resolver.
  dnsChecksFailing:
    enabled: true
    # Failure ratio, 0.0-1.0.
    threshold: 0.05
    for: 5m
    severity: warning
  # External-target failure ratio above threshold; looser, it leaves the cluster.
  externalChecksFailing:
    enabled: true
    # Failure ratio, 0.0-1.0.
    threshold: 0.1
    for: 5m
    severity: warning
  # Failure ratio across TCP+UDP+ICMP between a zone pair. Reads the zone metric family, which
  # only agents new enough to export it serve — on older agents the rule is silently inert.
  zoneChecksFailing:
    enabled: true
    # Failure ratio, 0.0-1.0.
    threshold: 0.05
    for: 5m
    severity: warning
  # Packet loss between a zone pair, from the sent/received counters. Lower default than the
  # per-pair UDPLossHigh: the zone aggregate dilutes any single link by the pair count, so
  # sustained loss at this level means the fabric, not one node.
  zoneLossHigh:
    enabled: true
    # Loss ratio, 0.0-1.0.
    threshold: 0.1
    for: 5m
    severity: warning
  # Registered agents below the schedulable-node count; needs leaderElection.
  kconmonAgentsMissing:
    enabled: true
    for: 10m
    severity: warning
  # No controller reports itself leader; needs leaderElection.
  kconmonControllerDown:
    enabled: true
    for: 5m
    severity: critical
  # Extra rules appended verbatim; write metric names with your own prefix.
  additionalRules: []

# == 9. Kubernetes == identity, network and disruption plumbing.

# ServiceAccount for the agent and controller.
serviceAccount:
  # False binds the pods to an existing ServiceAccount instead of creating one.
  create: true
  # Empty generates the name from the release name; required when create is false.
  name: ""

# ClusterRole/Role and their bindings for the resolved ServiceAccount; false means you manage RBAC.
rbac:
  create: true

# NetworkPolicy for agent/controller traffic; enable only if the cluster enforces policies.
networkPolicy:
  enabled: false
  # Pod labels of the scraper itself; empty admits the whole prometheusNamespace on the metrics port.
  prometheusPodLabels: {}
  # Namespace Prometheus scrapes from. REQUIRED for a scrape rule to render: the controller serves
  # /metrics on the same port as its unauthenticated API, so "any namespace" would hand the whole
  # cluster the fleet. Unset means no rule, and the scrape fails visibly (up = 0).
  prometheusNamespace: ""
  # Apiserver egress, controller only (nothing else calls the apiserver). Empty renders TCP 443/6443
  # to 0.0.0.0/0; name your endpoint here to tighten it.
  kubeAPIEgress: []
  # REQUIRED when the external checker is on, and the other half of
  # config.checkers.external.allowedCidrs: that one lets the agent try, this
  # one lets the packet leave.
  externalEgress: []
  # Source CIDRs of the EXTERNAL agents, opened on the gateway port toward the controller pods.
  # REQUIRED when controller.externalGateway.enabled is on together with this policy: the shared
  # policy default-denies controller ingress it does not name, so an empty list would let the chart
  # render a gateway no packet can reach — and it refuses to do that silently. Mind NAT: through a
  # NodePort or a LoadBalancer with externalTrafficPolicy: Cluster the source the policy sees is the
  # NODE's own IP, so either cover the node CIDR here or use externalTrafficPolicy: Local.
  # [{cidr: 203.0.113.0/24}] shapes are not accepted — plain CIDR strings.
  externalAgentCidrs: []
  # Empty renders TCP 80/443 to 0.0.0.0/0 when the HTTP checker is on.
  httpEgress: []
  # Egress to DNS resolvers outside the cluster (config.checkers.dns.resolvers).
  resolverEgress: []
