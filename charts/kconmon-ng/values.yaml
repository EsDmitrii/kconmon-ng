---
# Default values for kconmon-ng.
# This is a YAML-formatted file.

# Controller Deployment. One controller hands every agent its peer list over
# gRPC and (as leader) watches Kubernetes nodes to resolve zones and count
# expected agents. Tune replicas/HA and scheduling here.
controller:
  # Number of controller Pods. Only the leader is active; extra replicas stay
  # ready but passive (HA standby). Requires leaderElection=true to be useful.
  replicaCount: 1
  # HA leader election among controller replicas. IMPORTANT: the node informer
  # only runs on the leader, so zone enrichment (source_zone/dest_zone labels)
  # and the kconmon_ng_controller_expected_agents metric require this to be
  # true. Setting it false disables those features even with one replica.
  leaderElection: true
  # Controller domain event stream (EventStream.WatchEvents gRPC) consumed by
  # the Console's events ingester, plus the "events" capability flag on
  # GET /api/v1/version. Leader-only: passive replicas reject subscriptions.
  # OFF by default — with events.enabled=false the Console detects the missing
  # capability and stays on M1 Prometheus polling with a "delayed data" badge.
  events:
    enabled: false
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-controller
    # Image tag. Empty string means the chart appVersion is used.
    tag: ""
    pullPolicy: IfNotPresent
  # Controller resource requests/limits. Defaults are small; the controller is
  # not on the data path (agents do the probing).
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # Standard scheduling controls for the controller Deployment.
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Agent DaemonSet. One agent runs on every node and executes the enabled
# checkers against its peers, exposing results as Prometheus metrics.
agent:
  # zone is an optional explicit override for the agent's failure-domain zone.
  # Leave empty (default): the controller resolves each agent's zone from its
  # node label (config.failureDomainLabel) at registration and the agent adopts
  # it. A non-empty value here always wins over the controller-resolved zone.
  # Note: zone enrichment requires controller.leaderElection=true (the
  # NodeWatcher only runs on the leader).
  zone: ""
  # Extra annotations for agent Pods (e.g. custom Prometheus scrape hints).
  podAnnotations: {}
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-agent
    # Image tag. Empty string means the chart appVersion is used.
    tag: ""
    pullPolicy: IfNotPresent
  # Agent resource requests/limits. Applied to every node's agent Pod.
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # Default tolerates everything so an agent runs on all nodes, including
  # tainted/control-plane nodes. Narrow this to skip specific nodes.
  tolerations:
    - operator: Exists
  # Agent needs the NET_RAW capability to open raw sockets for the ICMP checker
  # and reactive MTR traces. Removing it breaks ICMP/MTR (TCP/UDP/DNS/HTTP
  # checkers do not require it).
  securityContext:
    capabilities:
      add:
        - NET_RAW
  # Pod-level security context. The ICMP checker opens an unprivileged ICMP
  # "ping" socket (SOCK_DGRAM+IPPROTO_ICMP), which the kernel gates on
  # net.ipv4.ping_group_range — NOT on NET_RAW. Some container runtimes leave
  # this at the closed kernel default ("1 0"), so the checker fails with
  # "socket: permission denied". Opening the range (a safe, namespaced sysctl)
  # lets any GID create ping sockets. Set podSecurityContext to {} to opt out.
  podSecurityContext:
    sysctls:
      - name: net.ipv4.ping_group_range
        value: "0 2147483647"

# Runtime configuration rendered into a ConfigMap and consumed by both the
# controller and the agents. Changes are hot-reloaded without a restart.
config:
  # Prefix for all exported Prometheus metrics (e.g. kconmon_ng_tcp_results_total).
  # Changing it renames every metric; update dashboards/alerts accordingly.
  metricsPrefix: kconmon_ng
  # Port serving /metrics and health endpoints. Must differ from grpcPort;
  # both must be 1-65535 or startup fails.
  httpPort: 8080
  # Port for the controller's gRPC peer-list/topology API. Must differ from httpPort.
  grpcPort: 9090
  # Log verbosity: one of debug, info, warn, error. Invalid values fail startup.
  logLevel: info
  # Log output format: json or text. Invalid values fail startup.
  logFormat: json
  # Node label the controller reads to determine each agent's zone. Used to
  # populate source_zone/dest_zone metric labels (see agent.zone override).
  failureDomainLabel: topology.kubernetes.io/zone
  # How long the controller keeps a registered agent without a heartbeat before
  # evicting it from the peer list. Too low risks flapping on slow nodes.
  controllerAgentTtl: 30s
  # Per-protocol connectivity checkers run by each agent against its peers.
  # For any ENABLED checker, invalid timing fails startup (v1.2.0 strict
  # validation): interval and timeout must both be > 0. A shorter interval
  # means more frequent probes -> higher CPU/network load and metric cardinality.
  checkers:
    # TCP dial check to a peer's port. Verifies L4 reachability.
    tcp:
      enabled: true
      # How often to probe. Lower = more load.
      interval: 5s
      # Per-probe deadline. Must be > 0 when enabled; >= interval only warns.
      timeout: 1s
    # UDP probe measuring packet loss to a peer.
    udp:
      enabled: true
      interval: 5s
      timeout: 250ms
      # Packets sent per probe to compute loss ratio. Must be >= 1 (validated).
      packets: 5
    # ICMP (ping) reachability/loss check. Requires the agent NET_RAW capability.
    icmp:
      enabled: true
      interval: 5s
      timeout: 1s
    # DNS resolution check.
    dns:
      enabled: true
      interval: 5s
      # DNS lookups can be slow; timeout is larger by default.
      timeout: 5s
      # Names to resolve each interval. Must be non-empty when the checker is
      # enabled (validated); each entry must be a non-empty name.
      hosts:
        - kubernetes.default.svc.cluster.local
      # Optional explicit resolvers as "host" or "host:port". Empty = use the
      # Pod's default resolver. Malformed entries fail startup.
      resolvers: []
    # HTTP endpoint check. Disabled by default. When enabled, targets must be
    # non-empty and each URL must be a valid http/https URL with a host.
    http:
      enabled: false
      interval: 30s
      timeout: 5s
      # List of HTTP targets (url, optional method/expectStatus/bodyPattern).
      targets: []
    # Reactive traceroute (MTR) triggered on probe failures to locate the bad hop.
    mtr:
      # Minimum gap between MTR runs for the same node pair, to avoid trace floods.
      cooldown: 60s
      # Max traceroute hops. Must be between 1 and 64 (validated).
      maxHops: 30
    # External checks: every probe whose destination is NOT a peer agent — the
    # Console's external targets (continuous) and one-shot external diagnostics.
    # OFF by default, and the block is rendered into the shared ConfigMap ONLY
    # when enabled, so an install that leaves it alone produces a config file
    # byte-identical to chart 1.5.0's.
    #
    # TWO LAYERS, and this is the one people get wrong: a Kubernetes
    # NetworkPolicy cannot gate agent -> internet egress in any useful way here.
    # allowedCidrs/deniedCidrs are enforced by the AGENT, in-process, after DNS
    # resolution. If your cluster enforces default-deny egress at the node/CNI
    # layer — Calico global policy, cilium ClusterwideNetworkPolicy, a
    # node-level iptables/nftables ruleset, a cloud security group — that layer
    # must be opened separately for the agent DaemonSet or every external probe
    # fails on the wire while this config says it is allowed. Same shape as the
    # console.networkPolicy note further down: allowed here and still refused on
    # the wire almost always means the node/CNI layer was missed.
    external:
      # Master switch. false => the block is not parsed, not validated, and no
      # external probe can run; the metric families stay empty.
      enabled: false
      # Destinations the agent MAY probe, as CIDRs (IPv4 and IPv6 both fine),
      # matched against the RESOLVED address. REQUIRED and non-empty when
      # enabled=true — an empty list is a startup error, never read as
      # "allow everything". Malformed entries fail startup with the index.
      allowedCidrs: []
      # Carve-outs subtracted from allowedCidrs; denied wins. The usual entries
      # are link-local metadata (169.254.169.254/32) and loopback.
      deniedCidrs: []
      # Cap on operator-defined external targets this agent accepts. Defaulted
      # to 100 by the agent when enabled and left at 0. NOTE: the value is
      # validated at startup but not yet enforced against the assignment the
      # controller pushes — see CONFIG.md.
      maxTargets: 100
      # Bounds resolution-and-authorisation of ONE external destination. It does
      # NOT replace the per-checker timeout: the probe itself stays governed by
      # checkers.<type>.timeout.
      timeout: 10s

# Prometheus Operator ServiceMonitor for scraping the /metrics endpoint.
# Requires the Prometheus Operator CRDs to be installed.
serviceMonitor:
  enabled: false
  # Scrape interval used by the generated ServiceMonitor.
  interval: 15s

# Prometheus Operator PrometheusRule with built-in alerts. Requires the
# Prometheus Operator CRDs. Edit or replace `rules` to customize alerting.
# The two self-monitoring alerts (KconmonAgentsMissing, KconmonControllerDown)
# require controller.leaderElection=true, since expected_agents and the leader
# metric are only produced by the leader's node informer.
prometheusRule:
  enabled: false
  rules:
    - alert: UDPLossHigh
      expr: kconmon_ng_udp_packet_loss_ratio > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High UDP packet loss detected
    - alert: TCPChecksFailing
      expr: rate(kconmon_ng_tcp_results_total{result="fail"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: TCP connectivity checks failing
    - alert: DNSChecksFailing
      expr: rate(kconmon_ng_dns_results_total{result="fail"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: DNS resolution checks failing
    # External checks (config.checkers.external.enabled). The vec stays empty
    # until an external probe reports, so this rule is inert on an install that
    # never enabled the feature — no `absent()` false positive either way.
    - alert: ExternalChecksFailing
      expr: rate(kconmon_ng_external_results_total{result="fail"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: External connectivity checks failing
    # Self-monitoring: registered agents stay below the schedulable-node count
    # for 10m (agents failing to register or crash-looping).
    - alert: KconmonAgentsMissing
      expr: kconmon_ng_controller_registered_agents < kconmon_ng_controller_expected_agents
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Fewer kconmon-ng agents registered than schedulable nodes
    # Self-monitoring: no controller reports itself leader for 5m — the control
    # plane is down and no other rule would evaluate.
    - alert: KconmonControllerDown
      expr: absent(kconmon_ng_controller_leader == 1)
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: No active kconmon-ng controller leader

# NetworkPolicy locking down agent/controller traffic. When enabled it allows:
# agent<->controller gRPC, agent<->agent UDP probes + HTTP metrics, DNS (53),
# and the Kubernetes API (443). Enable only if the cluster enforces policies.
networkPolicy:
  enabled: false
  # Namespace Prometheus scrapes from. Empty = allow scrape ingress from any
  # namespace; set it to restrict scraping to your monitoring namespace.
  prometheusNamespace: ""

# PodDisruptionBudget for the controller Deployment, so voluntary disruptions
# (drains/upgrades) keep a controller available.
pdb:
  # With replicaCount=1 a minAvailable of 1 blocks voluntary eviction of the
  # sole controller; raise replicaCount for smoother maintenance.
  enabled: true
  minAvailable: 1

# ServiceAccount used by the controller (needs RBAC to watch nodes/leases).
serviceAccount:
  # Create the ServiceAccount and its RBAC. Set false to use an existing one.
  create: true
  # Name of the ServiceAccount. Empty = generated from the release name.
  name: ""

# Console (kconmon-ng Console). A separate Deployment serving the web UI and its
# API. OFF by default: with console.enabled=false the chart renders exactly as
# before. The default auth.mode=anonymous (a fixed role + a permanent warning
# banner in the UI) keeps that byte-identical default even with everything
# below present. Alerting integration lands in a later milestone.
console:
  enabled: false
  # Number of console replicas. The M0 console is stateless.
  replicas: 2
  image:
    repository: ghcr.io/esdmitrii/kconmon-ng-console
    # Image tag. Empty string means the chart appVersion is used.
    tag: ""
    pullPolicy: IfNotPresent
  # Authentication (SECURITY.md §10.1).
  auth:
    # anonymous | local | header | oidc.
    # anonymous is the default and a fully supported deployment: RBAC still
    # applies, with every request carrying the fixed role below.
    mode: anonymous
    anonymous:
      # Fixed role assigned to every anonymous request.
      role: viewer
    # Role granted to an authenticated subject that no role binding matches.
    # Empty means such a subject can do nothing (403) until an admin binds it.
    defaultRole: ""
    # mode=local: users and sessions in PostgreSQL (argon2id passwords).
    # Requires console.database.mode=cnpg|external (see the render guard
    # below).
    local:
      # Username created on FIRST start only, when the users table is empty.
      bootstrapAdmin: ""
      # Name of an existing Secret holding the bootstrap password.
      # Referenced by name only; this chart never creates or reads it.
      existingSecret: ""
      existingSecretKey: password
    # mode=header: identity trusted from a header set by an in-cluster
    # reverse proxy. See trustedProxyCIDRs below — it is mandatory in this
    # mode, with no default that would trust every peer.
    header:
      userHeader: X-Remote-User
      groupsHeader: X-Remote-Groups
      groupsDelimiter: ","
      # REQUIRED and non-empty for mode=header. The console trusts the identity
      # headers ONLY from a peer inside these CIDRs. An empty list would make an
      # unauthenticated request header an authentication bypass, so rendering
      # fails rather than shipping that.
      trustedProxyCIDRs: []
    # mode=oidc: authorization-code + PKCE against an external IdP. Requires
    # console.database.mode=cnpg|external (sessions live in PostgreSQL) and,
    # for console.replicas>1, console.valkey.mode=bundled|external (sessions
    # live in Valkey, not the single-replica in-process KV) — see the render
    # guards below.
    oidc:
      issuer: ""
      clientID: ""
      # Name of an existing Secret holding the OIDC client secret.
      existingSecret: ""
      existingSecretKey: clientSecret
      redirectURL: ""
      scopes: [openid, profile, email, groups]
      usernameClaim: preferred_username
      groupsClaim: groups
    # Session cookie used by every non-anonymous mode.
    session:
      ttl: 12h
      cookieName: __Host-kconmon_session
      # Set false ONLY for local http:// development. A __Host- cookie name
      # with secure=false is rejected at startup.
      secure: true
  # Controller API access (topology). Empty url means "derive from this
  # release's controller Service"; set explicitly to point elsewhere.
  controller:
    url: ""
    # Per-request timeout for console -> controller calls.
    timeout: 10s
    # gRPC address of the controller's EventStream (host:port). Empty means
    # "derive from this release's controller Service when
    # controller.events.enabled=true, otherwise leave realtime off".
    # Setting this explicitly points the console at a controller in ANOTHER
    # namespace or cluster. The chart still renders only a same-namespace
    # egress rule to THIS release's controller, so a target outside this
    # namespace needs your own NetworkPolicy on both the egress and ingress
    # sides (plus any host firewall) — there is no grpcEgress override list
    # in M2.
    grpcAddr: ""
  # Prometheus query API (matrix, Explore, PromQL console). REQUIRED for the
  # M1 data pages; with url empty those APIs answer 503 and the UI says so.
  prometheus:
    url: ""
    queryTimeout: 30s
    # Maximum query_range window the guarded proxy accepts.
    maxRange: 24h
    # Response size cap in bytes (8 MiB).
    maxResponseBytes: 8388608
  # Valkey pub/sub for cross-replica WebSocket fan-out (ADR-002: ephemeral
  # only — a flush must lose zero durable data).
  #   bundled  = this chart renders a minimal single-replica Valkey
  #              Deployment + Service (see the ephemeral note below)
  #   external = point at an existing Valkey/Redis via address
  #   disabled = no Valkey; the console falls back to an in-process bus,
  #              which is correct ONLY for console.replicas=1 (documented
  #              degradation: browsers on other replicas see no events)
  # The bundled Valkey is deliberately ephemeral: no PersistentVolumeClaim, no
  # volumeClaimTemplates, no writable data dir at all. Per ADR-002 a Valkey
  # flush must lose zero durable data, so losing the whole instance on a Pod
  # restart is a liveness event, never a data-loss event; the console's own
  # in-memory replay ring covers the reconnect window.
  valkey:
    mode: disabled
    # host:port of an existing Valkey. REQUIRED when mode=external, ignored
    # otherwise (rendering fails fast if mode=external and this is empty).
    address: ""
    # Initial dial timeout for the console's Valkey client.
    dialTimeout: 5s
    # Port the bundled Valkey listens on and the address the console dials.
    port: 6379
    # Bundled-only image. Ignored for mode=external|disabled.
    image:
      repository: valkey/valkey
      tag: 9-alpine
      pullPolicy: IfNotPresent
    # Bundled-only resources. Pub/sub fan-out plus short-TTL caches only.
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  # PostgreSQL for durable Console state (ADR-001). M3 uses it for the event
  # history behind GET /api/v1/events, the auth/RBAC/audit tables and run
  # history. It is OPTIONAL: with mode=disabled the console runs exactly the
  # M1/M2 surface — no history, no local/oidc auth, in-memory run history only.
  #   cnpg     = this chart renders a CloudNativePG Cluster CR; the console
  #              reads the DSN from the operator-generated <cluster>-app Secret
  #   external = point at an existing PostgreSQL; you supply a Secret holding
  #              the full DSN (existingSecret + existingSecretKey)
  #   disabled = no database (default)
  # CRD ORDERING TRAP (ADR-001 "Negative"): mode=cnpg requires the CNPG
  # operator's CRDs to already exist in the cluster. This chart does NOT install
  # the operator (installOperator is intentionally absent) — `helm install` will
  # fail with "no matches for kind Cluster" if you skip that step.
  # NOTE on rotation: the DSN Secret is read once at boot (mounted as a file);
  # rotating it is an operator-initiated restart, the Deployment does not roll
  # automatically on Secret changes (only on ConfigMap changes).
  database:
    mode: disabled
    # mode=external only. The Secret must contain a full postgres:// DSN.
    # The chart NEVER templates a credential value — it references this Secret
    # by name and mounts the key as a file.
    existingSecret: ""
    existingSecretKey: dsn
    maxConns: 10
    connectTimeout: 10s
    # Run embedded goose migrations at startup (ADR-001: embedded,
    # advisory-locked, run on start). Set false only if you migrate out of band.
    migrateOnStart: true
    # Rows older than this are pruned by a daily background sweep (DATA.md §5.2).
    # 0 keeps everything forever.
    retentionDays: 90
    # mode=cnpg only.
    cnpg:
      instances: 2
      imageName: ""            # empty = CNPG operator default
      storage:
        size: 10Gi
        storageClass: ""
      resources: {}
      # Optional ScheduledBackup; requires a configured barmanObjectStore.
      backup:
        enabled: false
        schedule: "0 0 2 * * *"
        destinationPath: ""
        endpointURL: ""
        # Name of an existing Secret with the object-store credentials.
        # Referenced by name only; never created or read by this chart.
        # S3-compatible object stores only (barman s3Credentials); for
        # Azure/GCS/IAM-role credentials render your own Cluster CR.
        credentialsSecret: ""
  # Fixed-window request limits on the two endpoints where an unbounded caller
  # is an availability problem. Both are counts per MINUTE and both follow the
  # same convention as database.retentionDays: 0 disables THAT limit, a
  # negative value is a startup error (a typo must not read as "off").
  #
  # The window is counted in the console's KV, so the limit is cluster-wide
  # with valkey.mode=bundled|external and PER REPLICA with valkey.mode=disabled
  # (the in-process KV has no cross-replica visibility, ADR-002): N replicas
  # then admit up to N times the configured rate. Weaker than configured,
  # never stronger.
  #
  # Both limits FAIL OPEN when the KV is unreadable — a Valkey outage must not
  # become a login outage. Every fail-open admission is counted by
  # kconmon_ng_console_rate_limit_failopen_total.
  rateLimit:
    # POST /api/v1/runs per SUBJECT per minute. One run fans out to up to 400
    # agent pairs, so an unbounded caller is a controller-load amplifier.
    runsPerMinute: 10
    # POST /api/v1/auth/login per USERNAME and, counted independently, per
    # SOURCE IP per minute. This is an availability control as much as an
    # anti-brute-force one: argon2id is deliberately 64 MiB per verification.
    loginPerMinute: 5
  # Console schedule loop: the advisory-locked tick that fires due check_schedules
  # rows through the diagnostics runner, drives the stuck-run reaper, and (same
  # lock, same tick gate) reconciles continuous external checks onto agents.
  #
  # OFF by default, deliberately. Schedules can be created and stored without
  # anything acting on them, so upgrading to this chart must not by itself start
  # dispatching fleet traffic from rows an operator entered while nothing was
  # consuming them. Turning it on is a deliberate act.
  #
  # Enabling it also needs console.database.mode=cnpg|external (check_schedules
  # and the cross-replica advisory lock both live in PostgreSQL) and a reachable
  # controller (a fired schedule becomes an ordinary diagnostics run). With
  # either missing the console logs and skips the loop rather than failing to
  # start. The block is rendered into the ConfigMap only when enabled.
  scheduler:
    enabled: false
    # Poll cadence. Short by design: the advisory lock is taken and released per
    # tick, so a replica dying mid-tick delays one tick instead of wedging the
    # fleet until its PostgreSQL session is reaped. Must be > 0 when enabled.
    tickInterval: 5s
  # MTR path history extras (M5). Path history itself needs no configuration —
  # the checks runner projects every MTR result into mtr_path_snapshots whenever
  # console.database.mode is cnpg|external. This block is only about ENRICHING
  # the hop addresses in a stored trace with reverse DNS and MaxMind data.
  #
  # The whole block is rendered into the ConfigMap only when enabled, exactly
  # like console.scheduler and config.checkers.external: the console config is
  # parsed with KnownFields(true) and a pre-M5 console image has no `mtr:` key
  # at all, so an unconditional block would crashloop the old Pod as the
  # Deployment rolls. Off by default also keeps this chart's default render
  # key-identical to 1.6.0's.
  mtr:
    enrichment:
      # Master gate. OFF for a stronger reason than the scheduler's: enrichment
      # is the only part of the console that talks to something other than the
      # controller, Prometheus, Valkey and PostgreSQL. rdns sends every hop
      # address the fleet ever traced to whatever resolver /etc/resolv.conf
      # names — an egress footprint, not a default.
      enabled: false
      # rdns and geoip gate INDEPENDENTLY. An air-gapped cluster with mmdb files
      # and no reachable resolver runs geoip-only; a cluster with internal DNS
      # and no MaxMind licence runs rdns-only. Turning the master gate on with
      # every source off is a STARTUP ERROR, not a no-op: the resolver would
      # cache empty rows and the ttl would then protect them for a day.
      rdns:
        enabled: false
        # Bounds ONE lookup, not the batch. Milliseconds rather than a duration
        # string so `500` cannot accidentally mean 500ns. Must be > 0 when
        # rdns.enabled.
        timeoutMs: 500
      # MaxMind GeoLite2 databases. The console NEVER downloads them: the files
      # come from a volume you supply below. An empty path is that source off;
      # an unreadable file is NOT a boot failure — the console warns, disables
      # that one source, and keeps serving trace history.
      geoip:
        # Both paths must sit under /geoip — that mount path is fixed by the
        # chart (see volume below), and a path outside it names a file no
        # container ever sees.
        # asnPath: /geoip/GeoLite2-ASN.mmdb
        asnPath: ""
        # cityPath: /geoip/GeoLite2-City.mmdb
        cityPath: ""
        # OPAQUE Kubernetes VolumeSource, spliced verbatim into the console
        # Pod's volumes[] and mounted read-only at /geoip. Deliberately not a
        # typed {configMap|secret|hostPath|pvc} switch: mmdb files are ~10 MB
        # (too big for a ConfigMap in many clusters), operators keep them in
        # wildly different places, and re-declaring the VolumeSource union in
        # values.schema.json would go stale the first time Kubernetes adds a
        # source. Whatever you write here is what Kubernetes validates.
        #
        #   volume:
        #     persistentVolumeClaim:
        #       claimName: geolite2
        #
        # Rendering FAILS if a geoip path is set and this is empty: the config
        # would name a file nothing mounts, and the console would start, warn
        # once and silently run without geoip — the failure mode this guard
        # exists to make loud.
        volume: {}
      # Cache row lifetime in mtr_hop_enrichment. A row older than this is
      # re-resolved on the next read that wants it: there is no background
      # refresher in M5, so an address nobody looks at costs nothing. 24h
      # because the answers are slow-moving — a PTR record and an ASN change on
      # the order of months. Must be > 0 when enabled.
      #
      # The cache lives in PostgreSQL, so this whole block is INERT with
      # console.database.mode=disabled: the console logs a warning at boot and
      # runs without the resolver rather than re-resolving on every read.
      ttl: 24h
  # Kubernetes event capture (M6). The ONLY part of the console that talks to
  # the apiserver: it list+watches core/v1 Events and writes the ones that
  # concern this fleet into k8s_events, so the Investigate timeline can put
  # "the kubelet restarted this pod" next to "loss to this node spiked".
  #
  # The whole block is rendered into the ConfigMap only when enabled, exactly
  # like console.scheduler and console.mtr: the console config is parsed with
  # KnownFields(true) and a pre-M6 console image has no `kubernetesContext:` key
  # at all, so an unconditional block would crashloop the old Pod as the
  # Deployment rolls. Off by default also keeps this chart's default render
  # key-identical to 1.7.0's.
  kubernetesContext:
    # Master gate. OFF for the same reason mtr.enrichment is: turning it on
    # gives the console pod a NEW egress (the apiserver) and a NEW RBAC grant
    # (events/nodes/pods get,list,watch). Enabling it renders, under this one
    # flag: the config block, a console-only ServiceAccount + ClusterRole +
    # ClusterRoleBinding (templates/rbac.yaml — the agent/controller grant is
    # NEVER widened), serviceAccountName on the console Deployment, the
    # POD_NAMESPACE downward-API env var, and the apiserver egress rule.
    #
    # It also needs console.database.mode=cnpg|external: captured events live
    # in PostgreSQL. With the database off the console logs a warning and skips
    # the reader rather than failing to start (the enrichment precedent).
    enabled: false
    # The ONE namespace whose POD events are captured. Empty — the default —
    # means "the namespace this release runs in", which the console reads from
    # the POD_NAMESPACE env var the Deployment sets via the downward API.
    #
    # Deliberately one namespace and not a list: the release namespace is where
    # the agents and the controller run, and widening this is how a capture
    # turns into a cluster-wide event firehose. NODE events are cluster-scoped
    # and filtered differently — kept only for nodes present in the controller's
    # topology, dropped entirely when no topology is available (fail closed).
    namespace: ""
    # Periodic relist even while the watch is healthy — the backstop against a
    # watch that is silently wedged (connected, delivering nothing), which no
    # error path can detect. Ten minutes because the apiserver keeps events for
    # an hour by default, so a relist at this cadence cannot miss one, and every
    # relisted row the database already holds costs one conflicting INSERT, not
    # a duplicate row. Must be > 0 when enabled.
    resyncInterval: 10m
  # Outbound webhooks (M6). Everything about a webhook endpoint — its URL, its
  # event filter, its enabled flag, its HMAC signing secret — is a database row
  # an admin typed through the API. Only ONE thing is a deployment secret and
  # therefore config: the AES-256-GCM key that encrypts each endpoint's signing
  # secret at rest.
  #
  # Leaving this empty is a supported state, not a broken one: every read,
  # update, disable and delete route keeps working, and only the two operations
  # that need the cipher — creating an endpoint and testing one — answer 503
  # naming this value. A key that IS named but unreadable or malformed is a
  # broken Secret mount, and the console refuses to start on it exactly as it
  # refuses to start on an unreadable database.dsnFile.
  webhooks:
    # Reference to an existing Secret holding the key, base64 (standard
    # encoding) of 32 random bytes: `openssl rand -base64 32`. Same posture as
    # console.database.existingSecret — the chart references this Secret BY NAME
    # and mounts the key as a file (webhooks.encryptionKeyFile in the rendered
    # config); it NEVER templates a credential value, and there is deliberately
    # no inline-key value to make that impossible.
    #
    # The file lands in the same projected volume as the DSN, so rotating the
    # Secret is an operator-initiated restart: it is read once at boot and the
    # Deployment rolls on ConfigMap changes only.
    encryptionKeySecret:
      name: ""
      key: encryptionKey
  # Pod-level securityContext for the console Deployment. Rendered ONLY when
  # database.mode != disabled, so the default (database off) manifest stays
  # byte-identical to chart 1.4.0. The default fsGroup matches the distroless
  # nonroot gid (65532): the kubelet writes the DSN Secret file root-owned, and
  # fsGroup + the volume's group-readable defaultMode (0440) is what lets the
  # nonroot console process read it — without this the console crashes at boot
  # with "read database.dsnFile: permission denied". Override if you run a
  # custom console image with a different gid.
  podSecurityContext:
    fsGroup: 65532
  # NetworkPolicy rules specific to the console (only rendered when
  # console.enabled and the top-level networkPolicy.enabled are both true).
  # NOTE: a Kubernetes NetworkPolicy is only ONE of the two layers that gate
  # this traffic in a real deployment. If the destination (an external Valkey,
  # a Prometheus outside the cluster) sits behind a host firewall — iptables,
  # nftables, a puppet-managed ruleset, a cloud security group — that layer
  # must be opened separately. Egress allowed here and still refused on the
  # wire almost always means the host-firewall layer was missed.
  networkPolicy:
    # Custom egress rule list for console -> Prometheus; when empty a
    # default rule allowing TCP 9090 to any namespace is rendered.
    prometheusEgress: []
    # Custom egress rule list for console -> external Valkey; when empty and
    # console.valkey.mode=external, a default rule allowing the port from
    # console.valkey.address (NOT console.valkey.port, which describes the
    # bundled listener) to any namespace is rendered. Ignored for mode=bundled
    # (a precise pod-selector rule is rendered instead).
    valkeyEgress: []
    # Custom egress rule list for console -> an EXTERNAL PostgreSQL; when empty
    # and mode=external, a default rule allowing TCP 5432 to any namespace is
    # rendered. Ignored for mode=cnpg (a precise pod-selector rule is rendered
    # instead). Same two-layer warning as above applies: for a database outside
    # the cluster, the destination host's own firewall must allow it too.
    databaseEgress: []
    # Custom egress rule list for console -> the OIDC IdP (auth.mode=oidc
    # only); when empty a permissive default rule allowing TCP 443 to any
    # namespace is rendered, since an IdP is almost always outside the
    # cluster and its address is not known to this chart. A PUBLIC IdP also
    # needs egress to DNS (already allowed, see the DNS rule below) to
    # resolve its hostname. Same two-layer warning as prometheusEgress/
    # valkeyEgress/databaseEgress: this NetworkPolicy is only the CLUSTER
    # side of the gate — a cluster that also enforces a default-deny egress
    # policy at the node/CNI layer (not just via Kubernetes NetworkPolicy)
    # must be checked and opened there too, or the IdP stays unreachable
    # even with this rule present.
    oidcEgress: []
    # Custom egress rule list for console -> the Kubernetes apiserver
    # (console.kubernetesContext.enabled only); when empty a default rule
    # allowing TCP 443 and 6443 to 0.0.0.0/0 is rendered. ipBlock and not a
    # namespaceSelector on purpose: kubernetes.default.svc is a ClusterIP with
    # no pod behind it, and the real endpoints are the control-plane node
    # addresses — a namespaceSelector matches only in-cluster Pods and would
    # silently drop every packet to the apiserver, leaving the event reader
    # retrying with a backoff and nothing else to say why. Tighten this to your
    # control plane's actual addresses. Same two-layer warning as the other
    # egress rules: for a control plane outside the cluster network this
    # NetworkPolicy is only the cluster-side gate.
    kubeAPIEgress: []
  service:
    type: ClusterIP
    # Port the console listens on and the Service exposes.
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # hosts: [{host: console.example.com, paths: [{path: /, pathType: Prefix}]}]
    hosts: []
    # tls: [{secretName: console-tls, hosts: [console.example.com]}]
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # PodDisruptionBudget for the console Deployment. Only rendered when
  # console.enabled and replicas > 1.
  pdb:
    enabled: true
    minAvailable: 1
