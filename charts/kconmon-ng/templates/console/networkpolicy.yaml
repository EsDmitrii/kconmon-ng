{{- if and .Values.console.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  podSelector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Browser / ingress-controller traffic to the console HTTP port.
    - ports:
        - protocol: TCP
          port: {{ .Values.console.service.port }}
  egress:
    # Console to controller HTTP API (topology).
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
    {{- if include "kconmon-ng.console.controllerGRPCAddr" . }}
    # Console to controller gRPC, gated on the resolved dial target.
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    {{- end }}
    {{- if eq .Values.console.valkey.mode "bundled" }}
    # Console to the bundled Valkey (pub/sub fan-out).
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: console-valkey
      ports:
        - protocol: TCP
          port: {{ .Values.console.valkey.port | int64 }}
    {{- else if eq .Values.console.valkey.mode "dependency" }}
    # Console to the Valkey subchart, selected by its own chart labels.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ include "kconmon-ng.console.valkeyDependencyPort" . | int64 }}
    {{- else if eq .Values.console.valkey.mode "external" }}
    # Console to an external Valkey, on the port inside console.valkey.address.
    {{- if .Values.console.networkPolicy.valkeyEgress }}
    {{- toYaml .Values.console.networkPolicy.valkeyEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ include "kconmon-ng.console.valkeyEgressPort" . | int64 }}
    {{- end }}
    {{- end }}
    {{- if eq .Values.console.database.mode "cnpg" }}
    # Console to the CNPG-managed PostgreSQL.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "kconmon-ng.console.databaseClusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- else if eq .Values.console.database.mode "external" }}
    # Console to an external PostgreSQL; tighten via console.networkPolicy.databaseEgress.
    {{- if .Values.console.networkPolicy.databaseEgress }}
    {{- toYaml .Values.console.networkPolicy.databaseEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    {{- if eq .Values.console.auth.mode "oidc" }}
    # Console to the OIDC IdP; ipBlock because an IdP is usually outside the cluster.
    {{- if .Values.console.networkPolicy.oidcEgress }}
    {{- toYaml .Values.console.networkPolicy.oidcEgress | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    # Console to Prometheus; tighten via console.networkPolicy.prometheusEgress.
    {{- if .Values.console.networkPolicy.prometheusEgress }}
    {{- toYaml .Values.console.networkPolicy.prometheusEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9090
    {{- end }}
    {{- if include "kconmon-ng.console.k8sIdentity" . }}
    # Console to the apiserver on 443 and 6443; tighten via console.networkPolicy.kubeAPIEgress.
    {{- if .Values.console.networkPolicy.kubeAPIEgress }}
    {{- toYaml .Values.console.networkPolicy.kubeAPIEgress | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- end }}
    {{- if eq (include "kconmon-ng.console.geoipMode" .) "auto" }}
    # geoipupdate sidecar downloading from MaxMind; tighten via console.networkPolicy.geoipEgress.
    {{- with .Values.console.networkPolicy.geoipEgress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
