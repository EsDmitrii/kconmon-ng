{{- if and .Values.console.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  podSelector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Browser / ingress-controller traffic to the console HTTP port.
    - ports:
        - protocol: TCP
          port: {{ .Values.console.service.port }}
  egress:
    # Console to controller HTTP API (topology).
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
    {{- if include "kconmon-ng.console.controllerGRPCAddr" . }}
    # Console to controller gRPC (EventStream.WatchEvents). Gated on the
    # RESOLVED dial target, not on controller.events.enabled: an explicit
    # console.controller.grpcAddr makes the console dial even with events off,
    # and egress missing there is a silent packet drop with no diagnostic.
    # The controller-side ingress half of this path lives in the shared root
    # templates/networkpolicy.yaml (correctly keyed on events.enabled — that is
    # the controller's own flag). Both layers are required for the in-cluster
    # case; a grpcAddr pointing outside this namespace is the operator's own
    # policy to write.
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    {{- end }}
    {{- if eq .Values.console.valkey.mode "bundled" }}
    # Console to the bundled Valkey (pub/sub fan-out).
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: console-valkey
      ports:
        - protocol: TCP
          port: {{ .Values.console.valkey.port | int64 }}
    {{- else if eq .Values.console.valkey.mode "external" }}
    # Console to an external Valkey. Namespace is deployment-specific; the
    # default allows the dialled port cluster-wide, tighten via
    # console.networkPolicy.valkeyEgress. The port comes from the port INSIDE
    # console.valkey.address, not console.valkey.port — see
    # kconmon-ng.console.valkeyEgressPort: console.valkey.port describes the
    # bundled listener, and opening it here would render a rule for a port
    # nothing dials. NOTE: for a Valkey outside the cluster this NetworkPolicy
    # is only one of two gates — the destination host's own firewall
    # (iptables/nftables/security group) must allow it too.
    {{- if .Values.console.networkPolicy.valkeyEgress }}
    {{- toYaml .Values.console.networkPolicy.valkeyEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ include "kconmon-ng.console.valkeyEgressPort" . | int64 }}
    {{- end }}
    {{- end }}
    {{- if eq .Values.console.database.mode "cnpg" }}
    # Console to the CNPG-managed PostgreSQL (event history, ADR-001). Precise
    # pod-selector rule: CNPG labels every instance Pod with cnpg.io/cluster.
    # The database-side ingress half lives in
    # templates/console/database-networkpolicy.yaml — both layers are required.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "kconmon-ng.console.databaseClusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- else if eq .Values.console.database.mode "external" }}
    # Console to an external PostgreSQL. Namespace/port are deployment-specific;
    # default allows TCP 5432 cluster-wide, tighten via
    # console.networkPolicy.databaseEgress. NOTE: for a database outside the
    # cluster this NetworkPolicy is only one of two gates — the destination
    # host's own firewall (iptables/nftables/security group) must allow it too.
    {{- if .Values.console.networkPolicy.databaseEgress }}
    {{- toYaml .Values.console.networkPolicy.databaseEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    {{- if eq .Values.console.auth.mode "oidc" }}
    # Console to the OIDC IdP (authorization-code + PKCE, SECURITY.md
    # §10.1: discovery, token exchange, and the lazy refresh in
    # OIDCAuthenticator.maybeRefresh). An IdP is almost always OUTSIDE the
    # cluster, so the default uses ipBlock 0.0.0.0/0 (a namespaceSelector
    # would match only in-cluster pods and silently drop every packet to an
    # external IdP -- discovery fails, the pod exits 1, CrashLoopBackOff);
    # tighten via console.networkPolicy.oidcEgress. A PUBLIC IdP also needs
    # egress to DNS to resolve its hostname (already allowed below). Same
    # two-layer warning as the valkey/database egress rules above: this
    # NetworkPolicy is only the CLUSTER-side gate. A cluster that ALSO
    # enforces a default-deny egress policy at the node/CNI layer (not just
    # via Kubernetes NetworkPolicy objects) must be checked and opened there
    # too, or the IdP stays unreachable even with this rule present.
    {{- if .Values.console.networkPolicy.oidcEgress }}
    {{- toYaml .Values.console.networkPolicy.oidcEgress | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    # Console to Prometheus (query API). Namespace/port are deployment-specific;
    # default allows TCP 9090 cluster-wide, tighten via console.networkPolicy.prometheusEgress.
    {{- if .Values.console.networkPolicy.prometheusEgress }}
    {{- toYaml .Values.console.networkPolicy.prometheusEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9090
    {{- end }}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
