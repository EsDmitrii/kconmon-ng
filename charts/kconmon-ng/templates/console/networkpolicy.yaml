{{- if and .Values.console.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  podSelector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Browser / ingress-controller traffic to the console HTTP port; empty ingressFrom means ANY source, because an ingress controller's namespace and labels cannot be guessed here.
    {{- with .Values.console.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.console.service.port }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.console.service.port }}
    {{- end }}
    {{- if .Values.networkPolicy.prometheusNamespace }}
    # Prometheus scraping, config.metricsPort only: this rule admits a whole namespace, and the API
    # port would undo the narrowing console.networkPolicy.ingressFrom expresses. A second rule, so
    # narrowing ingressFrom says nothing about Prometheus. Rendered only with
    # networkPolicy.prometheusNamespace set, like the agent and controller twins.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
        {{- with .Values.networkPolicy.prometheusPodLabels }}
        # Narrower still when the operator can name the scraper's pod labels.
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.metricsPort }}
    {{- end }}
  egress:
    # Console to controller HTTP API (topology).
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
    {{- if include "kconmon-ng.console.controllerGRPCAddr" . }}
    # Console to controller gRPC, gated on the resolved dial target.
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    {{- end }}
    {{- if include "kconmon-ng.console.hasRedis" . }}
    # Console to the Redis-compatible bus. The DSN lives in a Secret the chart never reads, so the
    # port cannot be derived here: 6379 is the default, and console.networkPolicy.redisEgress is
    # the override for anything else (a TLS endpoint, a sentinel quorum, a managed service).
    {{- if .Values.console.networkPolicy.redisEgress }}
    {{- toYaml .Values.console.networkPolicy.redisEgress | nindent 4 }}
    {{- else }}
    # Both peer kinds: a namespaceSelector selects PODS and can never match an ElastiCache endpoint.
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- end }}
    {{- if include "kconmon-ng.console.hasDatabase" . }}
    # Console to YOUR PostgreSQL; tighten via console.networkPolicy.databaseEgress.
    #
    # BOTH peer kinds: a namespaceSelector selects PODS, so on its own it can never match RDS,
    # Cloud SQL or anything else off-cluster, and the console would crash-loop on migrateOnStart.
    # ipBlock covers the off-cluster case; the selector stays for a database that lives in the
    # cluster (a CNPG or Percona cluster in another namespace).
    {{- if .Values.console.networkPolicy.databaseEgress }}
    {{- toYaml .Values.console.networkPolicy.databaseEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    {{- if eq .Values.console.auth.mode "oidc" }}
    # Console to the OIDC IdP: the ipBlock for an IdP outside the cluster, the selector for one served
    # by an in-cluster ingress controller on 443 (Cilium never matches a pod against an ipBlock).
    {{- if .Values.console.networkPolicy.oidcEgress }}
    {{- toYaml .Values.console.networkPolicy.oidcEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
        {{- include "kconmon-ng.offClusterIPBlock" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    # Console to Prometheus; tighten via console.networkPolicy.prometheusEgress.
    #
    # The port comes from console.prometheus.url, and the ipBlock covers a Prometheus outside the
    # cluster, which a namespaceSelector cannot match. The policy matches the pod port after the
    # Service DNAT, so a targetPort that differs from the URL's port needs prometheusTargetPort too.
    {{- if .Values.console.networkPolicy.prometheusEgress }}
    {{- toYaml .Values.console.networkPolicy.prometheusEgress | nindent 4 }}
    {{- else }}
    {{- $promPort := include "kconmon-ng.console.prometheusEgressPort" . | int }}
    {{- $promTargetPort := .Values.console.networkPolicy.prometheusTargetPort | default 0 | int }}
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ $promPort }}
        {{- if and $promTargetPort (ne $promTargetPort $promPort) }}
        - protocol: TCP
          port: {{ $promTargetPort }}
        {{- end }}
    {{- end }}
    {{- if include "kconmon-ng.console.k8sIdentity" . }}
    # Console to the apiserver on 443 and 6443; tighten via console.networkPolicy.kubeAPIEgress.
    {{- if .Values.console.networkPolicy.kubeAPIEgress }}
    {{- toYaml .Values.console.networkPolicy.kubeAPIEgress | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- end }}
    {{- if eq (include "kconmon-ng.console.geoipMode" .) "auto" }}
    # geoipupdate sidecar downloading from MaxMind; tighten via console.networkPolicy.geoipEgress.
    {{- with .Values.console.networkPolicy.geoipEgress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        {{- include "kconmon-ng.offClusterIPBlock" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    {{- if include "kconmon-ng.console.webhooksKeySecretName" . }}
    # Webhook delivery leaves the cluster; tighten via console.networkPolicy.webhookEgress.
    {{- with .Values.console.networkPolicy.webhookEgress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        {{- include "kconmon-ng.offClusterIPBlock" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    {{- end }}
    {{- end }}
    # DNS
    {{- include "kconmon-ng.dnsEgress" . | nindent 4 }}
{{- end }}
