{{- if and .Values.console.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  podSelector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Browser / ingress-controller traffic to the console HTTP port; empty ingressFrom means ANY source, because an ingress controller's namespace and labels cannot be guessed here.
    {{- with .Values.console.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.console.service.port }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.console.service.port }}
    {{- end }}
    {{- if and .Values.serviceMonitor.enabled .Values.networkPolicy.prometheusNamespace }}
    # Prometheus scraping the console's own /metrics.
    #
    # It is a SECOND rule rather than part of the one above, because the one above is the browser's
    # and an operator who narrows it to their ingress controller is not saying anything about
    # Prometheus. The main policy deliberately excludes the console from its own scrape rule
    # (component NotIn [console]), so without this the ServiceMonitor rendered beside it scraped a
    # port nothing could reach: up{job="…-console"} = 0, and every console metric — the audit drops,
    # the rate-limit counters, the ingester health — silently absent.
    #
    # config.metricsPort ONLY, never the API port.
    #
    # The console used to serve /metrics on its API port, so this rule had to open that port — and a
    # NetworkPolicy cannot say "this port, but only these paths". Admitting a scraper therefore
    # admitted everything else in the scraper's namespace (on a real cluster: Grafana,
    # node-exporter, kube-state-metrics, the operator) to the console's whole API, undoing exactly
    # the narrowing console.networkPolicy.ingressFrom exists to express. /metrics now has a listener
    # of its own and this rule opens that.
    #
    # RENDERED ONLY WITH networkPolicy.prometheusNamespace SET: with it unset the chart cannot name
    # the scraper's namespace, so it opens nothing and the scrape fails visibly (up = 0).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
        {{- with .Values.networkPolicy.prometheusPodLabels }}
        # Narrower still when the operator can name the scraper's pod labels — the same knob the
        # shared policy honours, which this rule used to ignore entirely.
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.metricsPort }}
    {{- end }}
  egress:
    # Console to controller HTTP API (topology).
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
    {{- if include "kconmon-ng.console.controllerGRPCAddr" . }}
    # Console to controller gRPC, gated on the resolved dial target.
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    {{- end }}
    {{- if include "kconmon-ng.console.hasRedis" . }}
    # Console to the Redis-compatible bus. The DSN lives in a Secret the chart never reads, so the
    # port cannot be derived here: 6379 is the default, and console.networkPolicy.redisEgress is
    # the override for anything else (a TLS endpoint, a sentinel quorum, a managed service).
    {{- if .Values.console.networkPolicy.redisEgress }}
    {{- toYaml .Values.console.networkPolicy.redisEgress | nindent 4 }}
    {{- else }}
    # Both peer kinds, for the same reason the external database rule above carries both: a
    # namespaceSelector selects PODS and can never match an ElastiCache endpoint.
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- end }}
    {{- if include "kconmon-ng.console.hasDatabase" . }}
    # Console to YOUR PostgreSQL; tighten via console.networkPolicy.databaseEgress.
    #
    # BOTH peer kinds: a namespaceSelector selects PODS, so on its own it can never match RDS,
    # Cloud SQL or anything else off-cluster, and the console would crash-loop on migrateOnStart.
    # ipBlock covers the off-cluster case; the selector stays for a database that lives in the
    # cluster (a CNPG or Percona cluster in another namespace).
    {{- if .Values.console.networkPolicy.databaseEgress }}
    {{- toYaml .Values.console.networkPolicy.databaseEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    {{- if eq .Values.console.auth.mode "oidc" }}
    # Console to the OIDC IdP; ipBlock because an IdP is usually outside the cluster.
    {{- if .Values.console.networkPolicy.oidcEgress }}
    {{- toYaml .Values.console.networkPolicy.oidcEgress | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    # Console to Prometheus; tighten via console.networkPolicy.prometheusEgress.
    #
    # The PORT comes from console.prometheus.url rather than a hardcoded 9090 (a Thanos on 10902 was
    # configured correctly and then blocked here), and the peer set carries an ipBlock as well as the
    # namespace selector, because a selector selects PODS and cannot match a Prometheus that lives
    # outside the cluster.
    {{- if .Values.console.networkPolicy.prometheusEgress }}
    {{- toYaml .Values.console.networkPolicy.prometheusEgress | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ include "kconmon-ng.console.prometheusEgressPort" . }}
    {{- end }}
    {{- if include "kconmon-ng.console.k8sIdentity" . }}
    # Console to the apiserver on 443 and 6443; tighten via console.networkPolicy.kubeAPIEgress.
    {{- if .Values.console.networkPolicy.kubeAPIEgress }}
    {{- toYaml .Values.console.networkPolicy.kubeAPIEgress | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- end }}
    {{- if eq (include "kconmon-ng.console.geoipMode" .) "auto" }}
    # geoipupdate sidecar downloading from MaxMind; tighten via console.networkPolicy.geoipEgress.
    {{- with .Values.console.networkPolicy.geoipEgress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    {{- if include "kconmon-ng.console.webhooksKeySecretName" . }}
    # Webhook delivery leaves the cluster; tighten via console.networkPolicy.webhookEgress.
    {{- with .Values.console.networkPolicy.webhookEgress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    {{- end }}
    {{- end }}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
