{{/* One chart-created Secret, with field values rendered verbatim so ${...} placeholders survive for an injector. */}}
{{- define "kconmon-ng.console.renderSecret" -}}
{{- $s := .secret -}}
{{- $data := dict -}}
{{- range $f := .fields }}
{{- $v := get $s $f.field | default "" }}
{{- if not $v }}
{{- fail (printf "%s.%s is empty but %s.create is true — that field is what the chart writes into the Secret (a literal or a ${...} placeholder)" $.path $f.field $.path) }}
{{- end }}
{{- $_ := set $data $f.key $v }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name | default .name }}
  labels:
    {{- include "kconmon-ng.labels" .ctx | nindent 4 }}
    app.kubernetes.io/component: console
    {{- with $s.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $s.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- /* QUOTED, one field at a time, rather than toYaml over the map. stringData is
         map[string]string to the apiserver: a value that YAML parses as a number — a MaxMind
         accountId is digits — renders bare and the apiserver rejects the whole Secret at apply time,
         after `helm template` was perfectly happy. `printf "%v" | quote` makes every value a string
         whatever it looked like in values.yaml. */}}
  {{- range $k, $v := $data }}
  {{ $k }}: {{ printf "%v" $v | quote }}
  {{- end }}
{{- end -}}
{{- if .Values.console.enabled }}
{{- /* Names come from the resolver helpers, so an existingSecret/create conflict fails before an empty field does. */}}
{{- $db := .Values.database }}
{{- if ($db.secret | default dict).create }}
{{- include "kconmon-ng.console.renderSecret" (dict "ctx" . "secret" $db.secret "path" "database.secret" "name" (include "kconmon-ng.console.databaseSecretName" .)
    "fields" (list (dict "field" "dsn" "key" $db.existingSecretKey))) }}
{{- end }}
{{- $local := .Values.console.auth.local }}
{{- if and (eq .Values.console.auth.mode "local") $local.bootstrapAdmin ($local.secret | default dict).create }}
{{- include "kconmon-ng.console.renderSecret" (dict "ctx" . "secret" $local.secret "path" "console.auth.local.secret" "name" (include "kconmon-ng.console.localAdminSecretName" .)
    "fields" (list (dict "field" "password" "key" $local.existingSecretKey))) }}
{{- end }}
{{- $oidc := .Values.console.auth.oidc }}
{{- if and (eq .Values.console.auth.mode "oidc") ($oidc.secret | default dict).create }}
{{- include "kconmon-ng.console.renderSecret" (dict "ctx" . "secret" $oidc.secret "path" "console.auth.oidc.secret" "name" (include "kconmon-ng.console.oidcClientSecretName" .)
    "fields" (list (dict "field" "clientSecret" "key" $oidc.existingSecretKey))) }}
{{- end }}
{{- $w := .Values.console.webhooks }}
{{- if ($w.secret | default dict).create }}
{{- include "kconmon-ng.console.renderSecret" (dict "ctx" . "secret" $w.secret "path" "console.webhooks.secret" "name" (include "kconmon-ng.console.webhooksKeySecretName" .)
    "fields" (list (dict "field" "encryptionKey" "key" (include "kconmon-ng.console.webhooksKeyName" .)))) }}
{{- end }}
{{- $r := .Values.redis }}
{{- if ($r.secret | default dict).create }}
{{- include "kconmon-ng.console.renderSecret" (dict "ctx" . "secret" $r.secret "path" "redis.secret" "name" (include "kconmon-ng.console.redisSecretName" .)
    "fields" (list (dict "field" "dsn" "key" $r.existingSecretKey))) }}
{{- end }}
{{- $geoip := .Values.console.mtr.enrichment.geoip }}
{{- if and (eq (include "kconmon-ng.console.geoipMode" .) "auto") ($geoip.secret | default dict).create }}
{{- include "kconmon-ng.console.renderSecret" (dict "ctx" . "secret" $geoip.secret "path" "console.mtr.enrichment.geoip.secret" "name" (include "kconmon-ng.console.geoipSecretName" .)
    "fields" (list (dict "field" "accountId" "key" $geoip.accountIdKey) (dict "field" "licenseKey" "key" $geoip.licenseKeyKey))) }}
{{- end }}

{{- end }}
