{{- if and .Values.console.enabled .Values.networkPolicy.enabled (eq .Values.console.database.mode "cnpg") }}
{{- $cluster := include "kconmon-ng.console.databaseClusterName" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $cluster }}
  policyTypes:
    - Ingress
  ingress:
    # Console to PostgreSQL; the egress half lives in the console policy.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: console
      ports:
        - protocol: TCP
          port: 5432
    # Instance-to-instance replication and instance-manager probes; HA breaks without it.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $cluster }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    # Prometheus scraping of the CNPG instance-manager metrics endpoint.
    - from:
        {{- if .Values.networkPolicy.prometheusNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 9187
    # Some installs also need ingress from the CNPG operator's own namespace.
{{- end }}
