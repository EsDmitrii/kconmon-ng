{{- if .Values.console.enabled }}
{{- /* Keyed on the RESOLVED gRPC address, not the raw events flag, for the
same reason as the console egress rule: an explicit grpcAddr with
events.enabled=false is still realtime-on-with-no-bus, exactly what this
guard exists to reject. */}}
{{- if and (include "kconmon-ng.console.controllerGRPCAddr" .) (eq .Values.console.valkey.mode "disabled") (gt (int .Values.console.replicas) 1) }}
{{- fail "realtime events with console.valkey.mode=disabled require console.replicas=1 (the in-process bus has no cross-replica fan-out, ADR-002): set console.valkey.mode=bundled|external or console.replicas=1" }}
{{- end }}
{{- /* Keyed on the RESOLVED auth mode: sessions for local/oidc live in
Valkey (DATA.md §5.3), not the in-process KV, once more than one replica is
running -- same shape as the realtime guard above, one mode set instead of
one flag. */}}
{{- if and (has .Values.console.auth.mode (list "local" "oidc")) (eq .Values.console.valkey.mode "disabled") (gt (int .Values.console.replicas) 1) }}
{{- fail "auth.mode=local|oidc with console.valkey.mode=disabled requires console.replicas=1 (sessions live in Valkey per DATA.md §5.3; the in-process KV has no cross-replica visibility, so a browser load-balanced to another replica would be logged out at random): set console.valkey.mode=bundled|external or console.replicas=1" }}
{{- end }}
{{- /* Keyed on the RESOLVED auth mode: local/oidc store users, tokens and
the audit log in PostgreSQL (SECURITY.md §10.1), so a database is not
optional the way it is for anonymous/header. */}}
{{- if and (has .Values.console.auth.mode (list "local" "oidc")) (eq .Values.console.database.mode "disabled") }}
{{- fail "auth.mode=local|oidc requires console.database.mode=cnpg|external (users, tokens and the audit log live in PostgreSQL, SECURITY.md §10.1)" }}
{{- end }}
{{- /* Keyed on the RESOLVED trustedProxyCIDRs list: an empty list in header
mode would make an unauthenticated request header an authentication bypass
(SECURITY.md §10.1's "explicit opt-in"), so rendering fails rather than
shipping that. */}}
{{- if and (eq .Values.console.auth.mode "header") (not .Values.console.auth.header.trustedProxyCIDRs) }}
{{- fail "auth.mode=header requires a non-empty console.auth.header.trustedProxyCIDRs: without it any client could set X-Remote-User and authenticate as anyone" }}
{{- end }}
{{- /* Keyed on the RESOLVED geoip configuration (M5): a geoip path names a file
inside the /geoip mount, and the chart has no other way to put a file there.
Without the volume source the console would boot, warn once and run with geoip
silently off -- exactly the quiet degradation the other guards above refuse. */}}
{{- if and .Values.console.mtr.enrichment.enabled (or .Values.console.mtr.enrichment.geoip.asnPath .Values.console.mtr.enrichment.geoip.cityPath) (not .Values.console.mtr.enrichment.geoip.volume) }}
{{- fail "console.mtr.enrichment.geoip.asnPath/cityPath are set but console.mtr.enrichment.geoip.volume is empty: the chart mounts that volume read-only at /geoip and nothing else puts the mmdb files there, so the console would start with geoip disabled and only a warning to say so" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
data:
  config.yaml: |
    httpPort: {{ .Values.console.service.port }}
    logLevel: {{ .Values.config.logLevel | quote }}
    logFormat: {{ .Values.config.logFormat | quote }}
    metricsPrefix: {{ .Values.config.metricsPrefix | quote }}
    auth:
      mode: {{ .Values.console.auth.mode | quote }}
      anonymous:
        role: {{ .Values.console.auth.anonymous.role | quote }}
      defaultRole: {{ .Values.console.auth.defaultRole | quote }}
      {{- if eq .Values.console.auth.mode "local" }}
      local:
        bootstrapAdmin: {{ .Values.console.auth.local.bootstrapAdmin | quote }}
        {{- if .Values.console.auth.local.bootstrapAdmin }}
        {{- /* Forces the existingSecret guard (kconmon-ng.console.localAdminSecretName)
        to run even though its result is only used for the volume mount below,
        not here -- rendering must fail at THIS point, not silently produce a
        bootstrapAdminPasswordFile no Secret backs. */}}
        {{- $_ := include "kconmon-ng.console.localAdminSecretName" . }}
        bootstrapAdminPasswordFile: "/etc/kconmon-ng-console-secrets/local-admin-password"
        {{- end }}
      {{- end }}
      {{- if eq .Values.console.auth.mode "header" }}
      header:
        userHeader: {{ .Values.console.auth.header.userHeader | quote }}
        groupsHeader: {{ .Values.console.auth.header.groupsHeader | quote }}
        groupsDelimiter: {{ .Values.console.auth.header.groupsDelimiter | quote }}
        trustedProxyCIDRs:
          {{- toYaml .Values.console.auth.header.trustedProxyCIDRs | nindent 10 }}
      {{- end }}
      {{- if eq .Values.console.auth.mode "oidc" }}
      {{- /* Forces the existingSecret guard (kconmon-ng.console.oidcClientSecretName). */}}
      {{- $_ := include "kconmon-ng.console.oidcClientSecretName" . }}
      oidc:
        issuer: {{ .Values.console.auth.oidc.issuer | quote }}
        clientID: {{ .Values.console.auth.oidc.clientID | quote }}
        clientSecretFile: "/etc/kconmon-ng-console-secrets/oidc-client-secret"
        redirectURL: {{ .Values.console.auth.oidc.redirectURL | quote }}
        scopes:
          {{- toYaml .Values.console.auth.oidc.scopes | nindent 10 }}
        usernameClaim: {{ .Values.console.auth.oidc.usernameClaim | quote }}
        groupsClaim: {{ .Values.console.auth.oidc.groupsClaim | quote }}
      {{- end }}
      session:
        ttl: {{ .Values.console.auth.session.ttl | quote }}
        cookieName: {{ .Values.console.auth.session.cookieName | quote }}
        secure: {{ .Values.console.auth.session.secure }}
    controller:
      {{- if .Values.console.controller.url }}
      url: {{ .Values.console.controller.url | quote }}
      {{- else }}
      url: "http://{{ include "kconmon-ng.fullname" . }}-controller:{{ .Values.config.httpPort }}"
      {{- end }}
      timeout: {{ .Values.console.controller.timeout | quote }}
      grpcAddr: {{ include "kconmon-ng.console.controllerGRPCAddr" . | quote }}
    prometheus:
      url: {{ .Values.console.prometheus.url | quote }}
      queryTimeout: {{ .Values.console.prometheus.queryTimeout | quote }}
      maxRange: {{ .Values.console.prometheus.maxRange | quote }}
      maxResponseBytes: {{ .Values.console.prometheus.maxResponseBytes | int64 }}
    valkey:
      address: {{ include "kconmon-ng.console.valkeyAddress" . | quote }}
      dialTimeout: {{ .Values.console.valkey.dialTimeout | quote }}
    {{- if ne .Values.console.database.mode "disabled" }}
    database:
      dsnFile: "/etc/kconmon-ng-console-secrets/database-dsn"
      maxConns: {{ .Values.console.database.maxConns | int }}
      connectTimeout: {{ .Values.console.database.connectTimeout | quote }}
      migrateOnStart: {{ .Values.console.database.migrateOnStart }}
      retentionDays: {{ .Values.console.database.retentionDays | int }}
    {{- end }}
    rateLimit:
      runsPerMinute: {{ .Values.console.rateLimit.runsPerMinute | int }}
      loginPerMinute: {{ .Values.console.rateLimit.loginPerMinute | int }}
    {{- /* Emitted only when ON. SchedulerConfig.Enabled's Go zero value makes
    an omitted block identical to an explicit false, and a tickInterval in a
    rendered config nothing reads is noise an operator has to reason about.
    The one gate covers all three consumers: the schedule loop, the stuck-run
    reaper, and the continuous external-check reconciler, which share this flag
    and the same PostgreSQL advisory lock. */}}
    {{- if .Values.console.scheduler.enabled }}
    scheduler:
      enabled: true
      tickInterval: {{ .Values.console.scheduler.tickInterval | quote }}
    {{- end }}
    {{- /* Emitted only when ON, for the reason config.checkers.external is:
    console config.Load parses with KnownFields(true) (config.go:515) and a
    pre-M5 console image has no MTRConfig field at all, so an unconditional
    block would crashloop the OLD Pod while the Deployment rolls. THIS build
    would accept it -- mtr.* is a known field here -- which is precisely why the
    gate has to be justified by the rolling image rather than by this one.
    Off by default also keeps the default render key-identical to chart
    1.6.0's. The sub-gates are the binary's own: rdns and geoip switch
    independently, an empty geoip path is that source off, and enabled with
    every source off is a startup error, not a silent no-op. */}}
    {{- if .Values.console.mtr.enrichment.enabled }}
    mtr:
      enrichment:
        enabled: true
        rdns:
          enabled: {{ .Values.console.mtr.enrichment.rdns.enabled }}
          timeoutMs: {{ .Values.console.mtr.enrichment.rdns.timeoutMs | int }}
        geoip:
          asnPath: {{ .Values.console.mtr.enrichment.geoip.asnPath | quote }}
          cityPath: {{ .Values.console.mtr.enrichment.geoip.cityPath | quote }}
        ttl: {{ .Values.console.mtr.enrichment.ttl | quote }}
    {{- end }}
    {{- /* M6 Kubernetes event capture. Emitted only when ON, for the reason
    mtr above is: config.Load parses with KnownFields(true) and a pre-M6 console
    image has no kubernetesContext field, so an unconditional block would
    crashloop the OLD Pod while the Deployment rolls. Off by default also keeps
    the default render key-identical to chart 1.7.0's.

    NOT guarded against database.mode=disabled, unlike auth.mode=local|oidc
    above: the console's own posture there is a warning and a skipped reader
    (cmd/console), because captured events live in PostgreSQL and having
    nowhere to put them is a degraded feature, not an unsafe one. The chart
    does not get to be stricter than the binary about a knob the binary
    already reports on. Same reasoning for the empty namespace: the console
    resolves it from POD_NAMESPACE, which the Deployment sets under this same
    gate. */}}
    {{- if .Values.console.kubernetesContext.enabled }}
    kubernetesContext:
      enabled: true
      namespace: {{ .Values.console.kubernetesContext.namespace | quote }}
      resyncInterval: {{ .Values.console.kubernetesContext.resyncInterval | quote }}
    {{- end }}
    {{- /* M6 webhook secret encryption. encryptionKeyFile, never encryptionKey:
    the file comes out of the projected Secret volume the DSN already uses, and
    the inline form would put 32 bytes of key material in a ConfigMap. The
    console refuses a config that sets both, so only ever one is emitted.
    Absent when no Secret is named -- that is the keyless state, where create
    and test answer 503 and every other webhook route keeps working. */}}
    {{- with (include "kconmon-ng.console.webhooksKeySecretName" .) }}
    webhooks:
      encryptionKeyFile: "/etc/kconmon-ng-console-secrets/webhooks-encryption-key"
    {{- end }}
{{- end }}
