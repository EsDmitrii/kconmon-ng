{{- if .Values.console.enabled }}
{{- /* Auth-mode prerequisites first: they hold at any replica count, so they name the root cause. */}}
{{- /* An empty trustedProxyCIDRs in header mode would be an authentication bypass. */}}
{{- if and (eq .Values.console.auth.mode "header") (not .Values.console.auth.header.trustedProxyCIDRs) }}
{{- fail "auth.mode=header requires a non-empty console.auth.header.trustedProxyCIDRs: without it any client could set X-Remote-User and authenticate as anyone" }}
{{- end }}
{{- /* Keyed on the resolved auth mode: local/oidc need PostgreSQL. */}}
{{- if and (has .Values.console.auth.mode (list "local" "oidc")) (not (include "kconmon-ng.console.hasDatabase" .)) }}
{{- fail "auth.mode=local|oidc requires a database (users, tokens and the audit log live in PostgreSQL): set database.existingSecret to a Secret holding a postgres:// DSN, or database.secret.create=true" }}
{{- end }}
{{- /* Keyed on the resolved auth mode: local/oidc sessions need Valkey past one replica. */}}
{{- if and (has .Values.console.auth.mode (list "local" "oidc")) (not (include "kconmon-ng.console.hasRedis" .)) (gt (int .Values.console.replicas) 1) }}
{{- fail "auth.mode=local|oidc with no Redis-compatible bus requires console.replicas=1 (sessions live in that bus; the in-process KV has no cross-replica visibility, so a browser load-balanced to another replica would be logged out at random): set redis.existingSecret to a Secret holding a redis:// DSN, or console.replicas=1" }}
{{- end }}
{{- /* Keyed on the resolved gRPC address: an explicit grpcAddr is still realtime-on. */}}
{{- if and (include "kconmon-ng.console.controllerGRPCAddr" .) (not (include "kconmon-ng.console.hasRedis" .)) (gt (int .Values.console.replicas) 1) }}
{{- fail "realtime events with no Redis-compatible bus require console.replicas=1 (the in-process bus has no cross-replica fan-out): set redis.existingSecret to a Secret holding a redis:// DSN, or console.replicas=1" }}
{{- end }}
{{- /* mode=volume must actually supply a volume, or geoip would be silently off. */}}
{{- if and (eq (include "kconmon-ng.console.geoipMode" .) "volume") (not .Values.console.mtr.enrichment.geoip.volume) }}
{{- fail "console.mtr.enrichment.geoip.mode=volume requires console.mtr.enrichment.geoip.volume: the chart mounts that VolumeSource read-only at /geoip and nothing else puts the mmdb files there. Use mode=auto to have the chart run maxmind/geoipupdate for you" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
data:
  config.yaml: |
    httpPort: {{ .Values.console.service.port }}
    metricsPort: {{ .Values.config.metricsPort }}
    logLevel: {{ .Values.config.logLevel | quote }}
    logFormat: {{ .Values.config.logFormat | quote }}
    metricsPrefix: {{ .Values.config.metricsPrefix | quote }}
    auth:
      mode: {{ .Values.console.auth.mode | quote }}
      anonymous:
        role: {{ .Values.console.auth.anonymous.role | quote }}
      defaultRole: {{ .Values.console.auth.defaultRole | quote }}
      {{- if eq .Values.console.auth.mode "local" }}
      local:
        bootstrapAdmin: {{ .Values.console.auth.local.bootstrapAdmin | quote }}
        {{- if .Values.console.auth.local.bootstrapAdmin }}
        {{- /* Forces the existingSecret guard to run here, so rendering fails at this point. */}}
        {{- $_ := include "kconmon-ng.console.localAdminSecretName" . }}
        bootstrapAdminPasswordFile: "/etc/kconmon-ng-console-secrets/local-admin-password"
        {{- end }}
      {{- end }}
      {{- if eq .Values.console.auth.mode "header" }}
      header:
        userHeader: {{ .Values.console.auth.header.userHeader | quote }}
        groupsHeader: {{ .Values.console.auth.header.groupsHeader | quote }}
        groupsDelimiter: {{ .Values.console.auth.header.groupsDelimiter | quote }}
        trustedProxyCIDRs:
          {{- toYaml .Values.console.auth.header.trustedProxyCIDRs | nindent 10 }}
      {{- end }}
      {{- if eq .Values.console.auth.mode "oidc" }}
      {{- /* Forces the existingSecret guard (kconmon-ng.console.oidcClientSecretName). */}}
      {{- $_ := include "kconmon-ng.console.oidcClientSecretName" . }}
      oidc:
        issuer: {{ .Values.console.auth.oidc.issuer | quote }}
        clientID: {{ .Values.console.auth.oidc.clientID | quote }}
        clientSecretFile: "/etc/kconmon-ng-console-secrets/oidc-client-secret"
        {{- /* PARSED the way the console parses it, not matched with a regular expression.
               internal/console/config validates this with url.Parse plus a suffix test, and the pod
               exits(1) on a value that fails either -- CrashLoopBackOff on a fresh OIDC install,
               which `helm template` and `helm lint` both called green, and which the chart's own CI
               values file used to ship. A regex is not a URL parser: the first cut of this guard
               refused HTTPS:// (schemes are case-insensitive and url.Parse lowercases them) while
               still blessing values like "a^b.example.com" that url.Parse rejects. urlParse gives
               the same three answers the console reads, so the two agree by construction. The
               SUFFIX is tested against the whole string, exactly as the console does -- that is why
               a query string fails here too. */}}
        {{- $redirect := .Values.console.auth.oidc.redirectURL | toString }}
        {{- $u := urlParse $redirect }}
        {{- if or (not (has $u.scheme (list "http" "https"))) (eq $u.host "") (not (hasSuffix "/api/v1/auth/oidc/callback" $redirect)) }}
        {{- fail (printf "console.auth.oidc.redirectURL must be an absolute http(s) URL ending with /api/v1/auth/oidc/callback (got %q) -- the console refuses to start otherwise. Register that exact URL with your IdP." $redirect) }}
        {{- end }}
        redirectURL: {{ $redirect | quote }}
        scopes:
          {{- toYaml .Values.console.auth.oidc.scopes | nindent 10 }}
        usernameClaim: {{ .Values.console.auth.oidc.usernameClaim | quote }}
        groupsClaim: {{ .Values.console.auth.oidc.groupsClaim | quote }}
      {{- end }}
      session:
        ttl: {{ .Values.console.auth.session.ttl | quote }}
        idleTimeout: {{ .Values.console.auth.session.idleTimeout | quote }}
        cookieName: {{ .Values.console.auth.session.cookieName | quote }}
        secure: {{ .Values.console.auth.session.secure }}
    controller:
      {{- if .Values.console.controller.url }}
      url: {{ .Values.console.controller.url | quote }}
      {{- else }}
      url: "http://{{ include "kconmon-ng.controller.fullname" . }}:{{ .Values.config.httpPort }}"
      {{- end }}
      timeout: {{ .Values.console.controller.timeout | quote }}
      grpcAddr: {{ include "kconmon-ng.console.controllerGRPCAddr" . | quote }}
    prometheus:
      url: {{ .Values.console.prometheus.url | quote }}
      queryTimeout: {{ .Values.console.prometheus.queryTimeout | quote }}
      maxRange: {{ .Values.console.prometheus.maxRange | quote }}
      maxResponseBytes: {{ .Values.console.prometheus.maxResponseBytes | int64 }}
    redis:
      {{- if include "kconmon-ng.console.hasRedis" . }}
      dsnFile: "/etc/kconmon-ng-console-secrets/redis-dsn"
      {{- end }}
      dialTimeout: {{ .Values.redis.dialTimeout | quote }}
    {{- if include "kconmon-ng.console.hasDatabase" . }}
    database:
      dsnFile: "/etc/kconmon-ng-console-secrets/database-dsn"
      maxConns: {{ .Values.database.maxConns | int }}
      connectTimeout: {{ .Values.database.connectTimeout | quote }}
      migrateOnStart: {{ .Values.database.migrateOnStart }}
      retentionDays: {{ .Values.database.retentionDays | int }}
    {{- end }}
    rateLimit:
      runsPerMinute: {{ .Values.console.rateLimit.runsPerMinute | int }}
      loginPerMinute: {{ .Values.console.rateLimit.loginPerMinute | int }}
      promqlPerMinute: {{ .Values.console.rateLimit.promqlPerMinute | int }}
    {{- /* Emitted only when ON; the one gate covers all three consumers. */}}
    {{- if .Values.console.scheduler.enabled }}
    scheduler:
      enabled: true
      tickInterval: {{ .Values.console.scheduler.tickInterval | quote }}
    {{- end }}
    {{- /* Emitted only when ON: a pre-M5 console image would crashloop on an unknown key. */}}
    {{- if .Values.console.mtr.enrichment.enabled }}
    {{- /* The console REFUSES this config at boot ("every source is off") and CrashLoopBackOffs, so
           the chart says so at render time — the same treatment the two geoip misconfigurations get. */}}
    {{- if and (not .Values.console.mtr.enrichment.rdns.enabled) (not (include "kconmon-ng.console.geoipEnabled" .)) }}
    {{- fail "console.mtr.enrichment.enabled=true with every source off: set console.mtr.enrichment.rdns.enabled=true and/or console.mtr.enrichment.geoip.mode=auto|volume" }}
    {{- end }}
    mtr:
      enrichment:
        enabled: true
        rdns:
          enabled: {{ .Values.console.mtr.enrichment.rdns.enabled }}
          timeoutMs: {{ .Values.console.mtr.enrichment.rdns.timeoutMs | int }}
        geoip:
          asnPath: {{ include "kconmon-ng.console.geoipPath" (dict "ctx" . "edition" "GeoLite2-ASN" "override" .Values.console.mtr.enrichment.geoip.asnPath) | quote }}
          cityPath: {{ include "kconmon-ng.console.geoipPath" (dict "ctx" . "edition" "GeoLite2-City" "override" .Values.console.mtr.enrichment.geoip.cityPath) | quote }}
          {{- /* Emitted only for an image that knows the key: the console rejects unknown fields. */}}
          {{- if and (include "kconmon-ng.console.geoipEnabled" .) (include "kconmon-ng.console.supports" (dict "ctx" . "since" "2.0.0")) }}
          reloadInterval: {{ .Values.console.mtr.enrichment.geoip.reloadInterval | quote }}
          {{- end }}
        ttl: {{ .Values.console.mtr.enrichment.ttl | quote }}
    {{- end }}
    {{- /* Emitted only when ON; a missing database is the binary's own warn-and-skip. */}}
    {{- if .Values.console.kubernetesContext.enabled }}
    kubernetesContext:
      enabled: true
      namespace: {{ .Values.console.kubernetesContext.namespace | quote }}
      resyncInterval: {{ .Values.console.kubernetesContext.resyncInterval | quote }}
    {{- end }}
    {{- /* encryptionKeyFile, never an inline key: a ConfigMap must not hold key material. */}}
    {{- with (include "kconmon-ng.console.webhooksKeySecretName" .) }}
    webhooks:
      encryptionKeyFile: "/etc/kconmon-ng-console-secrets/webhooks-encryption-key"
      {{- /* Emitted only with a webhook key AND alerting on, the pair config.validate requires. */}}
      {{- if $.Values.console.alerting.enabled }}
      alertPollInterval: {{ $.Values.console.webhooks.alertPollInterval | quote }}
      {{- end }}
    {{- end }}
    {{- /* Emitted only when ON; without a database the binary skips the reconciler. */}}
    {{- if .Values.console.alerting.enabled }}
    {{- /* Only when THIS chart renders the Role. With rbac.create=false the operator manages RBAC
           themselves — that is the whole point of the switch — and may well have created the
           prometheusrules Role in the namespace they named, so refusing to render told them the
           chart's Role would 403 when the chart renders no Role at all. */}}
    {{- if and .Values.rbac.create .Values.console.alerting.namespace (ne .Values.console.alerting.namespace .Release.Namespace) }}
    {{- fail (printf "console.alerting.namespace=%q but the chart renders the prometheusrules Role into %q — the reconciler would get a permanent 403. Leave it empty to use the release namespace, or install the chart into %q" .Values.console.alerting.namespace .Release.Namespace .Values.console.alerting.namespace) }}
    {{- end }}
    alerting:
      enabled: true
      namespace: {{ .Values.console.alerting.namespace | quote }}
      syncInterval: {{ .Values.console.alerting.syncInterval | quote }}
      bundleName: {{ .Values.console.alerting.bundleName | quote }}
    {{- end }}
{{- end }}
