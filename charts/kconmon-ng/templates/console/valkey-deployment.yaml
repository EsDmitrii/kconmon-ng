{{- if and .Values.console.enabled (eq .Values.console.valkey.mode "bundled") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kconmon-ng.console.valkeyFullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-valkey
spec:
  replicas: 1
  # Recreate: two overlapping Pods would split pub/sub between them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console-valkey
  template:
    metadata:
      labels:
        {{- include "kconmon-ng.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console-valkey
    spec:
      automountServiceAccountToken: false
      {{- with .Values.console.valkey.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: valkey
          image: "{{ .Values.console.valkey.image.repository }}:{{ .Values.console.valkey.image.tag }}"
          {{- with .Values.console.valkey.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.console.valkey.image.pullPolicy }}
          # Persistence fully off (ADR-002), so there is no writable data dir and no PVC.
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --port
            - {{ .Values.console.valkey.port | int64 | quote }}
          ports:
            - name: valkey
              containerPort: {{ .Values.console.valkey.port | int64 }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.console.valkey.resources | nindent 12 }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
