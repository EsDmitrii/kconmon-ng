{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/console/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/console/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "kconmon-ng.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      {{- $geoip := .Values.console.mtr.enrichment.geoip }}
      {{- if and (include "kconmon-ng.console.geoipEnabled" .) (eq (include "kconmon-ng.console.geoipMode" .) "auto") }}
      # NATIVE SIDECAR (k8s 1.29+): an initContainer with restartPolicy Always starts BEFORE the
      # console and keeps running, so /geoip is populated before the first lookup instead of an hour later.
      initContainers:
        # Keeps /geoip fresh; the console reloads a changed file on its own (geoip.reloadInterval).
        - name: geoipupdate
          restartPolicy: Always
          image: "{{ $geoip.image.repository }}:{{ $geoip.image.tag }}"
          imagePullPolicy: {{ $geoip.image.pullPolicy }}
          {{- with $geoip.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: GEOIPUPDATE_EDITION_IDS
              value: {{ join " " $geoip.editions | quote }}
            - name: GEOIPUPDATE_FREQUENCY
              value: {{ $geoip.updateIntervalHours | int | quote }}
            - name: GEOIPUPDATE_DB_DIR
              value: /geoip
            - name: GEOIPUPDATE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "kconmon-ng.console.geoipSecretName" . }}
                  key: {{ $geoip.accountIdKey }}
            - name: GEOIPUPDATE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kconmon-ng.console.geoipSecretName" . }}
                  key: {{ $geoip.licenseKeyKey }}
          volumeMounts:
            - name: geoip
              mountPath: /geoip
          resources:
            {{- toYaml $geoip.resources | nindent 12 }}
      {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- /* fsGroup is what lets the nonroot process read the 0440 projected Secret files, so it
             drops when there is no such volume -- but runAsNonRoot and the rest of the context are
             what a restricted-PSS namespace admits the pod on, and they stay either way. */}}
      {{- $psc := .Values.console.podSecurityContext }}
      {{- if not (include "kconmon-ng.console.secretsVolumeEnabled" .) }}
      {{- $psc = omit ($psc | default dict) "fsGroup" }}
      {{- end }}
      {{- with $psc }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* A console-only ServiceAccount, only when a feature needs an identity. */}}
      {{- if include "kconmon-ng.console.k8sIdentity" . }}
      serviceAccountName: {{ include "kconmon-ng.console.serviceAccountName" . }}
      {{- else }}
      # No feature here calls the apiserver, so the pod gets no token.
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.console.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.console.service.port }}
              protocol: TCP
            # /metrics and the health endpoints, on a listener of their OWN: the API port serves the
            # whole Console API, and a NetworkPolicy cannot admit a scraper to one path only.
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              protocol: TCP
          env:
            - name: KCONMON_NG_CONSOLE_CONFIG
              value: /etc/kconmon-ng-console/config.yaml
            {{- /* Fallback for an empty kubernetesContext/alerting namespace. */}}
            {{- if include "kconmon-ng.console.k8sIdentity" . }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kconmon-ng-console
              readOnly: true
            {{- if include "kconmon-ng.console.secretsVolumeEnabled" . }}
            # A sibling directory, not a nested one: a mountpoint cannot be created inside a read-only mount.
            - name: database-dsn
              mountPath: /etc/kconmon-ng-console-secrets
              readOnly: true
            {{- end }}
            {{- /* /geoip is fixed, so it cannot drift from the paths in the ConfigMap. */}}
            {{- if include "kconmon-ng.console.geoipEnabled" . }}
            - name: geoip
              mountPath: /geoip
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kconmon-ng.console.fullname" . }}
        {{- if include "kconmon-ng.console.secretsVolumeEnabled" . }}
        # Secrets are referenced by name only and read once at boot.
        - name: database-dsn
          projected:
            defaultMode: 0440
            sources:
              {{- if include "kconmon-ng.console.hasDatabase" . }}
              - secret:
                  name: {{ include "kconmon-ng.console.databaseSecretName" . }}
                  items:
                    - key: {{ include "kconmon-ng.console.databaseSecretKey" . }}
                      path: database-dsn
              {{- end }}
              {{- /* Path must match webhooks.encryptionKeyFile in configmap.yaml. */}}
              {{- with (include "kconmon-ng.console.webhooksKeySecretName" .) }}
              - secret:
                  name: {{ . }}
                  items:
                    - key: {{ include "kconmon-ng.console.webhooksKeyName" $ }}
                      path: webhooks-encryption-key
              {{- end }}
              {{- /* Path must match redis.dsnFile in configmap.yaml. */}}
              {{- with (include "kconmon-ng.console.redisSecretName" .) }}
              - secret:
                  name: {{ . }}
                  items:
                    - key: {{ $.Values.redis.existingSecretKey }}
                      path: redis-dsn
              {{- end }}
              {{- if and (eq .Values.console.auth.mode "local") .Values.console.auth.local.bootstrapAdmin }}
              - secret:
                  name: {{ include "kconmon-ng.console.localAdminSecretName" . }}
                  items:
                    - key: {{ .Values.console.auth.local.existingSecretKey }}
                      path: local-admin-password
              {{- end }}
              {{- if eq .Values.console.auth.mode "oidc" }}
              - secret:
                  name: {{ include "kconmon-ng.console.oidcClientSecretName" . }}
                  items:
                    - key: {{ .Values.console.auth.oidc.existingSecretKey }}
                      path: oidc-client-secret
              {{- end }}
        {{- end }}
        {{- if include "kconmon-ng.console.geoipEnabled" . }}
        - name: geoip
          {{- if eq (include "kconmon-ng.console.geoipMode" .) "auto" }}
          # The sidecar owns this directory; losing it on a restart costs one download.
          emptyDir: {}
          {{- else }}
          {{- /* An opaque VolumeSource spliced in verbatim; the API server validates it. */}}
          {{- toYaml .Values.console.mtr.enrichment.geoip.volume | nindent 10 }}
          {{- end }}
        {{- end }}
{{- end }}
