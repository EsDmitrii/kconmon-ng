{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/console/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "kconmon-ng.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Keyed on the projected Secret volume, not on the database alone
      (M6): fsGroup is what lets the nonroot process read a 0440 file the
      kubelet wrote root-owned, and the webhook encryption key is the first
      such file that does not imply a database. Without this the key-with-no-
      database deployment mounts a file the console cannot open, and an
      unreadable encryptionKeyFile is FATAL. */}}
      {{- if and (include "kconmon-ng.console.secretsVolumeEnabled" .) .Values.console.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.console.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- /* M6: the console gets a Kubernetes identity ONLY when the event
      reader is on -- see kconmon-ng.console.serviceAccountName for why this is
      a console-only SA and not the agent/controller one. With the reader off
      this key is absent and the Pod runs as the namespace `default` SA, which
      is exactly what every release up to chart 1.7.0 did. */}}
      {{- if .Values.console.kubernetesContext.enabled }}
      serviceAccountName: {{ include "kconmon-ng.console.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.console.service.port }}
              protocol: TCP
          env:
            - name: KCONMON_NG_CONSOLE_CONFIG
              value: /etc/kconmon-ng-console/config.yaml
            {{- /* M6: identity, not configuration -- which is why it is its own
            env var and not a templated kubernetesContext.namespace. The console
            reads it ONLY as the fallback for an empty
            console.kubernetesContext.namespace, so "the namespace this release
            runs in" needs no value at all and cannot drift from where the Pod
            actually is. Rendered under the reader's own gate: nothing else
            reads it. */}}
            {{- if .Values.console.kubernetesContext.enabled }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kconmon-ng-console
              readOnly: true
            {{- if include "kconmon-ng.console.secretsVolumeEnabled" . }}
            # Deliberately NOT nested under /etc/kconmon-ng-console: the
            # runtime cannot create a mountpoint inside an already-mounted
            # read-only volume (CreateContainerError). dsnFile in the rendered
            # config.yaml points here, and so do
            # auth.local.bootstrapAdminPasswordFile / auth.oidc.clientSecretFile
            # below (Task 18) -- one sibling directory, one mount, multiple
            # projected Secret sources; the same CreateContainerError reasoning
            # rules out a THIRD mountPath nested under /etc/kconmon-ng-console
            # for those two files. M6 adds webhooks.encryptionKeyFile as a
            # fourth source on the same mount -- and the FIRST one that does
            # not imply a database, which is why the gate is
            # kconmon-ng.console.secretsVolumeEnabled and no longer the
            # database mode. The volume keeps its 1.4.0 name: renaming it would
            # roll every console Pod for a label change.
            - name: database-dsn
              mountPath: /etc/kconmon-ng-console-secrets
              readOnly: true
            {{- end }}
            {{- /* M5 hop enrichment. The mount path is FIXED at /geoip and is
            not a value: the chart would otherwise own two halves of the same
            fact (a mountPath here and an asnPath in the ConfigMap) with nothing
            keeping them agreeing, and a drift between them renders perfectly
            and fails only at runtime. One fixed directory, operator-chosen file
            names under it. Gated on the same condition as the volume below --
            the configmap.yaml guard makes the two impossible to separate. */}}
            {{- if and .Values.console.mtr.enrichment.enabled (or .Values.console.mtr.enrichment.geoip.asnPath .Values.console.mtr.enrichment.geoip.cityPath) }}
            - name: geoip
              mountPath: /geoip
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kconmon-ng.console.fullname" . }}
        {{- if include "kconmon-ng.console.secretsVolumeEnabled" . }}
        # Projected Secret reference — the chart names the Secret, it never
        # holds the DSN itself. 0440 + fsGroup above: see the securityContext
        # comment. Rotation note: read once at boot; rotating the Secret is an
        # operator-initiated restart (the Deployment rolls on ConfigMap
        # changes only). auth.mode=local|oidc always implies this whole block
        # renders (the render guards in configmap.yaml refuse
        # database.mode=disabled for those two modes), so the bootstrap
        # password / OIDC client secret sources below can ride the SAME
        # projected volume as the DSN rather than needing one of their own.
        - name: database-dsn
          projected:
            defaultMode: 0440
            sources:
              {{- if ne .Values.console.database.mode "disabled" }}
              - secret:
                  name: {{ include "kconmon-ng.console.databaseSecretName" . }}
                  items:
                    - key: {{ include "kconmon-ng.console.databaseSecretKey" . }}
                      path: database-dsn
              {{- end }}
              {{- /* M6 webhook encryption key. The path is what
              configmap.yaml writes into webhooks.encryptionKeyFile; the two
              halves are kept together by both being literals in this chart and
              by the ci/console-investigation-values.yaml render. */}}
              {{- with (include "kconmon-ng.console.webhooksKeySecretName" .) }}
              - secret:
                  name: {{ . }}
                  items:
                    - key: {{ $.Values.console.webhooks.encryptionKeySecret.key }}
                      path: webhooks-encryption-key
              {{- end }}
              {{- if and (eq .Values.console.auth.mode "local") .Values.console.auth.local.bootstrapAdmin }}
              - secret:
                  name: {{ include "kconmon-ng.console.localAdminSecretName" . }}
                  items:
                    - key: {{ .Values.console.auth.local.existingSecretKey }}
                      path: local-admin-password
              {{- end }}
              {{- if eq .Values.console.auth.mode "oidc" }}
              - secret:
                  name: {{ include "kconmon-ng.console.oidcClientSecretName" . }}
                  items:
                    - key: {{ .Values.console.auth.oidc.existingSecretKey }}
                      path: oidc-client-secret
              {{- end }}
        {{- end }}
        {{- /* console.mtr.enrichment.geoip.volume is an OPAQUE VolumeSource,
        spliced in verbatim under a chart-owned name. The chart deliberately
        does not model the {configMap|secret|hostPath|persistentVolumeClaim}
        union: GeoLite2 mmdb files are ~10 MB (past what many clusters accept in
        a ConfigMap), operators keep them in genuinely different places, and a
        re-declared union in values.schema.json goes stale the first time
        Kubernetes grows a source. The API server validates what you wrote.
        Unlike the projected Secret above there is no defaultMode here: an mmdb
        is not a secret, and the console only ever reads it. */}}
        {{- if and .Values.console.mtr.enrichment.enabled (or .Values.console.mtr.enrichment.geoip.asnPath .Values.console.mtr.enrichment.geoip.cityPath) }}
        - name: geoip
          {{- toYaml .Values.console.mtr.enrichment.geoip.volume | nindent 10 }}
        {{- end }}
{{- end }}
