{{- if and .Values.console.enabled (eq .Values.console.database.mode "cnpg") }}
{{- $db := .Values.console.database }}
{{- /* Nil guards: a null override deletes the sub-tree, so fail with an actionable message. */}}
{{- if not $db.cnpg }}
{{- fail "console.database.mode=cnpg requires a non-empty console.database.cnpg block: it was overridden with null/empty, which DELETES the chart's own defaults (instances, storage.size) rather than restoring them — drop the override, or set console.database.cnpg.instances and console.database.cnpg.storage.size explicitly" }}
{{- end }}
{{- if not $db.cnpg.storage }}
{{- fail "console.database.mode=cnpg requires a non-empty console.database.cnpg.storage block: it was overridden with null/empty, which DELETES the chart's default storage.size — drop the override, or set console.database.cnpg.storage.size explicitly" }}
{{- end }}
{{- $backup := $db.cnpg.backup | default dict }}
{{- /* Requires the CNPG operator CRDs; this chart does not install the operator. */}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "kconmon-ng.console.databaseClusterName" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-db
spec:
  instances: {{ $db.cnpg.instances | int }}
  {{- with $db.cnpg.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  storage:
    size: {{ $db.cnpg.storage.size | quote }}
    {{- with $db.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  {{- with $db.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if $backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ required "console.database.cnpg.backup.destinationPath is required when backup.enabled" $backup.destinationPath | quote }}
      {{- with $backup.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      # Credentials referenced by name only, using CNPG's key convention.
      {{- $backupSecret := include "kconmon-ng.console.backupSecretName" . }}
      s3Credentials:
        accessKeyId:
          name: {{ $backupSecret | quote }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ $backupSecret | quote }}
          key: ACCESS_SECRET_KEY
  {{- end }}
{{- if $backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "kconmon-ng.console.databaseClusterName" . }}-backup
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-db
spec:
  schedule: {{ required "console.database.cnpg.backup.schedule is required when backup.enabled (six-field cron, CNPG's own format: seconds first)" $backup.schedule | quote }}
  cluster:
    name: {{ include "kconmon-ng.console.databaseClusterName" . }}
{{- end }}
{{- end }}
