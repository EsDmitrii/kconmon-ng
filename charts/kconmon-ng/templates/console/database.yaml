{{- if and .Values.console.enabled (eq .Values.console.database.mode "cnpg") }}
{{- $db := .Values.console.database }}
{{- /* NIL GUARDS. A Helm values override that names a key and gives it no
value (`cnpg:`, `storage:`, `backup:` with nothing indented under it) does not
"leave the chart default alone" — it merges a null over the default and DELETES
the sub-tree. Every dotted access below it then dies with the Go template
runtime's own message, "nil pointer evaluating interface {}.enabled", which
names neither the value nor the file the operator has to fix. The two blocks
this chart cannot supply a sane fallback for (instances/storage.size are
deployment decisions, not chart opinions) fail with an actionable message
instead; backup needs no message at all, because "no backup block" and "backup
disabled" are the same thing, so it degrades to an empty dict and the
enabled-check below reads false. */}}
{{- if not $db.cnpg }}
{{- fail "console.database.mode=cnpg requires a non-empty console.database.cnpg block: it was overridden with null/empty, which DELETES the chart's own defaults (instances, storage.size) rather than restoring them — drop the override, or set console.database.cnpg.instances and console.database.cnpg.storage.size explicitly" }}
{{- end }}
{{- if not $db.cnpg.storage }}
{{- fail "console.database.mode=cnpg requires a non-empty console.database.cnpg.storage block: it was overridden with null/empty, which DELETES the chart's default storage.size — drop the override, or set console.database.cnpg.storage.size explicitly" }}
{{- end }}
{{- $backup := $db.cnpg.backup | default dict }}
{{- /* CRD ORDERING TRAP (ADR-001 "Negative"): this CR requires the CNPG
operator's CRDs to already exist — the chart deliberately does not install
the operator. `helm install` fails with "no matches for kind Cluster" until
the operator is installed. */}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "kconmon-ng.console.databaseClusterName" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-db
spec:
  instances: {{ $db.cnpg.instances | int }}
  {{- with $db.cnpg.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  storage:
    size: {{ $db.cnpg.storage.size | quote }}
    {{- with $db.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  {{- with $db.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if $backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ required "console.database.cnpg.backup.destinationPath is required when backup.enabled" $backup.destinationPath | quote }}
      {{- with $backup.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      # Credentials referenced BY NAME only (never created or read by this
      # chart). Keys follow CNPG's documented convention.
      s3Credentials:
        accessKeyId:
          name: {{ required "console.database.cnpg.backup.credentialsSecret is required when backup.enabled" $backup.credentialsSecret | quote }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ $backup.credentialsSecret | quote }}
          key: ACCESS_SECRET_KEY
  {{- end }}
{{- if $backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "kconmon-ng.console.databaseClusterName" . }}-backup
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-db
spec:
  schedule: {{ required "console.database.cnpg.backup.schedule is required when backup.enabled (six-field cron, CNPG's own format: seconds first)" $backup.schedule | quote }}
  cluster:
    name: {{ include "kconmon-ng.console.databaseClusterName" . }}
{{- end }}
{{- end }}
