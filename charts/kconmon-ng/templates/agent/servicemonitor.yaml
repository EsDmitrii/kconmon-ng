{{- if and (ne .Values.agent.metrics.detail "full") (not (or .Values.serviceMonitor.enabled (include "kconmon-ng.scrapeConfig.externalAgents.enabled" .))) }}
{{- fail (printf "agent.metrics.detail=%q but neither serviceMonitor.enabled nor scrapeConfig.externalAgents.enabled is true: the valve is rendered as metricRelabelings on this chart's agent ServiceMonitor and external-agent ScrapeConfig and nothing else applies it, so the setting would silently drop nothing. Enable one of them, or keep detail=full and copy the equivalent metric_relabel_configs from docs/metrics.md (\"Scaling and cardinality\") into your own scrape config" .Values.agent.metrics.detail) }}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kconmon-ng.agent.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- with include "kconmon-ng.agent.metricRelabelings" . }}
      {{- . | nindent 6 }}
      {{- end }}
{{- end }}
