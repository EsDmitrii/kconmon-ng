apiVersion: v1
kind: Service
metadata:
  name: {{ include "kconmon-ng.agent.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "kconmon-ng.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  ports:
    - name: http
      port: {{ .Values.config.httpPort }}
      targetPort: http
    # Scraped instead of `http`: the controller's API shares that port and authenticates nothing,
    # so the NetworkPolicy opens this one to Prometheus and leaves the API closed.
    - name: metrics
      port: {{ .Values.config.metricsPort }}
      targetPort: metrics
      protocol: TCP
