apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kconmon-ng.agent.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  minReadySeconds: 5
  {{- with .Values.agent.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- /* The config's fingerprint, so a values change restarts the pod that reads it: the agent
             and the controller read kconmon-ng-config once at startup, and a mounted ConfigMap
             changes under a running process without telling it. */}}
      {{- $annotations := dict "checksum/config" (include (print $.Template.BasePath "/shared/configmap.yaml") . | sha256sum) }}
      {{- if .Values.agent.zone }}
      {{- $_ := set $annotations "kconmon-ng.zone" .Values.agent.zone }}
      {{- end }}
      {{- with .Values.agent.podAnnotations }}
      {{- range $k, $v := . }}
      {{- $_ := set $annotations $k $v }}
      {{- end }}
      {{- end }}
      annotations:
        {{- range $k, $v := $annotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      labels:
        {{- include "kconmon-ng.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "kconmon-ng.serviceAccountName" . }}
      # The agent never calls the apiserver; the controller is the only API client.
      automountServiceAccountToken: false
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.agent.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- /* Empty dnsPolicy means ClusterFirstWithHostNet under hostNetwork: controllerAddress is a bare
             Service name, and a host-network pod left on ClusterFirst reads the node's resolv.conf. */}}
      {{- $dns := .Values.agent.dnsPolicy }}
      {{- if and (not $dns) .Values.agent.hostNetwork }}
      {{- $dns = "ClusterFirstWithHostNet" }}
      {{- end }}
      {{- with $dns }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- /* The sysctl is appended to podSecurityContext rather than living inside it, so switching it
             off does not take runAsNonRoot / runAsUser / seccompProfile with it -- the three keys a
             namespace enforcing restricted PSS requires. */}}
      {{- $podSec := deepCopy (.Values.agent.podSecurityContext | default dict) }}
      {{- /* Never under hostNetwork: the kubelet refuses net.* sysctls in the host netns (SysctlForbidden, pkg/kubelet/sysctl/allowlist.go), so the node OS sets it. */}}
      {{- if and .Values.agent.pingGroupRange (not .Values.agent.hostNetwork) }}
      {{- $podSec = merge $podSec (dict "sysctls" (list (dict "name" "net.ipv4.ping_group_range" "value" "0 2147483647"))) }}
      {{- end }}
      {{- with $podSec }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            {{- with .Values.agent.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* hostPort must equal containerPort under hostNetwork; declaring it lets the scheduler see
                 clashes with other hostPort pods (node daemons stay invisible to it and CrashLoop the agent). */}}
          ports:
            - name: http
              containerPort: {{ .Values.config.httpPort }}
              {{- if .Values.agent.hostNetwork }}
              hostPort: {{ .Values.config.httpPort }}
              {{- end }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              {{- if .Values.agent.hostNetwork }}
              hostPort: {{ .Values.config.metricsPort }}
              {{- end }}
              protocol: TCP
            {{- /* Named grpc for compatibility, but on an agent config.grpcPort is the UDP echo port (internal/agent/probe_server.go)
                   and nothing listens on TCP there; the scheduler keys hostPort clashes on protocol, so TCP would guard an unused port. */}}
            - name: grpc
              containerPort: {{ .Values.config.grpcPort }}
              {{- if .Values.agent.hostNetwork }}
              hostPort: {{ .Values.config.grpcPort }}
              {{- end }}
              protocol: UDP
          env:
            - name: KCONMON_NG_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KCONMON_NG_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- /* The kubelet already reports the node IP as podIP for a host-network pod; naming hostIP
                   keeps that intent in the manifest instead of leaning on the aliasing. */}}
            - name: KCONMON_NG_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: {{ if .Values.agent.hostNetwork }}status.hostIP{{ else }}status.podIP{{ end }}
            {{- if .Values.agent.hostNetwork }}
            - name: KCONMON_NG_HOST_NETWORK
              value: "true"
            {{- end }}
            {{- if .Values.agent.zone }}
            - name: KCONMON_NG_ZONE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['kconmon-ng.zone']
            {{- end }}
            - name: KCONMON_NG_CONTROLLER_ADDRESS
              value: {{ include "kconmon-ng.controllerService" . | quote }}
            - name: KCONMON_NG_CONFIG
              value: /etc/kconmon-ng/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/kconmon-ng
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kconmon-ng.fullname" . }}-config
