{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kconmon-ng.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Agent to controller gRPC
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    # Agent to agent probes (UDP)
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: UDP
          port: {{ .Values.config.grpcPort }}
    {{- if .Values.console.enabled }}
    {{- if .Values.controller.events.enabled }}
    # Console to controller gRPC; the controller side of console traffic is opened here.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: console
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    {{- end }}
    {{- if eq .Values.console.valkey.mode "bundled" }}
    # Console to the bundled Valkey.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: console
      ports:
        - protocol: TCP
          port: {{ .Values.console.valkey.port | int64 }}
    {{- end }}
    {{- end }}
    # Prometheus scraping
    - from:
        {{- if .Values.networkPolicy.prometheusNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
  egress:
    # Agent to controller gRPC
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    # Agent to agent probes
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: UDP
          port: {{ .Values.config.grpcPort }}
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.config.checkers.icmp.enabled }}
    # ICMP probes and reactive MTR: a protocol rule with NO ports, because ICMP has none.
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: ICMP
    {{- end }}
    {{- if .Values.config.checkers.external.enabled }}
    # External checks leave the cluster; empty renders TCP 80/443 plus ICMP to 0.0.0.0/0.
    {{- with .Values.networkPolicy.externalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: ICMP
    {{- end }}
    {{- end }}
    {{- if .Values.config.checkers.http.enabled }}
    # HTTP checker targets; empty renders TCP 80/443 to 0.0.0.0/0.
    {{- with .Values.networkPolicy.httpEgress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.resolverEgress }}
    # Explicit DNS resolvers outside the cluster.
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Kubernetes apiserver. ipBlock, not a namespaceSelector: kubernetes.default.svc is a ClusterIP with
    # no Pod behind it, so a namespaceSelector matches nothing and drops every packet.
    {{- with .Values.networkPolicy.kubeAPIEgress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
{{- end }}
