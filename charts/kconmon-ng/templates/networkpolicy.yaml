{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kconmon-ng.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Agent to controller gRPC
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    # Agent to agent probes (UDP)
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: UDP
          port: {{ .Values.config.grpcPort }}
    {{- if .Values.console.enabled }}
    {{- if .Values.controller.events.enabled }}
    # Console to controller gRPC (EventStream.WatchEvents). This policy's
    # podSelector is chart-wide (name+instance), so the controller side of any
    # new console traffic must be opened HERE — the console-scoped policy in
    # templates/console/ only governs the console Pods themselves.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: console
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    {{- end }}
    {{- if eq .Values.console.valkey.mode "bundled" }}
    # Console to the bundled Valkey. Same chart-wide podSelector caveat: this
    # opens TCP <valkey.port> ingress from console Pods on every Pod this
    # policy selects, of which only the bundled Valkey actually listens there.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: console
      ports:
        - protocol: TCP
          port: {{ .Values.console.valkey.port | int64 }}
    {{- end }}
    {{- end }}
    # Prometheus scraping
    - from:
        {{- if .Values.networkPolicy.prometheusNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
  egress:
    # Agent to controller gRPC
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    # Agent to agent probes
    - to:
        - podSelector:
            matchLabels:
              {{- include "kconmon-ng.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: UDP
          port: {{ .Values.config.grpcPort }}
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API (controller needs node access)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
{{- end }}
