{{- include "kconmon-ng.migrations" . }}
{{- if eq (int .Values.config.httpPort) (int .Values.config.grpcPort) }}
{{- fail (printf "config.httpPort and config.grpcPort must differ (both are %v): one Pod cannot bind the same port twice" .Values.config.httpPort) }}
{{- end }}
{{- if .Values.controller.externalGateway.enabled }}
{{- $gwPort := int .Values.controller.externalGateway.port }}
{{- if or (eq $gwPort (int .Values.config.httpPort)) (eq $gwPort (int .Values.config.grpcPort)) (eq $gwPort (int .Values.config.metricsPort)) }}
{{- fail (printf "controller.externalGateway.port (%d) must differ from config.httpPort, config.grpcPort and config.metricsPort: the controller refuses the collision at startup, so the chart refuses it at render" $gwPort) }}
{{- end }}
{{- end }}
{{- if and .Values.config.checkers.dns.enabled (not .Values.config.checkers.dns.hosts) }}
{{- fail "config.checkers.dns.enabled is true but config.checkers.dns.hosts is empty: the checker would resolve nothing" }}
{{- end }}
{{- if and .Values.config.checkers.http.enabled (not .Values.config.checkers.http.targets) }}
{{- fail "config.checkers.http.enabled is true but config.checkers.http.targets is empty: the checker would probe nothing" }}
{{- end }}
{{- if and .Values.config.checkers.external.enabled (not .Values.config.checkers.external.allowedCidrs) }}
{{- fail "config.checkers.external.enabled is true but config.checkers.external.allowedCidrs is empty: an empty allowlist is a startup error, never read as allow-everything" }}
{{- end }}
{{- if lt (include "kconmon-ng.durationNanos" .Values.config.controllerAgentTtl | float64) 10000000000.0 }}
{{- fail (printf "config.controllerAgentTtl=%v is below 10s, two agent heartbeats: the controller refuses it at startup, because the sweep would evict the whole fleet between beats" .Values.config.controllerAgentTtl) }}
{{- end }}
{{- if .Values.config.checkers.http.enabled }}
{{- range $t := .Values.config.checkers.http.targets }}
{{- /* Compiled here the way the agent compiles it, so a bad pattern fails the render, not the agent. */}}
{{- if $t.bodyPattern }}{{- $_ := mustRegexMatch $t.bodyPattern "" }}{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kconmon-ng.fullname" . }}-config
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
data:
  config.yaml: |
    metricsPrefix: {{ .Values.config.metricsPrefix | quote }}
    httpPort: {{ .Values.config.httpPort }}
    grpcPort: {{ .Values.config.grpcPort }}
    metricsPort: {{ .Values.config.metricsPort }}
    logLevel: {{ .Values.config.logLevel | quote }}
    logFormat: {{ .Values.config.logFormat | quote }}
    failureDomainLabel: {{ .Values.config.failureDomainLabel | quote }}
    controllerAddress: {{ include "kconmon-ng.controllerService" . | quote }}
    controller:
      leaderElection: {{ .Values.controller.leaderElection }}
      agentTtl: {{ .Values.config.controllerAgentTtl | quote }}
      {{- /* Emitted only when ON: a pre-M2 controller image would crashloop on an unknown key. */}}
      {{- if .Values.controller.events.enabled }}
      events:
        enabled: true
      {{- end }}
      {{- /* Emitted only when OFF: true is the compiled default, and a pre-2.4.0 image rejects the
             unknown key. `with` keeps a --reuse-values upgrade that predates the block silent. */}}
      {{- with .Values.controller.prometheusSD }}
      {{- if and (hasKey . "enabled") (not .enabled) }}
      prometheusSD:
        enabled: false
      {{- end }}
      {{- end }}
      {{- /* Emitted only when ON, same reason as events: pre-M6 images reject the key. The file
             paths must match the Secret mounts in templates/controller/deployment.yaml. */}}
      {{- with .Values.controller.externalGateway }}
      {{- if .enabled }}
      externalGateway:
        enabled: true
        port: {{ .port }}
        tls:
          certFile: /etc/kconmon-ng-gateway-tls/tls.crt
          keyFile: /etc/kconmon-ng-gateway-tls/tls.key
          {{- with .tls.clientCaKey }}
          clientCaFile: {{ printf "/etc/kconmon-ng-gateway-tls/%s" . | quote }}
          {{- end }}
        {{- /* default guards the --reuse-values trap: an upgrade that predates this key would render a nil segment. */}}
        bootstrapTokenFile: {{ printf "/etc/kconmon-ng-gateway-token/%s" (.bootstrapToken.key | default "token") | quote }}
      {{- end }}
      {{- end }}
    {{- /* Emitted only when sparse: full is the compiled default, and a pre-2.3.0 image rejects
           the unknown key. hasKey/ternary rather than `default`, because 0 is a meaningful value
           for zoneChords and autoThreshold and `default` would silently rewrite it. */}}
    {{- with .Values.topology }}
    {{- if eq (.mode | default "full") "sparse" }}
    {{- $sparse := .sparse | default dict }}
    topology:
      mode: "sparse"
      sparse:
        ringDegree: {{ ternary $sparse.ringDegree 2 (hasKey $sparse "ringDegree") | int }}
        zoneChords: {{ ternary $sparse.zoneChords 2 (hasKey $sparse "zoneChords") | int }}
        autoThreshold: {{ ternary $sparse.autoThreshold 0 (hasKey $sparse "autoThreshold") | int }}
    {{- end }}
    {{- end }}
    checkers:
      tcp:
        enabled: {{ .Values.config.checkers.tcp.enabled }}
        interval: {{ .Values.config.checkers.tcp.interval | quote }}
        timeout: {{ .Values.config.checkers.tcp.timeout | quote }}
      udp:
        enabled: {{ .Values.config.checkers.udp.enabled }}
        interval: {{ .Values.config.checkers.udp.interval | quote }}
        timeout: {{ .Values.config.checkers.udp.timeout | quote }}
        packets: {{ .Values.config.checkers.udp.packets }}
      icmp:
        enabled: {{ .Values.config.checkers.icmp.enabled }}
        interval: {{ .Values.config.checkers.icmp.interval | quote }}
        timeout: {{ .Values.config.checkers.icmp.timeout | quote }}
      {{- /* Only the keys that differ from the compiled defaults (true, 60s, 500ms, 0) are written:
             the config decoder is strict and an agent older than 2.5.0 exits on an unknown key, so a
             chart upgrade ahead of the image stays safe until someone tunes pmtu. `with` keeps a
             --reuse-values upgrade over 2.4.0 values, which carry no pmtu block, silent. */}}
      {{- with .Values.config.checkers.pmtu }}
      {{- $tuned := dict }}
      {{- if and (hasKey . "enabled") (not .enabled) }}{{- $_ := set $tuned "enabled" "false" }}{{- end }}
      {{- if and .interval (ne (toString .interval) "60s") }}{{- $_ := set $tuned "interval" (toString .interval) }}{{- end }}
      {{- if and .timeout (ne (toString .timeout) "500ms") }}{{- $_ := set $tuned "timeout" (toString .timeout) }}{{- end }}
      {{- if and .size (ne (int .size) 0) }}{{- $_ := set $tuned "size" (int .size | toString) }}{{- end }}
      {{- if $tuned }}
      pmtu:
        {{- with $tuned.enabled }}
        enabled: {{ . }}
        {{- end }}
        {{- with $tuned.interval }}
        interval: {{ . | quote }}
        {{- end }}
        {{- with $tuned.timeout }}
        timeout: {{ . | quote }}
        {{- end }}
        {{- with $tuned.size }}
        size: {{ . }}
        {{- end }}
      {{- end }}
      {{- end }}
      dns:
        enabled: {{ .Values.config.checkers.dns.enabled }}
        interval: {{ .Values.config.checkers.dns.interval | quote }}
        timeout: {{ .Values.config.checkers.dns.timeout | quote }}
        hosts:
          {{- range .Values.config.checkers.dns.hosts }}
          - {{ . | quote }}
          {{- end }}
        {{- with .Values.config.checkers.dns.resolvers }}
        resolvers:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
      http:
        enabled: {{ .Values.config.checkers.http.enabled }}
        interval: {{ .Values.config.checkers.http.interval | quote }}
        timeout: {{ .Values.config.checkers.http.timeout | quote }}
        targets:
          {{- toYaml .Values.config.checkers.http.targets | nindent 10 }}
      mtr:
        cooldown: {{ .Values.config.checkers.mtr.cooldown | quote }}
        maxHops: {{ .Values.config.checkers.mtr.maxHops }}
      {{- /* Emitted only when ON: a pre-M4 agent image would crashloop on an unknown key. */}}
      {{- if .Values.config.checkers.external.enabled }}
      external:
        enabled: true
        allowedCidrs:
          {{- range .Values.config.checkers.external.allowedCidrs }}
          - {{ . | quote }}
          {{- end }}
        {{- with .Values.config.checkers.external.deniedCidrs }}
        deniedCidrs:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        maxTargets: {{ .Values.config.checkers.external.maxTargets | int }}
        timeout: {{ .Values.config.checkers.external.timeout | quote }}
      {{- end }}
