{{- if .Values.rbac.create }}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.name) }}
{{- fail "rbac.create=true with serviceAccount.create=false requires serviceAccount.name: an empty name resolves to the namespace's DEFAULT ServiceAccount, so these bindings would grant every pod in the namespace the controller's node access and the console's PrometheusRule writes (set serviceAccount.name, or set rbac.create=false and manage RBAC yourself)" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kconmon-ng.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kconmon-ng.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kconmon-ng.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kconmon-ng.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.controller.leaderElection }}
---
{{/* The controller's leader Lease: namespaced, and only the verbs client-go's LeaseLock issues. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kconmon-ng.fullname" . }}-leader-election
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kconmon-ng.fullname" . }}-leader-election
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kconmon-ng.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kconmon-ng.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- if and .Values.console.enabled .Values.console.kubernetesContext.enabled .Values.rbac.create }}
---
{{/* Console-only ClusterRole: event list/watch, cluster-scoped because Node events land in any namespace. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kconmon-ng.console.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kconmon-ng.console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.console.enabled .Values.console.alerting.enabled .Values.rbac.create }}
---
{{/* Alerting reconciler grant: a namespaced Role whose verbs match the promrules client exactly. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}-alerting
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kconmon-ng.console.fullname" . }}-alerting
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kconmon-ng.console.fullname" . }}-alerting
subjects:
  - kind: ServiceAccount
    name: {{ include "kconmon-ng.console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
