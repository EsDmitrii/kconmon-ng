apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kconmon-ng.fullname" . }}-connection-test"
  labels:
    # NOT kconmon-ng.labels, and that is the point rather than an omission.
    #
    # That helper EMBEDS selectorLabels, so this Pod carried app.kubernetes.io/name and
    # app.kubernetes.io/instance — exactly the main NetworkPolicy's podSelector — and
    # component: test cleared its `NotIn [console]` guard. The Pod was therefore captured by the
    # policy, its egress restricted, and no rule admits it to the controller: `helm test` failed on
    # every install with networkPolicy.enabled, while the comment here claimed the opposite.
    #
    # The chart and managed-by labels stay: they are provenance, and neither is a selector.
    helm.sh/chart: {{ include "kconmon-ng.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
    # The label the controller's own ingress rule admits. Not a selectorLabels match — it exists so
    # ONE rule can name this Pod without the main podSelector capturing it.
    kconmon-ng.io/role: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  containers:
    - name: connection-test
      image: curlimages/curl:8.18.0
      command:
        - sh
        - -c
        - |
          set -e
          CONTROLLER="{{ include "kconmon-ng.controller.fullname" . }}"
          echo "Testing controller health at http://${CONTROLLER}:{{ .Values.config.httpPort }}/healthz"
          curl -sf "http://${CONTROLLER}:{{ .Values.config.httpPort }}/healthz" || exit 1
          echo "Health check passed"
  restartPolicy: Never
