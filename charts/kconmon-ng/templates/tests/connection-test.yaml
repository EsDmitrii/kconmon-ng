apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kconmon-ng.fullname" . }}-connection-test"
  labels:
    # No selectorLabels: no component policy selects this Pod, and the controller policy admits it
    # on httpPort by kconmon-ng.io/role alone. The chart and managed-by labels are provenance only.
    helm.sh/chart: {{ include "kconmon-ng.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
    kconmon-ng.io/role: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  containers:
    - name: connection-test
      image: curlimages/curl:8.18.0
      # The four fields restricted-PSS admission checks; without them `helm test` on a hardened
      # namespace fails at admission, not on the health check. runAsUser stays: the image names its
      # user (curl_user, uid 101), and the kubelet refuses runAsNonRoot on a user it cannot resolve.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 102
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          set -e
          CONTROLLER="{{ include "kconmon-ng.controller.fullname" . }}"
          echo "Testing controller health at http://${CONTROLLER}:{{ .Values.config.httpPort }}/healthz"
          HEALTH=$(curl -sf "http://${CONTROLLER}:{{ .Values.config.httpPort }}/healthz") || exit 1
          echo "Health check passed: ${HEALTH}"
  restartPolicy: Never
