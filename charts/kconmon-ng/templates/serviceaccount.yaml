{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kconmon-ng.serviceAccountName" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
{{- end }}
{{- if and .Values.console.enabled (include "kconmon-ng.console.k8sIdentity" .) .Values.serviceAccount.create }}
---
{{/*
M6: the console's own ServiceAccount, created only when the Kubernetes event
reader is on. Separate from the agent/controller SA above on purpose — see the
second ClusterRole in rbac.yaml. Off by default, so a chart 1.7.0 render is
unchanged and a console that never calls the apiserver is never handed a token
that could.

M7: one MORE feature now needs this identity — console.alerting.enabled, whose
reconciler applies a PrometheusRule through the apiserver. The gate moved into
kconmon-ng.console.k8sIdentity so this SA, the Deployment's
serviceAccountName, POD_NAMESPACE and the apiserver egress rule cannot answer
the question differently. ONE SA, TWO grants: the M6 ClusterRole and the M7
namespaced Role bind to this same subject, each under its own feature flag.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kconmon-ng.console.serviceAccountName" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- end }}
