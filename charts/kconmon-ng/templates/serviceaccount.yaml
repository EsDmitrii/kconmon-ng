{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kconmon-ng.serviceAccountName" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
{{- end }}
{{- if and .Values.console.enabled (include "kconmon-ng.console.k8sIdentity" .) .Values.serviceAccount.create }}
---
{{/* One console-only ServiceAccount, subject of both console grants. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kconmon-ng.console.serviceAccountName" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- end }}
