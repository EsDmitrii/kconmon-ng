{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kconmon-ng.serviceAccountName" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
{{- end }}
{{- if and .Values.console.enabled .Values.console.kubernetesContext.enabled .Values.serviceAccount.create }}
---
{{/*
M6: the console's own ServiceAccount, created only when the Kubernetes event
reader is on. Separate from the agent/controller SA above on purpose — see the
second ClusterRole in rbac.yaml. Off by default, so a chart 1.7.0 render is
unchanged and a console that never calls the apiserver is never handed a token
that could.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kconmon-ng.console.serviceAccountName" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- end }}
