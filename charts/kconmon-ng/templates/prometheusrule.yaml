{{- if .Values.prometheusRule.enabled }}
{{- $prefix := .Values.config.metricsPrefix }}
{{- $rules := list }}
{{- if .Values.prometheusRule.rules }}
{{- /* The deprecated full-override list silently discards every per-rule knob; say so. */}}
{{- $defaults := dict "udpLossHigh" (dict "threshold" 0.5 "for" "5m" "severity" "warning") "tcpChecksFailing" (dict "threshold" 0.05 "for" "5m" "severity" "warning") "pairWentSilent" (dict "for" "10m" "severity" "warning") "dnsChecksFailing" (dict "threshold" 0.05 "for" "5m" "severity" "warning") "externalChecksFailing" (dict "threshold" 0.1 "for" "5m" "severity" "warning") "kconmonAgentsMissing" (dict "for" "10m" "severity" "warning") "kconmonControllerDown" (dict "for" "5m" "severity" "critical") }}
{{- range $n, $d := $defaults }}
{{- $r := get $.Values.prometheusRule $n }}
{{- if not $r.enabled }}
{{- fail (printf "prometheusRule.rules (deprecated) is set together with prometheusRule.%s.enabled=false — the list replaces every built-in rule, so the toggle would be silently discarded. Drop prometheusRule.rules and use the per-rule knobs, or remove the knob" $n) }}
{{- end }}
{{- range $k, $v := $d }}
{{- if ne (printf "%v" (get $r $k)) (printf "%v" $v) }}
{{- fail (printf "prometheusRule.rules (deprecated) is set together with prometheusRule.%s.%s — the list replaces every built-in rule, so that tuning would be silently discarded. Drop prometheusRule.rules and use the per-rule knobs, or remove the knob" $n $k) }}
{{- end }}
{{- end }}
{{- end }}
{{/* legacy full override: rules carry the literal kconmon_ng prefix */}}
{{- range $r := .Values.prometheusRule.rules }}
{{- $rules = append $rules (merge (dict "expr" (replace "kconmon_ng" $prefix $r.expr)) $r) }}
{{- end }}
{{- else }}
{{- $rules = include "kconmon-ng.prometheusRule.builtinRules" . | fromYamlArray }}
{{- end }}
{{- $rules = concat $rules .Values.prometheusRule.additionalRules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kconmon-ng.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
spec:
  groups:
    - name: kconmon-ng
      rules:{{ if not $rules }} []{{ end }}
        {{- range $rules }}
        - alert: {{ .alert }}
          expr: {{ .expr | quote }}
          {{- if .for }}
          for: {{ .for }}
          {{- end }}
          {{- if .labels }}
          labels:
            {{- toYaml .labels | nindent 12 }}
          {{- end }}
          {{- if .annotations }}
          annotations:
            {{- toYaml .annotations | nindent 12 }}
          {{- end }}
        {{- end }}
{{- end }}
