{{- if and (gt (int .Values.controller.replicaCount) 1) (not .Values.controller.leaderElection) }}
{{- fail "controller.replicaCount > 1 with controller.leaderElection=false: every replica accepts registrations through the ClusterIP Service and serves peer lists from its OWN registry, so the agents split into that many disjoint meshes and every cross-partition link goes unprobed -- with no alert, because the leader metric the alerts key on is never published either" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kconmon-ng.controller.fullname" . }}
  labels:
    {{- include "kconmon-ng.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "kconmon-ng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        {{- /* See the agent DaemonSet: the shared config is read once at startup, so without this a
               values change updates the ConfigMap and leaves every pod running the old file. */}}
        checksum/config: {{ include (print $.Template.BasePath "/shared/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "kconmon-ng.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "kconmon-ng.serviceAccountName" . }}
      {{- with .Values.controller.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          {{- with .Values.controller.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.config.grpcPort }}
              protocol: TCP
          env:
            - name: KCONMON_NG_CONFIG
              value: /etc/kconmon-ng/config.yaml
            {{- if .Values.controller.leaderElection }}
            {{- /* Lease identity and location; the pod name is what shows up as the lease holder. */}}
            - name: KCONMON_NG_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KCONMON_NG_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KCONMON_NG_LEASE_NAME
              value: {{ include "kconmon-ng.controller.fullname" . }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kconmon-ng
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kconmon-ng.fullname" . }}-config
