---
redis:
  existingSecret: kconmon-console-redis
database:
  existingSecret: kconmon-console-db
controller:
  events:
    enabled: true
config:
  checkers:
    external:
      enabled: true
      allowedCidrs:
        - 10.0.0.0/8
        - 2001:db8::/32
      deniedCidrs:
        - 169.254.169.254/32
      maxTargets: 50
      timeout: 5s
console:
  enabled: true
  replicas: 2
  scheduler:
    enabled: true
    tickInterval: 10s
  rateLimit:
    runsPerMinute: 30
    loginPerMinute: 0
  prometheus:
    url: http://prometheus-operated.monitoring:9090
networkPolicy:
  enabled: true
  externalEgress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 2001:db8::/32
prometheusRule:
  enabled: true
