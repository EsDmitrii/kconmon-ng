---
database:
  secret:
    create: true
    name: kconmon-ng-console-dsn-managed
    annotations:
      vault.security.banzaicloud.io/vault-addr: https://vault.example.com:8200
      vault.security.banzaicloud.io/vault-role: kconmon-ng-console
    dsn: ${vault:secret/data/example/postgres#dsn}
console:
  enabled: true
  replicas: 1
  prometheus:
    url: http://prometheus-operated.monitoring:9090
  auth:
    mode: oidc
    oidc:
      issuer: https://idp.example.com/realms/example
      clientID: kconmon-ng-console
      redirectURL: https://console.example.com/api/v1/auth/oidc/callback
      secret:
        create: true
        annotations:
          vault.security.banzaicloud.io/vault-addr: https://vault.example.com:8200
          vault.security.banzaicloud.io/vault-role: kconmon-ng-console
          vault.security.banzaicloud.io/vault-path: kubernetes
        labels:
          app.kubernetes.io/part-of: kconmon-ng
        clientSecret: ${vault:secret/data/example/oidc#clientSecret}
  webhooks:
    secret:
      create: true
      annotations:
        vault.security.banzaicloud.io/vault-addr: https://vault.example.com:8200
      encryptionKey: ${vault:secret/data/example/webhooks#encryptionKey}
  alerting:
    enabled: true
