---
# Every DEPRECATED key still in use. Renders the same manifests as the new
# names; charts/kconmon-ng/ci/console-db-values.yaml is the new-name twin.
console:
  enabled: true
  replicas: 1
  prometheus:
    url: http://prometheus-operated.monitoring:9090
  controller:
    # renamed to grpcAddress
    grpcAddr: kconmon-ng-controller.other-ns.svc.cluster.local:9090
  webhooks:
    # renamed to webhooks.existingSecret / webhooks.existingSecretKey
    encryptionKeySecret:
      name: legacy-webhook-key
      key: legacyEncryptionKey
  database:
    mode: cnpg
    cnpg:
      instances: 1
      storage:
        size: 1Gi
      backup:
        enabled: true
        destinationPath: s3://example-bucket/kconmon-ng
        # renamed to existingSecret
        credentialsSecret: legacy-backup-creds
