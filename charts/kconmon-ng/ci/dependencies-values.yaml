---
# Both optional subcharts on: the CNPG operator and the Valkey the console uses.
cnpg-operator:
  enabled: true

valkey:
  enabled: true
  # ACL auth off: an in-cluster pub/sub bus reachable only through the console's NetworkPolicy.
  auth:
    enabled: false

console:
  enabled: true
  replicas: 2
  prometheus:
    url: http://prometheus-operated.monitoring:9090
  valkey:
    mode: dependency
  database:
    mode: cnpg
    cnpg:
      instances: 1
      storage:
        size: 1Gi
