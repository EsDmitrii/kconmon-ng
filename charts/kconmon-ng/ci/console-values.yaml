---
redis:
  existingSecret: kconmon-console-redis
controller:
  events:
    enabled: true
console:
  enabled: true
  replicas: 2
  auth:
    mode: anonymous
    anonymous:
      role: viewer
  prometheus:
    url: http://prometheus-operated.monitoring:9090
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: console.example.com
        paths:
          - path: /
            pathType: Prefix
  pdb:
    enabled: true
    minAvailable: 1
networkPolicy:
  enabled: true
