---
# Console-enabled values for chart testing (anonymous auth, ingress on,
# M2 realtime with the bundled Valkey).
controller:
  events:
    enabled: true
console:
  enabled: true
  replicas: 2
  valkey:
    mode: bundled
  auth:
    mode: anonymous
    anonymous:
      role: viewer
  prometheus:
    url: http://prometheus-operated.monitoring:9090
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: console.example.com
        paths:
          - path: /
            pathType: Prefix
  pdb:
    enabled: true
    minAvailable: 1
networkPolicy:
  enabled: true
