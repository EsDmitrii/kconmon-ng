---
redis:
  existingSecret: kconmon-console-redis
controller:
  replicaCount: 3
  leaderElection: true
  events:
    enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: controller
            topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    minAvailable: 2
agent:
  zone: us-east-1a
  resources:
    limits:
      cpu: 300m
      memory: 192Mi
    requests:
      cpu: 100m
      memory: 96Mi
config:
  metricsPrefix: kconmon_ng
  logLevel: debug
  checkers:
    tcp:
      enabled: true
      interval: 3s
    udp:
      enabled: true
      interval: 3s
    dns:
      enabled: true
      hosts:
        - kubernetes.default.svc.cluster.local
        - kube-dns.kube-system.svc.cluster.local
serviceMonitor:
  enabled: true
  interval: 10s
prometheusRule:
  enabled: true
  udpLossHigh:
    threshold: '0.25'
    for: 3m
    severity: critical
  tcpChecksFailing:
    threshold: 0.075
  externalChecksFailing:
    enabled: false
  additionalRules:
    - alert: KconmonNgChartTestRule
      expr: vector(1) > 0
      for: 1m
      labels:
        severity: none
      annotations:
        summary: chart-test rule appended through prometheusRule.additionalRules
networkPolicy:
  enabled: true
  prometheusNamespace: monitoring
console:
  enabled: true
  replicas: 2
  auth:
    mode: anonymous
    anonymous:
      role: viewer
