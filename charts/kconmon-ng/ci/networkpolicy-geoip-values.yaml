---
redis:
  existingSecret: valkey-auth
database:
  existingSecret: console-dsn
networkPolicy:
  enabled: true
  prometheusNamespace: monitoring
  externalEgress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
config:
  checkers:
    icmp:
      enabled: true
    http:
      enabled: true
      targets:
        - url: https://kubernetes.default.svc.cluster.local/healthz
    external:
      enabled: true
      allowedCidrs:
        - 10.0.0.0/8
console:
  enabled: true
  replicas: 1
  prometheus:
    url: http://prometheus-operated.monitoring:9090
  mtr:
    enrichment:
      enabled: true
      geoip:
        mode: auto
        existingSecret: maxmind-creds
