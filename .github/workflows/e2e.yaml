---
name: E2E

# Reusable workflow: release.yaml calls it between the draft job and the publish job with the
# linux/amd64 images the draft job pushed, pinned by digest, so :latest, the chart and the GitHub
# release stay unpublished until those very images pass on kind. Without the image inputs (a manual
# workflow_dispatch run) it builds the three images from the checked-out source instead.
on:
  workflow_call:
    inputs:
      agent-image:
        description: Digest-pinned linux/amd64 agent image to test instead of building one; all three or none.
        type: string
        required: false
        default: ""
      controller-image:
        description: Digest-pinned linux/amd64 controller image, as agent-image.
        type: string
        required: false
        default: ""
      console-image:
        description: Digest-pinned linux/amd64 console image, as agent-image.
        type: string
        required: false
        default: ""
  workflow_dispatch:

# Read-only: this job clones, builds a kind cluster and installs the released chart. It never
# pushes anything; GITHUB_TOKEN is read only to pull the image inputs from GHCR.
permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      # workflow_call shares the caller's github context, and release.yaml only runs on
      # `push: tags: v*` -- so the default checkout ref is always the released tag. A manual
      # workflow_dispatch run checks out the ref it was started on, to test a fix before tagging.
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute build metadata
        id: meta
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "commit=${GITHUB_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # No restored cache: this job is the release gate, and a Go cache entry is writable by any job
      # that runs on main.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Write kind config
        run: |
          cat > kind-config.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          YAML

      - name: Create Kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kconmon-ng-e2e
          # The kind CLI must understand the node image's containerd config; move version and
          # node_image together.
          version: v0.33.0
          node_image: kindest/node:v1.37.0
          # `config` (the action has no `config_file`; an unknown input is dropped silently).
          config: kind-config.yaml

      - name: Choose the images
        id: images
        env:
          AGENT_IMAGE: ${{ inputs.agent-image }}
          CONTROLLER_IMAGE: ${{ inputs.controller-image }}
          CONSOLE_IMAGE: ${{ inputs.console-image }}
        run: |
          given=0
          for ref in "$AGENT_IMAGE" "$CONTROLLER_IMAGE" "$CONSOLE_IMAGE"; do
            if [ -n "$ref" ]; then given=$((given + 1)); fi
          done
          case "$given" in
            0) prebuilt=false ;;
            3) prebuilt=true ;;
            *) echo "::error::pass all three image inputs or none, got ${given}"; exit 1 ;;
          esac
          echo "prebuilt=${prebuilt}" >> "$GITHUB_OUTPUT"
          echo "prebuilt=${prebuilt} agent='${AGENT_IMAGE}' controller='${CONTROLLER_IMAGE}' console='${CONSOLE_IMAGE}'"

      - name: Log in to GHCR
        if: steps.images.outputs.prebuilt == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retagged to the names e2e/testdata/values.yaml installs, so the two paths differ only here. The
      # labels tie each image to the tag and commit under test: a wrong or stale digest fails here.
      - name: Pull the pushed images
        if: steps.images.outputs.prebuilt == 'true'
        env:
          AGENT_IMAGE: ${{ inputs.agent-image }}
          CONTROLLER_IMAGE: ${{ inputs.controller-image }}
          CONSOLE_IMAGE: ${{ inputs.console-image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          format='{{.Os}}/{{.Architecture}}'
          format+=' {{index .Config.Labels "org.opencontainers.image.version"}}'
          format+=' {{index .Config.Labels "org.opencontainers.image.revision"}}'
          pull() {
            docker pull --platform linux/amd64 "$1"
            got=$(docker image inspect "$1" --format "$format")
            want="linux/amd64 ${VERSION} ${GITHUB_SHA}"
            if [ "$got" != "$want" ]; then
              echo "::error::$1 is '${got}', want '${want}'"; exit 1
            fi
            docker tag "$1" "$2"
          }
          pull "$AGENT_IMAGE" kconmon-ng-agent:test
          pull "$CONTROLLER_IMAGE" kconmon-ng-controller:test
          pull "$CONSOLE_IMAGE" kconmon-ng-console:test

      - name: Set up Docker Buildx
        if: steps.images.outputs.prebuilt != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build agent image
        if: steps.images.outputs.prebuilt != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: kconmon-ng-agent:test
          target: agent
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Build controller image
        if: steps.images.outputs.prebuilt != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: kconmon-ng-controller:test
          target: controller
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      # Dockerfile.console is a SEPARATE Dockerfile (not a `target:` of the root one, see Makefile's docker-build).
      - name: Build console image
        if: steps.images.outputs.prebuilt != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.console
          push: false
          load: true
          tags: kconmon-ng-console:test
          target: console
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Load images into Kind
        run: |
          kind load docker-image kconmon-ng-agent:test --name kconmon-ng-e2e
          kind load docker-image kconmon-ng-controller:test --name kconmon-ng-e2e
          kind load docker-image kconmon-ng-console:test --name kconmon-ng-e2e

      # See e2e/testdata/prometheusrule-crd.yaml's header for what the vendored CRD does and does not cover.
      - name: Apply the PrometheusRule CRD and the foreign rule fixture
        run: |
          kubectl apply -f e2e/testdata/prometheusrule-crd.yaml
          e2e/kind-wait.sh crd prometheusrules.monitoring.coreos.com
          kubectl apply -f e2e/testdata/foreign-prometheusrule.yaml
          kubectl get prometheusrule -n default e2e-foreign-rules \
            -o jsonpath='{.metadata.labels}'
          echo

      # Deliberately a plain postgres:18-alpine Deployment/Service, not CNPG -- see e2e/testdata/postgres.yaml's
      # header for why.
      - name: Apply Postgres fixture
        run: |
          kubectl apply -f e2e/testdata/postgres.yaml
          kubectl wait --for=condition=ready pod \
            -l app=kconmon-e2e-postgres \
            --timeout=90s

      # Same shape as the Postgres DSN Secret above -- created here, referenced BY NAME from
      # e2e/testdata/console-values.yaml.
      - name: Create the webhook encryption key Secret
        run: |
          kubectl create secret generic kconmon-e2e-webhooks-key \
            --from-literal=encryptionKey="$(openssl rand -base64 32)" \
            --dry-run=client -o yaml | kubectl apply -f -

      # The helm every job pins (Test, Helm Lint, publish), never the runner image's own.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      # No `helm dependency build` here: the chart deliberately has no dependencies (see Chart.yaml).
      - name: Install Helm chart
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            --wait \
            --timeout 5m

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=kconmon-ng \
            --timeout=180s

      # The console's sync path fails identically ("this ServiceAccount may not write prometheusrules") whether the
      # Role was never rendered, was rendered with the wrong name, or was bound to the wrong subject; this step
      # names the cause before TestConsoleAlertRuleSyncAgainstRealCRD reports the symptom.
      - name: Verify the alerting RBAC rendered
        run: |
          kubectl get role kconmon-ng-console-alerting \
            -o jsonpath='{.rules}'
          echo
          kubectl get rolebinding kconmon-ng-console-alerting \
            -o jsonpath='{.subjects[0].name}'
          echo

      - name: Smoke tests
        run: |
          CONTROLLER_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONTROLLER_POD" 8080:8080 &
          PF_PID=$!
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8080/healthz

          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/readyz
          # Not piped: without pipefail a failed curl would hide behind head's exit status.
          curl -sf http://localhost:8080/metrics -o "$RUNNER_TEMP/controller-metrics"
          head -20 "$RUNNER_TEMP/controller-metrics"
          curl -sf http://localhost:8080/api/v1/topology

          kill $PF_PID || true

      - name: Run E2E tests
        run: |
          CONTROLLER_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONTROLLER_POD" 8080:8080 &
          CONTROLLER_PF_PID=$!

          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!

          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8080/healthz
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8081/healthz

          # Deterministic events for TestConsoleEvents / TestConsoleMetrics: the controller's WatchEvents stream has
          # NO replay, so each agent's one topology_changed event reaches only a console already subscribed. Wait
          # until the console reports its ingester subscribed, then restart the agents so they register after it.
          echo "Waiting for console ingester to subscribe to controller events..."
          DEADLINE=$((SECONDS + 90))
          until curl -sf http://localhost:8081/api/v1/version \
              | jq -e '(.capabilities // []) | index("events")' >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::console ingester did not report the 'events' capability within 90s"
              echo "=== Console logs ==="
              kubectl logs -l app.kubernetes.io/component=console --tail=100 || true
              exit 1
            fi
            sleep 2
          done
          echo "Console ingester subscribed."

          echo "Restarting agent DaemonSet so registrations happen after subscription..."
          kubectl rollout restart daemonset/kconmon-ng-agent
          kubectl rollout status daemonset/kconmon-ng-agent --timeout=90s

          # The agent port-forward is established HERE, strictly AFTER the rollout above, and that ordering is
          # load-bearing: a forward opened earlier would point at a Pod the restart deletes.
          AGENT_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=agent \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Forwarding agent metrics from pod/$AGENT_POD"
          kubectl port-forward "pod/$AGENT_POD" 8082:8080 &
          AGENT_PF_PID=$!
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8082/healthz

          # TestConsoleDegradedMode needs a SECOND rollout with the database disabled (see the two steps below), so
          # it is excluded here, and TestFault, TestExternal, TestConsoleLocalUsers and TestNetworkPolicy run in
          # their own legs. What is left has its env here, so any SKIP is a defect, like in the legs.
          set -o pipefail
          go test -tags=e2e -v -count=1 ./e2e/... -timeout 25m \
            -skip 'TestConsoleDegradedMode|TestFault|TestExternal|TestConsoleLocalUsers|TestNetworkPolicy' \
            | tee "$RUNNER_TEMP/e2e-main.log"
          e2e/leg-log-check.sh "$RUNNER_TEMP/e2e-main.log" "main suite"

          kill "$CONTROLLER_PF_PID" "$CONSOLE_PF_PID" "$AGENT_PF_PID" || true
        env:
          KCONMON_CONTROLLER_URL: http://localhost:8080
          KCONMON_CONSOLE_URL: http://localhost:8081
          KCONMON_AGENT_URL: http://localhost:8082
          # The in-cluster destination the continuous external-check test probes: the controller's own ClusterIP
          # Service.
          KCONMON_EXTERNAL_TARGET_ADDR: kconmon-ng-controller.default.svc.cluster.local:8080
          # RFC 5737 TEST-NET-3: outside allowedCidrs, an IP literal so no
          # resolver can influence the outcome, and reserved for documentation
          # so it is unroutable regardless.
          KCONMON_DENIED_TARGET_ADDR: 203.0.113.10:80

      # A plain Prometheus, not the operator (see e2e/testdata/prometheus.yaml's header). It comes
      # in after the main run, which pins the console's no-Prometheus branches, and before the fault
      # leg, which reads the black-holed pair from the console matrix. The gateway leg later adds the
      # external agent to what it scrapes.
      - name: Apply the Prometheus fixture
        run: |
          kubectl apply -f e2e/testdata/prometheus.yaml
          kubectl wait --for=condition=ready pod \
            -l app=kconmon-e2e-prometheus \
            --timeout=120s

      # Only the console's ConfigMap changes, so only the console rolls; the agents keep their
      # counters and the fixture keeps scraping them.
      - name: Point the console at the fixture Prometheus
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            -f e2e/testdata/prometheus-values.yaml \
            --wait \
            --timeout 5m
          e2e/kind-wait.sh single-pod console

      # The plugin is asserted through its table output, the way people read it.
      - name: Build kubectl-kconmon
        run: go build -o "$RUNNER_TEMP/kubectl-kconmon" ./cmd/kubectl-kconmon

      # Fault injection mutates node iptables, so it runs on its own, after the functional suites and
      # before the gateway overlay changes the release. Every rule is removed by the test's cleanup.
      # Each leg below exists to run its tests, and every one of them skips itself on a missing env var,
      # so e2e/leg-log-check.sh fails the leg on any SKIP or on a -run alternative that matched nothing,
      # instead of passing it as a green no-op.
      - name: Fault-injection E2E tests
        run: |
          set -o pipefail
          AGENT_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=agent \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$AGENT_POD" 8082:8080 &
          AGENT_PF_PID=$!
          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8082/healthz
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8081/healthz
          TESTS=TestFault
          KCONMON_AGENT_POD="$AGENT_POD" go test -tags=e2e -v -count=1 ./e2e/... -run "$TESTS" -timeout 10m \
            | tee "$RUNNER_TEMP/e2e-fault.log"
          e2e/leg-log-check.sh "$RUNNER_TEMP/e2e-fault.log" "fault-injection leg" "$TESTS"
          kill "$AGENT_PF_PID" "$CONSOLE_PF_PID" || true
        env:
          KCONMON_AGENT_URL: http://localhost:8082
          # The console TestFaultMTUBlackHole reads the pmtu matrix from, with the fixture Prometheus.
          KCONMON_CONSOLE_URL: http://localhost:8081
          # The plugin the step above built; kubectlKconmonBinary (e2e/external_test.go) reads it.
          KCONMON_KUBECTL_KCONMON: ${{ runner.temp }}/kubectl-kconmon

      # ---- External-agent leg: gateway, one simulated bare-host agent, HTTP SD ----------------
      # The run above covers the in-cluster fleet. What follows upgrades the same release with the
      # controller's external gateway on (e2e/testdata/gateway-values.yaml), joins ONE simulated
      # external agent through it, and checks what an operator relies on for a bare host: the
      # topology marks it external at the node's address with its ports, the SD endpoint publishes
      # it, a Prometheus reading that endpoint scrapes it, the console matrix and the CLI show it.
      # The degraded-mode steps further down are untouched: they reinstall WITHOUT this overlay.

      # Vendored verbatim from prometheus-operator v0.89.0 and applied server-side; the fixture's
      # header says why. This is what makes the chart's ScrapeConfig admissible on kind.
      - name: Apply the ScrapeConfig CRD
        run: |
          kubectl apply --server-side -f e2e/testdata/scrapeconfig-crd.yaml
          e2e/kind-wait.sh crd scrapeconfigs.monitoring.coreos.com

      # Self-signed, made per run and discarded with the cluster, like the webhook key. The agent
      # dials the gateway by node IP, so every node's InternalIP is an IP SAN; the DNS SAN is the
      # rendered Service name for anyone dialing from inside. Three Secrets, referenced by name from
      # gateway-values.yaml and external-agent-pod.yaml: the serving pair and the token for the
      # controller, and the agent's own copy of CA plus token, never the private key.
      - name: Create the gateway TLS and token Secrets
        run: |
          mkdir -p "$RUNNER_TEMP/gateway"
          cd "$RUNNER_TEMP/gateway"
          SAN="DNS:kconmon-ng-controller-external,DNS:kconmon-ng-controller-external.default.svc"
          for ip in $(kubectl get nodes \
              -o jsonpath='{range .items[*]}{.status.addresses[?(@.type=="InternalIP")].address}{" "}{end}'); do
            SAN="$SAN,IP:$ip"
          done
          echo "SAN: $SAN"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 \
            -subj "/CN=kconmon-e2e-gateway-ca" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" \
            -keyout ca.key -out ca.crt
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -subj "/CN=kconmon-ng-controller-external" -keyout tls.key -out tls.csr
          printf 'subjectAltName=%s\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' "$SAN" > tls.ext
          openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 \
            -extfile tls.ext -out tls.crt
          openssl x509 -in tls.crt -noout -ext subjectAltName
          openssl rand -hex 24 > token
          kubectl create secret tls kconmon-e2e-gateway-tls --cert=tls.crt --key=tls.key \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic kconmon-e2e-gateway-token --from-file=token=token \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic kconmon-e2e-external-agent-creds \
            --from-file=ca.crt=ca.crt --from-file=token=token \
            --dry-run=client -o yaml | kubectl apply -f -

      # Same release, same images, one more values file. helm takes the values wholesale (no
      # --reuse-values), so every reinstall below that leaves gateway-values.yaml out removes the
      # gateway again by itself.
      - name: Enable the external gateway and the ScrapeConfig
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            -f e2e/testdata/prometheus-values.yaml \
            -f e2e/testdata/gateway-values.yaml \
            --wait \
            --timeout 5m
          e2e/kind-wait.sh single-pod controller console
          kubectl get pods -o wide
          # The two objects the overlay adds, as the apiserver holds them: the gateway Service on the
          # pinned NodePort, and the ScrapeConfig the operator's real schema admitted.
          kubectl get service kconmon-ng-controller-external \
            -o jsonpath='{.spec.type} {.spec.ports[0].nodePort}'
          echo
          kubectl get scrapeconfig kconmon-ng-agent-external \
            -o jsonpath='{.spec.jobName} {.spec.httpSDConfigs[0].url}'
          echo

      # One Pod on the host network of the worker the controller is NOT on, so the gateway hop is a
      # real node-to-node one. Node name and gateway address exist only at run time, hence sed; the
      # tests get the same name and IP through GITHUB_ENV.
      - name: Run a simulated external agent
        run: |
          CONTROLLER_NODE=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].spec.nodeName}')
          EXTERNAL_NODE=$(kubectl get nodes -l '!node-role.kubernetes.io/control-plane' \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
            | grep -v "^${CONTROLLER_NODE}$" | head -n 1)
          node_ip() {
            kubectl get node "$1" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}'
          }
          NODE_PORT=$(kubectl get service kconmon-ng-controller-external \
            -o jsonpath='{.spec.ports[0].nodePort}')
          GATEWAY_ADDR="$(node_ip "$CONTROLLER_NODE"):$NODE_PORT"
          EXTERNAL_NODE_IP=$(node_ip "$EXTERNAL_NODE")
          echo "controller on $CONTROLLER_NODE, gateway $GATEWAY_ADDR"
          echo "external agent on $EXTERNAL_NODE ($EXTERNAL_NODE_IP)"
          sed -e "s/__NODE_NAME__/$EXTERNAL_NODE/" -e "s/__CONTROLLER_ADDRESS__/$GATEWAY_ADDR/" \
            e2e/testdata/external-agent-pod.yaml > "$RUNNER_TEMP/external-agent-pod.yaml"
          kubectl apply -f "$RUNNER_TEMP/external-agent-pod.yaml"
          kubectl wait --for=condition=ready pod kconmon-e2e-external-agent --timeout=120s
          kubectl logs kconmon-e2e-external-agent --tail=20
          {
            echo "EXTERNAL_NODE=$EXTERNAL_NODE"
            echo "EXTERNAL_NODE_IP=$EXTERNAL_NODE_IP"
          } >> "$GITHUB_ENV"

      # The controller is forwarded on BOTH listeners: the SD route is asserted on the metrics one
      # (what the ScrapeConfig and the scrape NetworkPolicy use) and compared with the API one.
      - name: Run the external-agent E2E tests
        run: |
          CONTROLLER_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONTROLLER_POD" 8080:8080 9091:9091 &
          CONTROLLER_PF_PID=$!

          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!

          kubectl port-forward service/kconmon-e2e-prometheus 9095:9090 &
          PROM_PF_PID=$!
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8080/healthz
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8081/healthz
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:9095/-/ready

          set -o pipefail
          TESTS=TestExternal
          go test -tags=e2e -v -count=1 ./e2e/... -run "$TESTS" -timeout 15m \
            | tee "$RUNNER_TEMP/e2e-external.log"
          e2e/leg-log-check.sh "$RUNNER_TEMP/e2e-external.log" "external-agent leg" "$TESTS"

          kill "$CONTROLLER_PF_PID" "$CONSOLE_PF_PID" "$PROM_PF_PID" || true
        env:
          KCONMON_CONTROLLER_URL: http://localhost:8080
          KCONMON_SD_URL: http://localhost:9091
          KCONMON_CONSOLE_URL: http://localhost:8081
          KCONMON_PROMETHEUS_URL: http://localhost:9095
          KCONMON_EXTERNAL_NODE_IP: ${{ env.EXTERNAL_NODE_IP }}
          # agent.nodeName in e2e/testdata/external-agent-pod.yaml.
          KCONMON_EXTERNAL_NODE_NAME: edge-host-01
          # job_name of the http_sd job in e2e/testdata/prometheus.yaml.
          KCONMON_EXTERNAL_JOB: kconmon-ng-agent-external
          KCONMON_KUBECTL_KCONMON: ${{ runner.temp }}/kubectl-kconmon

      # The reinstalls below drop the gateway overlay; an external agent left behind would sit
      # redialing a closed port. Remove it so they see the fleet the main run had.
      - name: Retire the external agent
        run: kubectl delete -f "$RUNNER_TEMP/external-agent-pod.yaml" --ignore-not-found --wait=true

      - name: Reinstall console with local auth
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            --set console.auth.mode=local \
            --set console.auth.local.bootstrapAdmin=admin \
            --set console.auth.local.secret.create=true \
            --set console.auth.local.secret.password="$KCONMON_LOCAL_ADMIN_PASSWORD" \
            --wait \
            --timeout 5m
        env:
          KCONMON_LOCAL_ADMIN_PASSWORD: e2e-admin-password-not-a-secret

      - name: Run local-users E2E test
        run: |
          e2e/kind-wait.sh single-pod console
          CONSOLE_POD=$(kubectl get pods -l app.kubernetes.io/component=console -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8081/healthz
          set -o pipefail
          TESTS=TestConsoleLocalUsers
          go test -tags=e2e -v -count=1 ./e2e/... -run "$TESTS" -timeout 3m \
            | tee "$RUNNER_TEMP/e2e-local-users.log"
          e2e/leg-log-check.sh "$RUNNER_TEMP/e2e-local-users.log" "local-users leg" "$TESTS"
          kill "$CONSOLE_PF_PID" || true
        env:
          KCONMON_CONSOLE_URL: http://localhost:8081
          KCONMON_LOCAL_ADMIN_PASSWORD: e2e-admin-password-not-a-secret

      # The console skips the reconciler when there is no database -- alert rules live in PostgreSQL.
      # The database is on exactly when a DSN Secret is named, so clearing database.existingSecret
      # turns it off.
      - name: Reinstall console with database disabled
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            --set database.existingSecret= \
            --wait \
            --timeout 5m

      - name: Run degraded-mode E2E tests
        run: |
          # The pod left over from before the reinstall still has its database; a 503 test against it
          # would see a healthy 200.
          e2e/kind-wait.sh single-pod console
          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8081/healthz
          set -o pipefail
          TESTS=TestConsoleDegradedMode
          go test -tags=e2e -v -count=1 ./e2e/... -run "$TESTS" -timeout 90s \
            | tee "$RUNNER_TEMP/e2e-degraded.log"
          e2e/leg-log-check.sh "$RUNNER_TEMP/e2e-degraded.log" "degraded-mode leg" "$TESTS"
          kill "$CONSOLE_PF_PID" || true
        env:
          KCONMON_CONSOLE_URL: http://localhost:8081

      # ---- NetworkPolicy leg ---------------------------------------------------------------------
      # Every leg above runs with the chart default networkPolicy.enabled=false. This one turns the
      # agent, controller and console policies on (e2e/testdata/networkpolicy-values.yaml) with the
      # database and the fixture Prometheus back, and re-runs the tests whose flows the policies gate.
      # kindnet enforces NetworkPolicy since kind v0.24, so a missing rule fails here.
      - name: Reinstall with NetworkPolicies enforced
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            -f e2e/testdata/prometheus-values.yaml \
            -f e2e/testdata/networkpolicy-values.yaml \
            --wait \
            --timeout 5m
          kubectl get networkpolicy
          # A policy only judges new connections, and the agents' streams to the controller predate
          # it. Restart everything so each flow the tests use is opened under the policies.
          kubectl rollout restart deployment/kconmon-ng-controller
          kubectl rollout status deployment/kconmon-ng-controller --timeout=120s
          kubectl rollout restart deployment/kconmon-ng-console daemonset/kconmon-ng-agent
          kubectl rollout status deployment/kconmon-ng-console --timeout=120s
          kubectl rollout status daemonset/kconmon-ng-agent --timeout=120s
          e2e/kind-wait.sh single-pod console
          kubectl get pods -o wide

      # The leg's negative control for ingress, from the fixture Prometheus pod, which no chart policy
      # selects. The controller and agent policies admit it on the metrics port only, so on the same
      # pod IP with the same tool 9091 must connect and 8080 must not. Only the policy tells the two
      # apart, so a CNI that stopped enforcing fails here instead of passing every test below.
      # nc, not the image's busybox wget: that one segfaults on some responses.
      - name: NetworkPolicies refuse the ports they do not name
        run: |
          set -o pipefail
          probe() {
            kubectl exec deploy/kconmon-e2e-prometheus -- nc -z -w 5 "$1" "$2"
          }
          for component in controller agent; do
            ip=$(kubectl get pods -l "app.kubernetes.io/component=${component}" -o json \
              | jq -er '[.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running")]
                  | .[0].status.podIP')
            admitted=false
            for _ in $(seq 10); do
              if probe "$ip" 9091; then admitted=true; break; fi
              sleep 3
            done
            if [ "$admitted" != true ]; then
              echo "::error::the fixture Prometheus cannot reach the ${component} at ${ip}:9091," \
                "which its policy admits"
              exit 1
            fi
            if probe "$ip" 8080; then
              echo "::error::the fixture Prometheus reached the ${component} at ${ip}:8080, which no ingress rule" \
                "admits from it; NetworkPolicy is not enforced"
              exit 1
            fi
            echo "ok: ${component} ${ip} admits the fixture on 9091 and refuses it on 8080"
          done

      # The chart's own test hook, as an operator or Flux's test.enable runs it. With the policies
      # proven enforced above, the connection-test Pod has to start under its restricted
      # securityContext and reach the controller through the one ingress rule that names it.
      - name: The chart's helm test passes under the NetworkPolicies
        run: helm test kconmon-ng --timeout 2m --logs

      # Registration (TestTopology), console -> controller -> agent dispatch (TestConsoleRuns), ICMP
      # between agents (TestConsoleMTRHistory), agent external egress (TestConsoleExternalCheck*),
      # console -> apiserver (TestConsoleAlertRuleSyncAgainstRealCRD), agent-to-agent tcp/udp/icmp/pmtu,
      # the fixture's scrape and console -> Prometheus (TestFault*). The external-check target is the
      # fixture Prometheus: the controller's own port is closed to agents under its policy, by design.
      # TestNetworkPolicy* is the egress negative control: an agent probe to the console's open port
      # that the allowlist admits and no agent egress rule names must fail.
      # The re-runs are named in full: leg-log-check.sh wants one passing test per -run alternative,
      # so a prefix matching two tests would let either leave the leg. TestNetworkPolicy stays a prefix
      # like in the main suite's -skip, so a new policy test lands here and nowhere else.
      - name: Run NetworkPolicy E2E tests
        run: |
          CONTROLLER_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONTROLLER_POD" 8080:8080 &
          CONTROLLER_PF_PID=$!
          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!
          AGENT_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=agent \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$AGENT_POD" 8082:8080 &
          AGENT_PF_PID=$!
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8080/healthz
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8081/healthz
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8082/healthz
          set -o pipefail
          TESTS='TestTopology|TestConsoleRuns|TestConsoleMTRHistory'
          TESTS="$TESTS|TestConsoleExternalCheckAssignment|TestConsoleExternalCheckDenied"
          TESTS="$TESTS|TestConsoleAlertRuleSyncAgainstRealCRD"
          TESTS="$TESTS|TestFaultPairFailureTriggersMTRAndRecovers|TestFaultMTUBlackHole|TestNetworkPolicy"
          KCONMON_AGENT_POD="$AGENT_POD" go test -tags=e2e -v -count=1 ./e2e/... -timeout 15m -run "$TESTS" \
            | tee "$RUNNER_TEMP/e2e-networkpolicy.log"
          e2e/leg-log-check.sh "$RUNNER_TEMP/e2e-networkpolicy.log" "NetworkPolicy leg" "$TESTS"
          kill "$CONTROLLER_PF_PID" "$CONSOLE_PF_PID" "$AGENT_PF_PID" || true
        env:
          KCONMON_CONTROLLER_URL: http://localhost:8080
          KCONMON_CONSOLE_URL: http://localhost:8081
          KCONMON_AGENT_URL: http://localhost:8082
          KCONMON_EXTERNAL_TARGET_ADDR: kconmon-e2e-prometheus.default.svc.cluster.local:9090
          KCONMON_DENIED_TARGET_ADDR: 203.0.113.10:80
          KCONMON_NETWORKPOLICY_BLOCKED_ADDR: kconmon-ng-console.default.svc.cluster.local:8080
          KCONMON_KUBECTL_KCONMON: ${{ runner.temp }}/kubectl-kconmon

      - name: Collect debug info on failure
        if: ${{ failure() }}
        run: |
          echo "=== Pod status ==="
          kubectl get pods -o wide
          echo "=== Controller logs ==="
          kubectl logs -l app.kubernetes.io/component=controller --tail=50 || true
          echo "=== Agent logs ==="
          kubectl logs -l app.kubernetes.io/component=agent --tail=50 || true
          echo "=== Console logs ==="
          kubectl logs -l app.kubernetes.io/component=console --tail=50 || true
          echo "=== Postgres logs ==="
          kubectl logs -l app=kconmon-e2e-postgres --tail=50 || true
          echo "=== External agent (gateway leg) ==="
          kubectl get pod kconmon-e2e-external-agent -o wide || true
          kubectl logs kconmon-e2e-external-agent --tail=50 || true
          echo "=== Prometheus fixture logs (fault and gateway legs) ==="
          kubectl logs -l app=kconmon-e2e-prometheus --tail=50 || true
          echo "=== PrometheusRule objects ==="
          kubectl get prometheusrules -o yaml || true
          echo "=== Alerting RBAC ==="
          kubectl get role,rolebinding -l app.kubernetes.io/component=console || true
          echo "=== Node FORWARD chains (fault leg) ==="
          for node in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $node"
            docker exec "$node" iptables -S FORWARD || true
          done
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -30
