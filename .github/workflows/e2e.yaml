---
name: E2E

# Reusable workflow: release.yaml calls it between the draft job (images built, release still a
# draft) and the publish job, so nothing user-visible goes out before these tests pass on kind.
on:
  workflow_call:

# Read-only: this job clones, builds a kind cluster and installs the released
# chart. It never pushes anything and never reads GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      # workflow_call shares the caller's github context, and release.yaml only runs on
      # `push: tags: v*` -- so the default checkout ref is always the released tag.
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute build metadata
        id: meta
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "commit=${GITHUB_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Write kind config
        run: |
          cat > kind-config.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          YAML

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kconmon-ng-e2e
          # PINNED alongside the node image, not left to the action's default.
          # `kind load` reads the node's containerd config to patch it, and the images published with
          # kind v0.32.0 write config version 4, which older CLIs refuse: "unknown containerd config
          # version: 4 (supported versions: 2 and 3)". The action still defaults to v0.31.0, so the
          # pair has to move together -- the node image alone is half an upgrade.
          version: v0.32.0
          node_image: kindest/node:v1.36.1
          # , not : the action has no such input, and GitHub drops an unknown one
          # silently -- so the three-node config below was never applied and every run got kind's
          # default single-node cluster. A one-node fleet has no pairs to check, which is why the runs
          # and schedule tests failed and the MTR one skipped itself.
          config: kind-config.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: kconmon-ng-agent:test
          target: agent
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Build controller image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: kconmon-ng-controller:test
          target: controller
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      # Dockerfile.console is a SEPARATE Dockerfile (not a `target:` of the root one, see Makefile's docker-build).
      - name: Build console image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.console
          push: false
          load: true
          tags: kconmon-ng-console:test
          target: console
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Load images into Kind
        run: |
          kind load docker-image kconmon-ng-agent:test --name kconmon-ng-e2e
          kind load docker-image kconmon-ng-controller:test --name kconmon-ng-e2e
          kind load docker-image kconmon-ng-console:test --name kconmon-ng-e2e

      # See e2e/testdata/prometheusrule-crd.yaml's header for what the vendored CRD does and does not cover.
      - name: Apply the PrometheusRule CRD and the foreign rule fixture
        run: |
          kubectl apply -f e2e/testdata/prometheusrule-crd.yaml
          kubectl wait --for condition=established \
            crd/prometheusrules.monitoring.coreos.com \
            --timeout=60s
          kubectl apply -f e2e/testdata/foreign-prometheusrule.yaml
          kubectl get prometheusrule -n default e2e-foreign-rules \
            -o jsonpath='{.metadata.labels}'
          echo

      # Deliberately a plain postgres:17-alpine Deployment/Service, not CNPG -- see e2e/testdata/postgres.yaml's
      # header for why.
      - name: Apply Postgres fixture
        run: |
          kubectl apply -f e2e/testdata/postgres.yaml
          kubectl wait --for=condition=ready pod \
            -l app=kconmon-e2e-postgres \
            --timeout=90s

      # Same shape as the Postgres DSN Secret above -- created here, referenced BY NAME from
      # e2e/testdata/console-values.yaml.
      - name: Create the webhook encryption key Secret
        run: |
          kubectl create secret generic kconmon-e2e-webhooks-key \
            --from-literal=encryptionKey="$(openssl rand -base64 32)" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Same helm as helm-lint and publish pin: this job used the runner image's floating helm,
      # the only unpinned CLI on the release-gating path.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      # No `helm dependency build` here: the chart deliberately has no dependencies (see Chart.yaml).
      - name: Install Helm chart
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            --set controller.image.repository=kconmon-ng-controller \
            --set controller.image.tag=test \
            --set controller.image.pullPolicy=Never \
            --set agent.image.repository=kconmon-ng-agent \
            --set agent.image.tag=test \
            --set agent.image.pullPolicy=Never \
            --set console.image.repository=kconmon-ng-console \
            --set console.image.tag=test \
            --set console.image.pullPolicy=Never \
            --wait \
            --timeout 5m

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=kconmon-ng \
            --timeout=180s

      # The console's sync path fails identically ("this ServiceAccount may not write prometheusrules") whether the
      # Role was never rendered.
      - name: Verify the alerting RBAC rendered
        run: |
          kubectl get role kconmon-ng-console-alerting \
            -o jsonpath='{.rules}'
          echo
          kubectl get rolebinding kconmon-ng-console-alerting \
            -o jsonpath='{.subjects[0].name}'
          echo

      - name: Smoke tests
        run: |
          CONTROLLER_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONTROLLER_POD" 8080:8080 &
          PF_PID=$!
          sleep 3

          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/readyz
          curl -sf http://localhost:8080/metrics | head -20
          curl -sf http://localhost:8080/api/v1/topology

          kill $PF_PID || true

      - name: Run E2E tests
        run: |
          CONTROLLER_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONTROLLER_POD" 8080:8080 &
          CONTROLLER_PF_PID=$!

          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!

          sleep 3

          # Deterministic events for TestConsoleEvents / TestConsoleMetrics The controller's WatchEvents stream has NO
          # replay.
          echo "Waiting for console ingester to subscribe to controller events..."
          DEADLINE=$((SECONDS + 90))
          until curl -sf http://localhost:8081/api/v1/version \
              | jq -e '(.capabilities // []) | index("events")' >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::console ingester did not report the 'events' capability within 90s"
              echo "=== Console logs ==="
              kubectl logs -l app.kubernetes.io/component=console --tail=100 || true
              exit 1
            fi
            sleep 2
          done
          echo "Console ingester subscribed."

          echo "Restarting agent DaemonSet so registrations happen after subscription..."
          kubectl rollout restart daemonset/kconmon-ng-agent
          kubectl rollout status daemonset/kconmon-ng-agent --timeout=90s

          # The agent port-forward is established HERE, strictly AFTER the rollout above, and that ordering is
          # load-bearing.
          AGENT_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=agent \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Forwarding agent metrics from pod/$AGENT_POD"
          kubectl port-forward "pod/$AGENT_POD" 8082:8080 &
          AGENT_PF_PID=$!
          sleep 3

          # TestConsoleDegradedMode needs a SECOND rollout with the database disabled (see the two steps below).
          go test -tags=e2e -v -count=1 ./e2e/... -timeout 25m -skip TestConsoleDegradedMode

          kill "$CONTROLLER_PF_PID" "$CONSOLE_PF_PID" "$AGENT_PF_PID" || true
        env:
          KCONMON_CONTROLLER_URL: http://localhost:8080
          KCONMON_CONSOLE_URL: http://localhost:8081
          KCONMON_AGENT_URL: http://localhost:8082
          # The in-cluster destination the continuous external-check test probes: the controller's own ClusterIP
          # Service.
          KCONMON_EXTERNAL_TARGET_ADDR: kconmon-ng-controller.default.svc.cluster.local:8080
          # RFC 5737 TEST-NET-3: outside allowedCidrs, an IP literal so no
          # resolver can influence the outcome, and reserved for documentation
          # so it is unroutable regardless.
          KCONMON_DENIED_TARGET_ADDR: 203.0.113.10:80

      # The console skips the reconciler when there is no database -- alert rules live in PostgreSQL.
      #
      # Chart 2.x has no console.database.mode: the database is on exactly when a DSN Secret is named,
      # so CLEARING database.existingSecret is what turns it off. The old --set named a key the chart
      # does not read, helm accepted it, and the console kept its database -- every degraded-mode
      # assertion then failed against a fully-functional console.
      - name: Reinstall console with database disabled
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            --set controller.image.repository=kconmon-ng-controller \
            --set controller.image.tag=test \
            --set controller.image.pullPolicy=Never \
            --set agent.image.repository=kconmon-ng-agent \
            --set agent.image.tag=test \
            --set agent.image.pullPolicy=Never \
            --set console.image.repository=kconmon-ng-console \
            --set console.image.tag=test \
            --set console.image.pullPolicy=Never \
            --set database.existingSecret= \
            --wait \
            --timeout 5m

      - name: Run degraded-mode E2E tests
        run: |
          # helm --wait returns when the NEW ReplicaSet is ready, but the OLD console pod can still
          # be Terminating (grace period) and items[0] picks it by creation order -- the first
          # v2.2.0 release run port-forwarded into the pre-rollout pod, which still had its
          # database, and every degraded-mode 503 assertion saw a healthy 200. Wait until exactly
          # one console pod exists, then there is nothing stale to pick.
          for _ in $(seq 60); do
            PODS=$(kubectl get pods -l app.kubernetes.io/component=console --no-headers | wc -l)
            [ "$PODS" -eq 1 ] && break
            sleep 2
          done
          kubectl get pods -l app.kubernetes.io/component=console
          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!
          sleep 3
          go test -tags=e2e -v -count=1 ./e2e/... -run TestConsoleDegradedMode -timeout 90s
          kill "$CONSOLE_PF_PID" || true
        env:
          KCONMON_CONSOLE_URL: http://localhost:8081

      - name: Collect debug info on failure
        if: ${{ failure() }}
        run: |
          echo "=== Pod status ==="
          kubectl get pods -o wide
          echo "=== Controller logs ==="
          kubectl logs -l app.kubernetes.io/component=controller --tail=50 || true
          echo "=== Agent logs ==="
          kubectl logs -l app.kubernetes.io/component=agent --tail=50 || true
          echo "=== Console logs ==="
          kubectl logs -l app.kubernetes.io/component=console --tail=50 || true
          echo "=== Postgres logs ==="
          kubectl logs -l app=kconmon-e2e-postgres --tail=50 || true
          echo "=== PrometheusRule objects (M7) ==="
          kubectl get prometheusrules -o yaml || true
          echo "=== Alerting RBAC (M7) ==="
          kubectl get role,rolebinding -l app.kubernetes.io/component=console || true
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -30
