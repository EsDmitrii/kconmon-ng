---
name: E2E

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

# Read-only: this job clones, builds a kind cluster and installs the released
# chart. It never pushes anything and never reads GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # CodeQL flags workflow_run + checkout of workflow_run.head_sha as an
      # untrusted checkout in a privileged context. That pattern is dangerous
      # when the triggering workflow can be started from a fork PR. It cannot
      # here: the parent is Release, which triggers only on `push: tags: v*`,
      # and a fork cannot push a tag to this repo. head_sha is therefore always
      # a commit that already lives on this repository. Do not "fix" this by
      # checking out a fixed ref: the tag lookup below needs that exact commit.
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect release tag and build metadata
        id: meta
        run: |
          set -e
          git fetch --tags --force

          TAG="$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep '^v' | head -n1 || true)"
          if [ -z "$TAG" ]; then
            echo "No v* tag points at this commit. Skipping E2E."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Write kind config
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          cat > kind-config.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          YAML

      - name: Create Kind cluster
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: helm/kind-action@v1
        with:
          cluster_name: kconmon-ng-e2e
          node_image: kindest/node:v1.31.0
          config_file: kind-config.yaml

      - name: Set up Docker Buildx
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Build agent image
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kconmon-ng-agent:test
          target: agent
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Build controller image
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kconmon-ng-controller:test
          target: controller
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      # Dockerfile.console is a SEPARATE Dockerfile (not a `target:` of the
      # root one, see Makefile's docker-build) -- it stages the SPA build
      # (web/) through a node image before the Go build, so `file:` must
      # point at it explicitly.
      - name: Build console image
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.console
          push: false
          load: true
          tags: kconmon-ng-console:test
          target: console
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Load images into Kind
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          kind load docker-image kconmon-ng-agent:test --name kconmon-ng-e2e
          kind load docker-image kconmon-ng-controller:test --name kconmon-ng-e2e
          kind load docker-image kconmon-ng-console:test --name kconmon-ng-e2e

      # M7 Decision 14: the console's PrometheusRule reconciler is a
      # server-side apply against monitoring.coreos.com/v1, and SSA needs the
      # CRD -- not the Prometheus Operator behind it, which is deliberately
      # NOT installed here (nothing in this cluster ever evaluates a rule).
      # See e2e/testdata/prometheusrule-crd.yaml's header for what the
      # vendored CRD does and does not cover.
      #
      # Applied BEFORE the Helm install for the same reason as the Secrets
      # above: console.alerting.enabled=true (e2e/testdata/console-values.yaml)
      # builds the reconciler at boot, and a console that came up before the
      # resource was served would spend its first reconciles reporting a
      # crd-missing cause on every rule.
      #
      # The `wait --for condition=established` is load-bearing, not belt and
      # braces: `kubectl apply` on a CRD returns as soon as the object is
      # accepted, and the FIRST write to the new resource races the
      # apiserver's discovery refresh. The foreign fixture below is exactly
      # such a write.
      - name: Apply the PrometheusRule CRD and the foreign rule fixture
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          kubectl apply -f e2e/testdata/prometheusrule-crd.yaml
          kubectl wait --for condition=established \
            crd/prometheusrules.monitoring.coreos.com \
            --timeout=60s
          kubectl apply -f e2e/testdata/foreign-prometheusrule.yaml
          kubectl get prometheusrule -n default e2e-foreign-rules \
            -o jsonpath='{.metadata.labels}'
          echo

      # Deliberately a plain postgres:17-alpine Deployment/Service, not CNPG
      # -- see e2e/testdata/postgres.yaml's header for why. Applied BEFORE
      # the Helm install: the console Pod mounts the Secret's "dsn" key at
      # boot and fails readiness without it already existing.
      - name: Apply Postgres fixture
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          kubectl apply -f e2e/testdata/postgres.yaml
          kubectl wait --for=condition=ready pod \
            -l app=kconmon-e2e-postgres \
            --timeout=90s

      # The AES-256-GCM key that seals each webhook endpoint's HMAC secret at
      # rest (M6). Same shape as the Postgres DSN Secret above -- created
      # here, referenced BY NAME from e2e/testdata/console-values.yaml, never
      # templated by the chart -- and applied BEFORE the install for the same
      # reason: the console mounts it as a file and an unreadable
      # encryptionKeyFile is fatal at boot, not a warning.
      #
      # Generated inline and thrown away with the cluster. It is a throwaway
      # key for a throwaway database in a throwaway kind cluster, so it is
      # deliberately NOT a repository secret: a fixed one would be a real key
      # checked into CI config, and this one protects nothing that outlives
      # the job. --dry-run=client | apply keeps the step re-runnable.
      - name: Create the webhook encryption key Secret
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          kubectl create secret generic kconmon-e2e-webhooks-key \
            --from-literal=encryptionKey="$(openssl rand -base64 32)" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Helm chart
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            --set controller.image.repository=kconmon-ng-controller \
            --set controller.image.tag=test \
            --set controller.image.pullPolicy=Never \
            --set agent.image.repository=kconmon-ng-agent \
            --set agent.image.tag=test \
            --set agent.image.pullPolicy=Never \
            --set console.image.repository=kconmon-ng-console \
            --set console.image.tag=test \
            --set console.image.pullPolicy=Never \
            --wait \
            --timeout 5m

      - name: Wait for pods
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=kconmon-ng \
            --timeout=180s

      # M7 Task 13's RBAC, asserted as a MANIFEST fact before any test asserts
      # it as a BEHAVIOUR. The console's sync path fails identically ("this
      # ServiceAccount may not write prometheusrules") whether the Role was
      # never rendered, was rendered with the wrong name, or was bound to the
      # wrong subject -- and TestConsoleAlertRuleSyncAgainstRealCRD can only
      # report the symptom. This step names the cause first, and fails the job
      # 20 minutes earlier than the test would.
      #
      # A Role and a RoleBinding, NOT a ClusterRole (M7 Decision 3,
      # SECURITY.md §10.3): the console writes one PrometheusRule into its own
      # namespace, and a Role cannot be made to reach further.
      - name: Verify the alerting RBAC rendered
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          kubectl get role kconmon-ng-console-alerting \
            -o jsonpath='{.rules}'
          echo
          kubectl get rolebinding kconmon-ng-console-alerting \
            -o jsonpath='{.subjects[0].name}'
          echo

      - name: Smoke tests
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          CONTROLLER_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONTROLLER_POD" 8080:8080 &
          PF_PID=$!
          sleep 3

          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/readyz
          curl -sf http://localhost:8080/metrics | head -20
          curl -sf http://localhost:8080/api/v1/topology

          kill $PF_PID || true

      - name: Run E2E tests
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          CONTROLLER_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=controller \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONTROLLER_POD" 8080:8080 &
          CONTROLLER_PF_PID=$!

          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!

          sleep 3

          # --- Deterministic events for TestConsoleEvents / TestConsoleMetrics ---
          # The controller's WatchEvents stream has NO replay: each agent emits its
          # topology_changed event exactly ONCE, at registration, to whoever is
          # subscribed at that instant. `helm upgrade --install --wait` above already
          # let every agent register while the console's ingester may not yet have
          # subscribed, so without this step GET /api/v1/events can stay empty
          # forever -- TestConsoleEvents (60s poll) and TestConsoleMetrics (which
          # depends on the same store-write pipeline) would then fail on a timing
          # race, not a real regression.
          #
          # Fix: wait until the console itself reports its ingester subscribed --
          # /api/v1/version's "capabilities" is computed per-request from live
          # ingester health (internal/console/httpapi/server.go's capabilities()),
          # so capabilities containing "events" IS the "subscribed" signal -- then
          # force every agent to re-register by restarting the DaemonSet. Those
          # fresh registrations happen strictly after the subscription, so the
          # topology_changed events they emit are guaranteed to be observed.
          echo "Waiting for console ingester to subscribe to controller events..."
          DEADLINE=$((SECONDS + 90))
          until curl -sf http://localhost:8081/api/v1/version \
              | jq -e '(.capabilities // []) | index("events")' >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::console ingester did not report the 'events' capability within 90s"
              echo "=== Console logs ==="
              kubectl logs -l app.kubernetes.io/component=console --tail=100 || true
              exit 1
            fi
            sleep 2
          done
          echo "Console ingester subscribed."

          echo "Restarting agent DaemonSet so registrations happen after subscription..."
          kubectl rollout restart daemonset/kconmon-ng-agent
          kubectl rollout status daemonset/kconmon-ng-agent --timeout=90s

          # The agent port-forward is established HERE, strictly AFTER the
          # rollout above, and that ordering is load-bearing: a forward opened
          # alongside the controller/console ones would point at a Pod the
          # restart then deletes, and every external-check assertion would fail
          # on a dead tunnel rather than on the pipeline it is testing.
          #
          # ONE agent Pod is enough. The continuous external-check tests use
          # sourceSelection "all", so whichever Pod this picks is in the
          # assignment, and the agent's own /metrics is the only place an
          # external result or refusal is ever observable -- it never travels
          # back to the console.
          AGENT_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=agent \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Forwarding agent metrics from pod/$AGENT_POD"
          kubectl port-forward "pod/$AGENT_POD" 8082:8080 &
          AGENT_PF_PID=$!
          sleep 3

          # TestConsoleDegradedMode needs a SECOND rollout with the database
          # disabled (see the two steps below) -- excluded here so it does
          # not run against this (database-enabled) deployment.
          #
          # The timeout is 25m, not 5m: TestConsoleSchedule waits out several
          # 10s schedule intervals to prove a DISABLED schedule stops firing,
          # and the two external-check tests each poll an agent's /metrics for
          # up to 180s while the reconcile -> controller -> agent chain
          # converges. M6 adds two more wide budgets on top -- 120s for the
          # first captured Kubernetes event and 90s for a webhook /test ping's
          # outcome to land. Those budgets are wide on purpose (see their
          # comments), so the package budget has to clear their sum.
          #
          # M7 raised it from 20m by arithmetic, not by superstition: the
          # existing pollUntil budgets already sum to ~18m worst case, and the
          # alerting tests add two more (alertSyncBudget 90s twice, in
          # TestConsoleAlertRuleSyncAgainstRealCRD) plus a 30s wait for the
          # first topology frame on the WebSocket. 18m + 3m10s has no headroom
          # under 20m; 25m does.
          go test -tags=e2e -v -count=1 ./e2e/... -timeout 25m -skip TestConsoleDegradedMode

          kill "$CONTROLLER_PF_PID" "$CONSOLE_PF_PID" "$AGENT_PF_PID" || true
        env:
          KCONMON_CONTROLLER_URL: http://localhost:8080
          KCONMON_CONSOLE_URL: http://localhost:8081
          KCONMON_AGENT_URL: http://localhost:8082
          # The in-cluster destination the continuous external-check test
          # probes: the controller's own ClusterIP Service, whose address sits
          # inside the kind Service CIDR that e2e/testdata/values.yaml's
          # allowedCidrs covers. No internet egress anywhere in this test.
          KCONMON_EXTERNAL_TARGET_ADDR: kconmon-ng-controller.default.svc.cluster.local:8080
          # RFC 5737 TEST-NET-3: outside allowedCidrs, an IP literal so no
          # resolver can influence the outcome, and reserved for documentation
          # so it is unroutable regardless.
          KCONMON_DENIED_TARGET_ADDR: 203.0.113.10:80

      # Phase A guarantee (M3 plan): with console.database.mode=disabled the
      # M1/M2 surface stays up and only the M3 database-backed endpoints
      # degrade to 503. Verified here in a real cluster via a second rollout,
      # not just in a unit test. --wait blocks until the new console Pod is
      # ready, so no separate rollout-status step is needed.
      #
      # M7 note: console.alerting.enabled stays TRUE across this rollout (it
      # comes from console-values.yaml and is not overridden below), which is
      # deliberate. The console skips the reconciler when there is no database
      # -- alert rules live in PostgreSQL -- so this rollout is also the only
      # place the API's 409-vs-503 split can be observed: the CRUD surface
      # answers 503 (no store) while GET /api/v1/alert-rules/foreign answers
      # 409 naming the feature flag (no reconciler). TestConsoleDegradedMode
      # asserts both.
      - name: Reinstall console with database disabled
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          helm upgrade --install kconmon-ng ./charts/kconmon-ng \
            -f e2e/testdata/values.yaml \
            -f e2e/testdata/console-values.yaml \
            --set controller.image.repository=kconmon-ng-controller \
            --set controller.image.tag=test \
            --set controller.image.pullPolicy=Never \
            --set agent.image.repository=kconmon-ng-agent \
            --set agent.image.tag=test \
            --set agent.image.pullPolicy=Never \
            --set console.image.repository=kconmon-ng-console \
            --set console.image.tag=test \
            --set console.image.pullPolicy=Never \
            --set console.database.mode=disabled \
            --wait \
            --timeout 5m

      - name: Run degraded-mode E2E tests
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          CONSOLE_POD=$(kubectl get pods \
            -l app.kubernetes.io/component=console \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "pod/$CONSOLE_POD" 8081:8080 &
          CONSOLE_PF_PID=$!
          sleep 3
          go test -tags=e2e -v -count=1 ./e2e/... -run TestConsoleDegradedMode -timeout 90s
          kill "$CONSOLE_PF_PID" || true
        env:
          KCONMON_CONSOLE_URL: http://localhost:8081

      - name: Collect debug info on failure
        if: ${{ steps.meta.outputs.skip != 'true' && failure() }}
        run: |
          echo "=== Pod status ==="
          kubectl get pods -o wide
          echo "=== Controller logs ==="
          kubectl logs -l app.kubernetes.io/component=controller --tail=50 || true
          echo "=== Agent logs ==="
          kubectl logs -l app.kubernetes.io/component=agent --tail=50 || true
          echo "=== Console logs ==="
          kubectl logs -l app.kubernetes.io/component=console --tail=50 || true
          echo "=== Postgres logs ==="
          kubectl logs -l app=kconmon-e2e-postgres --tail=50 || true
          echo "=== PrometheusRule objects (M7) ==="
          kubectl get prometheusrules -o yaml || true
          echo "=== Alerting RBAC (M7) ==="
          kubectl get role,rolebinding -l app.kubernetes.io/component=console || true
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -30
