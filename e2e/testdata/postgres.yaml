---
# E2E PostgreSQL fixture behind database.existingSecret; installing the CNPG operator here and waiting for its CRDs
# would add minutes and a whole new failure mode to e2e for ZERO additional coverage of kconmon-ng's own code.
apiVersion: v1
kind: Secret
metadata:
  name: kconmon-e2e-postgres
type: Opaque
stringData:
  # The chart's database.existingSecretKey default is "console-database-dsn"; console-values.yaml overrides it to
  # this key.
  dsn: postgres://kconmon:kconmon@kconmon-e2e-postgres:5432/kconmon?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kconmon-e2e-postgres
  labels:
    app: kconmon-e2e-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kconmon-e2e-postgres
  template:
    metadata:
      labels:
        app: kconmon-e2e-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: kconmon
            - name: POSTGRES_PASSWORD
              value: kconmon
            - name: POSTGRES_DB
              value: kconmon
            # Skips the fsync-heavy default init on kind's already-ephemeral
            # overlay storage -- this fixture is discarded with the cluster.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kconmon", "-d", "kconmon"]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kconmon", "-d", "kconmon"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kconmon-e2e-postgres
spec:
  selector:
    app: kconmon-e2e-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
