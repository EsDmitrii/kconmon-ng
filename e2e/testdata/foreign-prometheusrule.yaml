---
# A PrometheusRule this console does NOT own -- the fixture behind TestConsoleAlertRuleForeignImport.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: e2e-foreign-rules
  namespace: default
  labels:
    app.kubernetes.io/managed-by: e2e-fixture
spec:
  groups:
    - name: e2e-foreign
      rules:
        - alert: E2eForeignTargetDown
          expr: vector(1) > 0
          for: 2m
          labels:
            severity: critical
            origin: e2e-fixture
          annotations:
            summary: a foreign alert the console may adopt but must never edit
        - record: e2e_foreign_recording
          expr: vector(0)
