---
# The PrometheusRule CRD, for the e2e kind cluster only.
# yamllint limit, so vendoring it byte-for-byte would mean either a lint
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: prometheusrules.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  scope: Namespaced
  names:
    kind: PrometheusRule
    listKind: PrometheusRuleList
    plural: prometheusrules
    singular: prometheusrule
    categories:
      - prometheus-operator
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                groups:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      interval:
                        type: string
                      limit:
                        type: integer
                      partial_response_strategy:
                        type: string
                      rules:
                        type: array
                        items:
                          type: object
                          required:
                            - expr
                          properties:
                            alert:
                              type: string
                            record:
                              type: string
                            # Upstream declares expr as int-or-string; the same relaxation is kept here so a numeric
                            # expr in somebody's foreign object is not rejected by the fixture cluster when the real
                            # one accepts it.
                            expr:
                              x-kubernetes-int-or-string: true
                            for:
                              type: string
                            keep_firing_for:
                              type: string
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                            annotations:
                              type: object
                              additionalProperties:
                                type: string
