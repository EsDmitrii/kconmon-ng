---
# Minimal values for e2e testing. Every install passes this file first, so the image names the
# workflow builds or retags, and loads into kind, live here and nowhere else.
controller:
  image:
    repository: kconmon-ng-controller
    tag: test
    pullPolicy: Never
  replicaCount: 1
  leaderElection: false
  # Inert at replicaCount 1 (the chart only renders it above that), kept explicit.
  pdb:
    enabled: false

agent:
  image:
    repository: kconmon-ng-agent
    tag: test
    pullPolicy: Never
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

console:
  image:
    repository: kconmon-ng-console
    tag: test
    pullPolicy: Never

config:
  checkers:
    tcp:
      enabled: true
    # UDP and ICMP are the control in TestFaultMTUBlackHole: they must stay green on the pair the
    # length rule black-holes.
    udp:
      enabled: true
    icmp:
      enabled: true
    # Faster than production so the black-hole scenario fits the e2e budget: a 10s round, a 200ms
    # per-datagram timeout (the whole bisection stays under 4s).
    pmtu:
      enabled: true
      interval: 10s
      timeout: 200ms
    dns:
      enabled: false
    http:
      enabled: false
    mtr:
      maxHops: 5
    # Continuous external checks, enabled so TestConsoleExternalCheckAssignment and TestConsoleExternalCheckDenied
    # have an agent-side pipeline to observe at all (with this off the whole kconmon_ng_external_* family stays empty
    # and both tests would time out on a config flag rather than a bug).
    external:
      enabled: true
      # THE KIND CLUSTER'S OWN NETWORKS AND NOTHING ELSE; deliberately NO public-address carve-out: the e2e must never
      # egress to the internet.
      allowedCidrs:
        - "10.244.0.0/16"
        - "10.96.0.0/12"
      # Restated rather than inherited: the link-local metadata address is the
      # one destination that must stay refused even if someone widens the list
      # above, and denied wins over allowed.
      deniedCidrs:
        - "169.254.169.254/32"
      maxTargets: 100
      timeout: 10s
