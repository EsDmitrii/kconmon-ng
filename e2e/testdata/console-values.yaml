---
# Console overlay for e2e; layered on top of e2e/testdata/values.yaml (both passed to `helm upgrade --install` with
# -f, this file last so it wins).
networkPolicy:
  enabled: false

controller:
  events:
    enabled: true

# The Postgres fixture from e2e/testdata/postgres.yaml; its Secret carries the DSN under "dsn", so the non-default key
# is named explicitly. No redis on purpose: one console replica runs the in-process bus, exactly the single-replica
# shape the chart permits without a shared bus.
database:
  existingSecret: kconmon-e2e-postgres
  existingSecretKey: dsn

console:
  enabled: true
  replicas: 1
  auth:
    mode: anonymous
    anonymous:
      role: admin
  # TestConsoleRuns, the runs the schedule loop's own dispatches are not counted for (they never traverse the HTTP
  # handler).
  rateLimit:
    runsPerMinute: 1000
  # Drives TestConsoleSchedule and both external-check tests. tickInterval is
  # left at the chart default (5s) on purpose: it is the reconcile cadence too,
  # and the poll budgets in e2e/console_test.go are written against it.
  scheduler:
    enabled: true
  # Kubernetes context capture. namespace is left at the chart default ("" = the release namespace, read from
  # POD_NAMESPACE via the downward API).
  kubernetesContext:
    enabled: true
  # PrometheusRule sync. namespace, syncInterval and bundleName are all left at the chart defaults on purpose; that is
  # not a gap, it is the assertion -- GET /api/v1/alert-rules/foreign answers 409 naming console.alerting.enabled
  # rather than 503.
  alerting:
    enabled: true
  # The webhook cipher key, in a Secret the workflow creates from `openssl
  # rand -base64 32` right before the install. Named, never inlined: the chart
  # has no value that would take the key itself, on purpose.
  webhooks:
    existingSecret: kconmon-e2e-webhooks-key
    existingSecretKey: encryptionKey
