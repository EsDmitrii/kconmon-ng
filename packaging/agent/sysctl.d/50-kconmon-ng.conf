# The ICMP checker opens an unprivileged datagram ICMP socket (internal/checker/icmp.go), which the
# kernel gates on net.ipv4.ping_group_range — CAP_NET_RAW does not apply to it. The kconmon-ng
# group's GID is allocated dynamically by `useradd -r` in postinstall, so a static file cannot name
# it; the full range mirrors systemd's own 50-default.conf. Narrow it in /etc/sysctl.d if needed.
net.ipv4.ping_group_range = 0 2147483647
